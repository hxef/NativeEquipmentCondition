PERK_DISCOUNT_WEAPONS=主要由此輔助能力的改造配件組成的武器，在工作台修理時所需的元件減少{0}%。
PERK_DISCOUNT_ARMOR=主要由此輔助能力的改造配件組成的裝甲，在工作台修理時所需的元件減少{0}%。
PERK_DISCOUNT_BOTH=主要由此輔助能力的改造配件組成的武器和裝甲，在工作台修理時所需的元件減少{0}%。
WEAR_TITLE=損耗
WEAPONS_TITLE=武器
LOOT_TITLE=戰利品與價格
REPAIRS_TITLE=修理
HUD_TITLE=狀態欄
EXTRAS_TITLE=其他小功能
LOG_TITLE=日誌

[Page switches]
JAM_HELP=你的槍枝狀況低於一半時可能卡彈，重新裝填才能排除。關閉時，槍枝不會卡彈。
SPAWN_CONDITION_HELP=你找到的武器和裝甲已有損耗，程度取決於原本的持有者。關閉時，皆為全新。
VENDOR_REPAIR_HELP=販售武器、裝甲或服飾的商人會收瓶蓋修理你的同類裝備。關閉時，只有工作台能修理。
LOADING_TIPS_HELP=在載入畫面加入損耗、修理和戰利品的相關提示。關閉時，不會顯示這些提示。
HUD_CONDITION_HELP=在彈藥計數旁和動力裝甲中顯示狀況條。關閉時，物品資訊仍會顯示狀況。
QUICK_CONTAINER_HELP=看向容器或屍體時，彈出的清單會顯示狀況。關閉時則不顯示。
CONFIRM_SCROLL_HELP=原版遊戲修正。工作台確認視窗會放大並可捲動。關閉時，視窗可能維持原本大小。
INSPECT_PRICE_HELP=原版遊戲修正。與商人交易時，檢查物品會顯示正確的買賣價。關閉時，價格可能有誤。
TRACE_LOGS_NAME=錯誤回報日誌
TRACE_LOGS_HELP=在NEC.log旁另外寫入3個日誌，協助錯誤回報。日誌增長很快，平常遊玩時請保持關閉。

[Page wear]
WEAR_RATE_NAME=武器損耗速度
WEAR_RATE_HELP=你的武器損耗的速度。1為正常，2為2倍速度，0則停止損耗。
NPC_WEAR_RATE_NAME=其他角色的武器損耗速度
NPC_WEAR_RATE_HELP=其他角色的武器損耗的速度。1為正常，0.33為三分之一速度，0則停止損耗。
AUTO_WEAR_RATE_NAME=自動武器損耗速度
AUTO_WEAR_RATE_HELP=射擊或切割時，乘以上方的損耗速度。1為正常，2為兩倍速度，0則停止損耗。
ARMOR_WEAR_RATE_NAME=裝甲損耗速度
ARMOR_WEAR_RATE_HELP=你的裝甲損耗的速度。1為正常，2為2倍速度，0則停止損耗。
NPC_ARMOR_WEAR_RATE_NAME=其他角色的裝甲損耗速度
NPC_ARMOR_WEAR_RATE_HELP=其他角色的裝甲損耗的速度。1為正常，0.33為三分之一速度，0則停止損耗。

[Page numbers]
DAMAGE_FLOOR_NAME=狀況為0時的傷害
DAMAGE_FLOOR_HELP=武器在狀況為0時保留多少傷害。設為1時，損耗不會降低傷害。
WEAPON_START_NAME=武器懲罰開始的狀況
WEAPON_START_HELP=低於此狀況時，損耗會降低武器的性能。設為0.5時，武器在狀況降到一半前都如同全新。
ARMOR_FLOOR_NAME=狀況為0時的防護
ARMOR_FLOOR_HELP=裝甲在狀況為0時保留多少防護。設為1時，損耗不會降低防護。
ARMOR_START_NAME=裝甲懲罰開始的狀況
ARMOR_START_HELP=低於此狀況時，損耗會降低裝甲的防護。設為0.5時，裝甲在狀況降到一半前都如同全新。
VALUE_EXPONENT_NAME=損耗降低價格
VALUE_EXPONENT_HELP=損耗物品失去價值的速度。設為1.5時，狀況一半的物品值原價35%。設為0則保持原價。
FIRE_RATE_FLOOR_NAME=狀況為0時的射速
FIRE_RATE_FLOOR_HELP=自動武器在狀況為0時仍保有多少射速。設為1時，損耗不會降低射速。
CRIT_METER_FLOOR_NAME=狀況為0時的爆擊
CRIT_METER_FLOOR_HELP=武器在狀況為0時保留多少爆擊，對你和其他角色都適用。設為1時，損耗不會減少爆擊。
ACCURACY_FLOOR_NAME=狀況為0時的準度
ACCURACY_FLOOR_HELP=槍枝在狀況為0時保有多少準度。設為0.75時散布擴大三分之一，設為1時不會降低。
RANGE_FLOOR_NAME=狀況為0時的射程
RANGE_FLOOR_HELP=槍枝在狀況為0時維持傷害的距離比例。設為0時都像遠距離射擊，設為1時不縮短。
BENCH_COST_NAME=工作台修理成本
BENCH_COST_HELP=在工作台修理所需的元件數量。0.5會使花費減半，2則加倍，0則讓所有修理免費。
FREE_MEND_NAME=免費修補的狀況
FREE_MEND_HELP=狀況高於此值時，在工作台修補免費。設為100則取消，設為0則損壞物品以外皆可修補。
TRADER_PRICE_NAME=商人修理價格
TRADER_PRICE_HELP=商人修理所收取的瓶蓋數量。0.5會使價格減半，2則加倍。

[Page HUD and log]
HUD_BAR_X_NAME=狀態欄狀況條距左緣
HUD_BAR_X_HELP=彈藥計數旁狀況條與文字的起點，從左緣算起，任何解析度皆同。
HUD_BAR_Y_NAME=狀態欄狀況條距上緣
HUD_BAR_Y_HELP=彈藥計數旁狀況條與文字的起點，從上緣算起，任何解析度皆同。
HUD_BAR_DEFAULT=預設為{0}。
POWER_ARMOR_BAR_X_NAME=動力裝甲狀況條左右位置
POWER_ARMOR_BAR_X_HELP=移動動力裝甲中的狀況條：大於0向右，小於0向左。超出螢幕邊緣時會隱藏。
POWER_ARMOR_BAR_Y_NAME=動力裝甲狀況條上下位置
POWER_ARMOR_BAR_Y_HELP=移動動力裝甲中的狀況條：大於0向上，小於0向下。超出螢幕邊緣時會隱藏。
LOG_LEVEL_NAME=日誌詳細程度
LOG_LEVEL_HELP=NEC.log（位於Documents\My Games\Fallout4\F4SE）的詳細程度。回報錯誤時請選debug。

