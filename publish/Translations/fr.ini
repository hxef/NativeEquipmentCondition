TRADER_FULL_STOCK_NAME=Stock pour une réparation totale
TRADER_FULL_STOCK_HELP=Un marchand qui a ce nombre d'articles différents d'un type en stock le répare à 100 %. Avec moins, il le répare moins haut.
RAW_FOOD_DAYS_NAME=Durée de la nourriture crue
