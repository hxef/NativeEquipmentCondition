[Page switches]
JAM_HELP=自分の銃は状態半分未満で弾詰まりすることがあり、リロードで直ります。OFFで無効
SPAWN_CONDITION_HELP=見つけた武器とアーマーは、前の持ち主に応じて消耗しています。OFFにすると新品です
VENDOR_REPAIR_HELP=武器、アーマー、服を売る商人がキャップで修理します。OFFでは作業台のみです
LOADING_TIPS_HELP=消耗、修理、戦利品のヒントをロード画面に追加します。OFFにすると表示されません
HUD_CONDITION_HELP=弾薬の横とパワーアーマーに状態バーを表示します。OFFでもアイテム情報に出ます
QUICK_CONTAINER_HELP=容器や死体を見たときの一覧に状態を表示します。OFFにすると表示されません
CONFIRM_SCROLL_HELP=ゲームの不具合修正。作業台の確認画面が広がりスクロール可。OFFでは小さいことも
INSPECT_PRICE_HELP=ゲームの不具合修正。取引中に調べると正しい価格が出ます。OFFでは誤ることも
TRACE_LOGS_NAME=バグ報告用ログ
TRACE_LOGS_HELP=バグ報告用にNEC.logの隣へログを3つ追加します。すぐ大きくなるので普段はOFFに

[Page wear]
WEAR_RATE_NAME=武器の消耗速度
WEAR_RATE_HELP=自分の武器が消耗する速さです。1で通常、2で2倍の速さ、0で消耗しなくなります
NPC_WEAR_RATE_NAME=NPCの武器の消耗速度
NPC_WEAR_RATE_HELP=NPCの武器が消耗する速さです。1で通常、0.33で3分の1の速さ、0で消耗しなくなります
AUTO_WEAR_RATE_NAME=オートマチック武器の消耗速度
AUTO_WEAR_RATE_HELP=射撃や切断時、上の消耗速度に掛けます。1で通常、2で2倍、0で消耗しなくなります
ARMOR_WEAR_RATE_NAME=アーマーの消耗速度
ARMOR_WEAR_RATE_HELP=自分のアーマーが消耗する速さです。1で通常、2で2倍の速さ、0で消耗しなくなります
NPC_ARMOR_WEAR_RATE_NAME=NPCのアーマーの消耗速度
NPC_ARMOR_WEAR_RATE_HELP=NPCのアーマーが消耗する速さです。1で通常、0.33で3分の1、0で消耗しなくなります

[Page numbers]
DAMAGE_FLOOR_NAME=状態0でのダメージ
DAMAGE_FLOOR_HELP=状態0の武器に残るダメージの割合です。1にすると、消耗してもダメージは下がりません
WEAPON_START_NAME=武器のペナルティが始まる状態
WEAPON_START_HELP=この状態を下回ると、消耗で性能が下がります。0.5では半分の状態まで新品同様です
ARMOR_FLOOR_NAME=状態0での防御力
ARMOR_FLOOR_HELP=状態0のアーマーに残る防御力の割合です。1にすると、消耗しても防御力は下がりません
ARMOR_START_NAME=アーマーのペナルティが始まる状態
ARMOR_START_HELP=この状態を下回ると、消耗で防御力が下がります。0.5では半分の状態まで新品同様です
VALUE_EXPONENT_NAME=消耗による値下がり
VALUE_EXPONENT_HELP=消耗したアイテムの値下がりの速さです。1.5では状態半分で35%、0で下がりません
FIRE_RATE_FLOOR_NAME=状態0での発射速度
FIRE_RATE_FLOOR_HELP=状態0のフルオート武器に残る発射速度の割合です。1で消耗しても遅くなりません
CRIT_METER_FLOOR_NAME=状態0でのクリティカル
CRIT_METER_FLOOR_HELP=状態0の武器に残るクリティカルの割合で、自分とNPCに適用。1で消耗しても減りません
ACCURACY_FLOOR_NAME=状態0での精度
ACCURACY_FLOOR_HELP=状態0の銃に残る精度の割合です。0.75でばらつきが3分の1広がり、1で下がりません
RANGE_FLOOR_NAME=状態0での射程
RANGE_FLOOR_HELP=状態0の銃がダメージを保つ距離の割合です。0では常に遠距離扱い、1で短くなりません
BENCH_COST_NAME=作業台での修理コスト
BENCH_COST_HELP=作業台の修理に必要な部品の量です。0.5で半分、2で2倍、0で無料になります
FREE_MEND_NAME=無料で手入れする状態
FREE_MEND_HELP=この状態より上は作業台の手入れが無料です。100で無効、0で壊れた物以外が対象です
TRADER_PRICE_NAME=商人の修理価格
TRADER_PRICE_HELP=商人が修理に求めるキャップの額です。0.5で半分、2で2倍になります

