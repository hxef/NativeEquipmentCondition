[Page switches]
; The switch at the top of NEC's main page that turns all of NEC on or off.
NEC_ON_NAME=Toutes les fonctions de NEC
NEC_ON_HELP=Active ou désactive tout NEC en jeu. Désactivé : les préréglages et les autres pages de NEC se masquent, et armes et armures gardent leur état.
PLAIN_APPAREL_NAME=Vêtements simples jamais usés
PLAIN_APPAREL_HELP=Les vêtements sans valeur d'armure ni bonus ne s'usent jamais et n'affichent pas d'état. Désactivé : ils s'usent comme une armure.
SPAWN_CONDITION_HELP=Les armes et armures trouvées sont déjà usées, selon leur provenance et leur ancien porteur. Désactivé : elles sont neuves.
VENDOR_REPAIR_HELP=Les marchands d'armes, d'armures ou de vêtements réparent contre des capsules. Désactivé : ils ne réparent rien.
TRADER_SIGN_NAME=Panneau des réparations du marchand
TRADER_SIGN_HELP=Affiche à l'écran de troc jusqu'où un marchand répare les armes, les armures et les vêtements. Si désactivé, sa fenêtre de réparation l'indique.
WORKBENCH_REPAIR_NAME=Réparations à l'établi
WORKBENCH_REPAIR_HELP=Les établis réparent armes et armures. Sinon, les marchands réparent. Activez aussi Réparations depuis le Pip-Boy, comme Fallout 3 et New Vegas.
SPARE_REPAIR_NAME=Réparation avec un rechange
SPARE_REPAIR_HELP=Ajoute UTILISER UN RECHANGE à la fenêtre de réparation si vous portez la même arme ou armure, avec tout mod. Spares only au Pip-Boy en a besoin.
PIPBOY_REPAIR_NAME=Réparations depuis le Pip-Boy
PIPBOY_REPAIR_HELP=Examinez une arme ou une armure usée dans le Pip-Boy et appuyez sur RÉPARER. Spares only utilise un rechange, Workbench répare comme à l'établi.
UNSCRAPPABLE_SPARES_NAME=Rechanges non recyclables
UNSCRAPPABLE_SPARES_HELP=Équipement que RECYCLER refuse, comme rechange : aucun, légendaires seuls ou tout, même les objets uniques comme le Cryolator d'origine.
KEEP_SPARE_MODS_NAME=Conserver les mods du rechange
KEEP_SPARE_MODS_HELP=Off consomme un rechange avec tous ses mods. Les autres rendent les mods inutiles à la réparation, ou vous laissent les choisir dans une liste.
SPARE_MOD_ROWS_NAME=Lignes des mods du rechange
SPARE_MOD_ROWS_HELP=Change montre ce que chaque mod de la liste ajoute ou coûte, comme +3.7 % ou -4.2 %. Result montre l'état atteint par la réparation, comme 64.2 %.
REPAIR_BOX_ROW_NAME=Fenêtre de réparation ouverte sur
REPAIR_BOX_ROW_HELP=Ligne en surbrillance à l'ouverture. Sans rechange, UTILISER UN RECHANGE prend le plus haut niveau d'état de réparation.
REPAIR_COLUMNS_NAME=Lignes de réparation en colonnes
REPAIR_COLUMNS_HELP=Aligne en colonnes les lignes des fenêtres de réparation. Désactivé : une ligne centrée chacune, comme d'origine.
REPAIR_GAINS_NAME=Gains dans les fenêtres de réparation
REPAIR_GAINS_HELP=Montre ce que chaque réparation ajoute aux dégâts ou résistances de l'objet. Désactivé : les fenêtres l'omettent.
REPAIR_LOCK_NAME=Verrou des réparations
REPAIR_LOCK_HELP=Les réparations avec composants exigent des rangs d'aptitude d'artisanat, le dernier pour tout objet ou le plus haut que demandent ses mods.
LOCK_SPARES_NAME=Verrouiller aussi les rechanges
LOCK_SPARES_HELP=Les rechanges suivent aussi le Verrou des réparations et ne réparent que dès l'état permis par vos rangs d'aptitude. Un marchand répare toujours.
LOADING_TIPS_HELP=Ajoute des astuces sur l'usure, les réparations, le butin et la nourriture qui s'avarie aux écrans de chargement. Désactivé : aucune.
HUD_CONDITION_NAME=CND de l'arme
HUD_CONDITION_HELP=Affiche l'état de votre arme près des munitions, en barre ou en pourcentage. Off n'affiche rien.
POWER_ARMOR_BAR_NAME=CND du tableau de bord d'armure assistée
POWER_ARMOR_BAR_HELP=Affiche l'état de votre arme sur le tableau de bord de l'armure assistée, en barre ou en pourcentage. Off n'affiche rien.
QUICK_CONTAINER_NAME=CND de la liste des conteneurs
QUICK_CONTAINER_HELP=Affiche l'état sur les lignes de la liste des conteneurs, qui apparaît en visant un conteneur ou un corps, en barre ou en pourcentage.
CARD_CND_NAME=CND sur les fiches
CARD_CND_HELP=Affiche la CND sur les fiches en barre encadrée ou en pourcentage, comme 87.4 %. Off laisse les fiches d'origine, sans ligne CND.
CARD_WEAR_RATE_NAME=Vitesse d'usure sur les fiches
CARD_WEAR_RATE_HELP=Affiche près de CND à quelle vitesse un objet s'use ou s'avarie, x1.0 pour un objet courant de son type. Désactivé, CND seul.
POWER_ARMOR_CND_NAME=CND de l'armure assistée sur les fiches
POWER_ARMOR_CND_HELP=Affiche la Santé des pièces d'armure assistée en CND. Rien d'autre ne change. Désactivé, comme d'origine.
CND_DECIMALS_NAME=Décimales de la CND
CND_DECIMALS_HELP=Always affiche 98.0 % et 97.5 %. Fractions only affiche 98 % et 97.5 %. Off affiche des nombres entiers.
CND_COLUMN_NAME=Colonne CND dans les listes des mods d'interface
CND_COLUMN_HELP=Ajoute une colonne CND aux listes Pip-Boy, troc, conteneurs et établi de votre mod d'interface. Désactivé, rien ne change.
CONFIRM_SCROLL_HELP=Correctif du jeu de base. À l'établi, la confirmation s'agrandit et défile. Désactivé : parfois petite.
INSPECT_PRICE_HELP=Correctif du jeu de base. Chez un marchand, Examiner affiche le bon prix. Désactivé : prix parfois faux.
FOOD_SPOILS_HELP=La nourriture que vous ou un compagnon avez portée, et celle des morts, s'avarie avec le temps. Désactivé : elle se garde.
FRIDGE_ICON_NAME=Icône de réfrigérateur
FRIDGE_ICON_HELP=Affiche une icône sur le nom du réfrigérateur et les fiches des aliments dedans. Ils s'y avarient moins vite.
TRACE_LOGS_NAME=Journaux pour rapports de bug
TRACE_LOGS_HELP=Écrit 5 journaux de plus près de NEC.log. Ils grossissent vite : activez-les seulement pour un bug.

[Page wear]
WEAR_RATE_NAME=Vitesse d'usure des armes
WEAR_RATE_HELP=Vitesse d'usure de vos armes. 1 est normal, 2 est 2 fois plus rapide et 0 arrête l'usure.
NPC_WEAR_RATE_NAME=Vitesse d'usure des armes des PNJ
NPC_WEAR_RATE_HELP=Vitesse d'usure des armes des PNJ. 1 est normal, 0.33 est 3 fois plus lent et 0 arrête l'usure.
AUTO_WEAR_RATE_NAME=Vitesse d'usure des armes automatiques
AUTO_WEAR_RATE_HELP=Multiplie les vitesses ci-dessus au tir ou à la coupe. 1 est normal, 2 le double et 0 arrête l'usure.
ARMOR_WEAR_RATE_NAME=Vitesse d'usure des armures
ARMOR_WEAR_RATE_HELP=Vitesse d'usure de vos armures. 1 est normal, 2 est 2 fois plus rapide et 0 arrête l'usure.
NPC_ARMOR_WEAR_RATE_NAME=Vitesse d'usure des armures des PNJ
NPC_ARMOR_WEAR_RATE_HELP=Vitesse d'usure des armures des PNJ. 1 est normal, 0.33 est 3 fois plus lent et 0 arrête l'usure.
COMPANION_WEAR_RATE_NAME=Vitesse d'usure des armes des compagnons
COMPANION_WEAR_RATE_HELP=Vitesse d'usure des armes de vos compagnons, en plus de celle des armes des PNJ. 1 est normal et 0 arrête l'usure.
SETTLER_WEAR_RATE_NAME=Vitesse d'usure des armes des colons
SETTLER_WEAR_RATE_HELP=Vitesse d'usure des armes de vos colons, en plus de celle des armes des PNJ. 1 est normal et 0 arrête l'usure.
SUPPRESSED_WEAR_RATE_NAME=Vitesse d'usure des armes avec silencieux
SUPPRESSED_WEAR_RATE_HELP=Multiplie les vitesses ci-dessus au tir avec un silencieux. 1 est normal, 2 le double et 0.5 la moitié.
COMPANION_ARMOR_WEAR_RATE_NAME=Vitesse d'usure des armures des compagnons
COMPANION_ARMOR_WEAR_RATE_HELP=Vitesse d'usure des armures de vos compagnons, en plus de celle des armures des PNJ. 1 est normal et 0 arrête l'usure.
SETTLER_ARMOR_WEAR_RATE_NAME=Vitesse d'usure des armures des colons
SETTLER_ARMOR_WEAR_RATE_HELP=Vitesse d'usure des armures de vos colons, en plus de celle des armures des PNJ. 1 est normal et 0 arrête l'usure.

[Page numbers]
DAMAGE_FLOOR_NAME=Dégâts à l'état 0
DAMAGE_FLOOR_HELP=Part des dégâts qu'une arme garde à l'état 0. À 1, l'usure ne les réduit jamais.
WEAPON_START_NAME=Début des malus des armes
WEAPON_START_HELP=À cet état, l'usure commence à affaiblir une arme, et les barres d'état le marquent. À 0.5, elle reste comme neuve jusqu'à la moitié de son état.
ARMOR_FLOOR_NAME=Protection à l'état 0
ARMOR_FLOOR_HELP=Part de la protection qu'une armure garde à l'état 0. À 1, l'usure ne la réduit jamais.
ARMOR_START_NAME=Début des malus des armures
ARMOR_START_HELP=À cet état, l'usure commence à affaiblir l'armure, et les barres d'état le marquent. À 0.5, elle protège comme neuve jusqu'à la moitié de son état.
LOOT_SHIFT_NAME=Décalage d'état du butin
LOOT_SHIFT_HELP=Décale chaque butin vers l'usé ou le neuf. À -100 tout est aussi usé que possible, à 100 aussi bon que possible.
LOOT_SURPRISE_NAME=Butin surprise 1 sur
LOOT_SURPRISE_HELP=Un objet surprise reçoit un état aléatoire, quel que soit son ancien porteur. Plus le nombre est haut, plus elles sont rares. À 0, aucune surprise.
LOOT_AREA_NAME=Butin épars selon la valeur de la zone
LOOT_AREA_HELP=Le butin hors des conteneurs est en meilleur état dans les zones bien fournies et en moins bon dans les pauvres. 0 le désactive, 2 le double.
VALUE_EXPONENT_NAME=Baisse de prix avec l'usure
VALUE_EXPONENT_HELP=Vitesse de perte de valeur des objets usés. À 1.5, un objet à moitié usé vaut 35 %. 0 garde le prix plein.
FIRE_RATE_FLOOR_NAME=Cadence de tir à l'état 0
FIRE_RATE_FLOOR_HELP=La cadence de tir qu'une arme automatique garde à l'état 0. À 1, l'usure ne la ralentit jamais.
CRIT_METER_FLOOR_NAME=Coups critiques à l'état 0
CRIT_METER_FLOOR_HELP=Part des critiques qu'une arme garde à l'état 0, pour vous et les PNJ. À 1, l'usure ne les réduit jamais.
ACCURACY_FLOOR_NAME=Précision à l'état 0
ACCURACY_FLOOR_HELP=Précision d'une arme à feu à l'état 0. À 0.75, les tirs s'écartent d'un tiers de plus. À 1, aucune perte.
RANGE_FLOOR_NAME=Portée à l'état 0
RANGE_FLOOR_HELP=Portée des dégâts d'une arme à feu à l'état 0. À 0, elle frappe comme de loin. À 1, l'usure ne la réduit pas.
JAM_CHANCE_NAME=Risque d'enrayage à l'état 0
JAM_CHANCE_HELP=Fréquence d'enrayage d'une arme proche de l'état 0 : à 1, une fois par chargeur, à 0.5, un chargeur sur 2. À 0, jamais.
JAM_START_NAME=Début des enrayages
JAM_START_HELP=À cet état, vos armes à feu commencent à s'enrayer, rarement puis de plus en plus souvent. Un enrayage dure jusqu'au rechargement.
BENCH_COST_NAME=Coût des réparations à l'établi
BENCH_COST_HELP=Composants qu'exige une réparation à l'établi en plus de ses fournitures. 0.5 les divise par 2, 2 les double et 0 rend toute réparation gratuite.
PERK_COMPONENT_DISCOUNT_NAME=Remise de composants par aptitude
PERK_COMPONENT_DISCOUNT_HELP=Les composants de réparation économisés avec tous les rangs de l'aptitude d'artisanat de l'objet. À 50, les 4 rangs économisent 50 %, 2 rangs 25 %.
SPARE_WORTH_NAME=Valeur d'un rechange
SPARE_WORTH_HELP=L'état que rend un rechange : à 0.5 ce que donne son démantèlement, 1 le double, 2 le quadruple. Chaque rang de Recycleur l'augmente.
FREE_MEND_NAME=Entretien gratuit dès
FREE_MEND_HELP=Dès cet état, selon les Décimales de la CND, ENTRETENIR à l'établi est gratuit. 100 le désactive, et 0 entretient tout.
MOD_LOCK_NAME=Modifications à l'établi dès
MOD_LOCK_HELP=Dès cet état, un établi peut modifier un objet. À 100, il doit être en parfait état, et à 0 tout état convient.
REPAIR_SUPPLIES_NAME=Fournitures d'entretien
REPAIR_SUPPLIES_HELP=Fournitures par réparation à l'établi, 0 aucune. Armes à feu et de mêlée alimentées : huile et tissu, autres : adhésif, armures : adhésif et tissu.
SUPPLIES_ONLY_NAME=Fournitures seules dès
SUPPLIES_ONLY_HELP=Dès cet état, selon les Décimales de la CND, une réparation à l'établi ne prend que ses fournitures, à tout rang. 100 le désactive.
PERK_LOCK_NAME=Verrou d'aptitude
PERK_LOCK_HELP=Bloque la réparation des objets usés sans les rangs d'aptitude requis. À 100, sans 1 rang sur 4, on répare dès 25 %, sans 2, dès 50 %.
TRADER_PRICE_NAME=Prix des réparations chez les marchands
TRADER_PRICE_HELP=Le nombre de capsules qu'un marchand demande pour une réparation. 0.5 divise le prix par 2 et 2 le double.
TRADER_LEEWAY_NAME=Marge pour les autres articles
TRADER_LEEWAY_HELP=Un marchand répare moins un type d'équipement qui n'est qu'une petite part de son stock. Une valeur haute adoucit la baisse. À 0, aucune réparation.
TRADER_FULL_STOCK_NAME=Stock pour une réparation totale
