PERK_DISCOUNT_WEAPONS=このPerkのモジュールで主に構成された武器は、作業台での修理に必要な部品が{0}%減少します
PERK_DISCOUNT_ARMOR=このPerkのモジュールで主に構成されたアーマーは、作業台での修理に必要な部品が{0}%減少します
PERK_DISCOUNT_BOTH=このPerkのモジュールで主に構成された武器とアーマーは、作業台での修理に必要な部品が{0}%減少します
WEAR_TITLE=消耗
WEAPONS_TITLE=武器
