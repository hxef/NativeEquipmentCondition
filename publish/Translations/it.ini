PERK_DISCOUNT_ARMOR=Le armature composte perlopiù da modifiche di questo talento richiedono il {0}% di componenti in meno per la riparazione al banco da lavoro.
PERK_DISCOUNT_BOTH=Le armi e le armature composte perlopiù da modifiche di questo talento richiedono il {0}% di componenti in meno per la riparazione al banco da lavoro.
