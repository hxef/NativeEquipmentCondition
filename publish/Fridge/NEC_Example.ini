; NEC fridge list, an example that changes nothing as it is. NEC_Default.ini
; beside it is the live list of the vanilla fridges and coolers. For a mod's
; fridge, copy this file under another name, such as MyKitchen.ini, and
; remove the ; from the lines you want.
;
; 1 container a line: the plugin that adds it, a bar, the container's form
; ID as FO4Edit shows it. The first 2 digits of the ID never count, and for
; a light plugin (.esl) only the last 3 do. Food in a listed container
; spoils at the fridge speed set in MCM.
;
;Fallout4.esm|0913F8        ; PlayerHouse_KitchenRefrigerator01
;MyKitchenMod.esp|000801    ; a mod's fridge
;
; NEC.food.log lists what each file here adds and any line it skips.
