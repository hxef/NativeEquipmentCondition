FOOD_SPOILS_HELP=La nourriture que vous ou un compagnon avez portée, et celle des morts, s'avarie avec le temps. Désactivé : elle se garde.
FRIDGE_ICON_NAME=Icône de réfrigérateur
FRIDGE_ICON_HELP=Affiche une icône sur le nom du réfrigérateur et les fiches des aliments dedans. Ils s'y avarient moins vite.
TRACE_LOGS_NAME=Journaux pour rapports de bug
TRACE_LOGS_HELP=Écrit 4 journaux de plus près de NEC.log. Ils grossissent vite : activez-les seulement pour un bug.

