ARMOR_FLOOR_HELP=Ile ochrony zachowuje pancerz w stanie 0. Przy 1 zużycie nigdy jej nie obniża.
ARMOR_START_NAME=Kary dla pancerza poniżej
ARMOR_START_HELP=Poniżej tego stanu zużycie obniża ochronę pancerza. Przy 0.5 pancerz chroni jak nowy aż do połowy stanu.
LOOT_SHIFT_NAME=Przesunięcie stanu łupów
LOOT_SHIFT_HELP=Przesuwa każdy łup w stronę zużytego lub nowego. Przy -100 wszystko jest maksymalnie zużyte, przy 100 jak nowe.
VALUE_EXPONENT_NAME=Spadek ceny przy zużyciu
VALUE_EXPONENT_HELP=Jak szybko zużyte przedmioty tracą wartość. Przy 1.5 zużyte w połowie są warte 35%. 0 zachowuje cenę.
FIRE_RATE_FLOOR_NAME=Szybkostrzelność przy stanie 0
FIRE_RATE_FLOOR_HELP=Jak szybko broń automatyczna strzela jeszcze w stanie 0. Przy 1 zużycie nigdy jej nie spowalnia.
CRIT_METER_FLOOR_NAME=Trafienia krytyczne przy stanie 0
CRIT_METER_FLOOR_HELP=Ile trafień krytycznych zachowuje broń w stanie 0, u ciebie i u NPC. Przy 1 zużycie ich nie obniża.
ACCURACY_FLOOR_NAME=Celność przy stanie 0
ACCURACY_FLOOR_HELP=Celność broni palnej w stanie 0. Przy 0.75 rozrzut rośnie o jedną trzecią. Przy 1 zużycie jej nie obniża.
RANGE_FLOOR_NAME=Zasięg przy stanie 0
RANGE_FLOOR_HELP=Jak daleko broń palna w stanie 0 zachowuje obrażenia. Przy 0 trafia jak z daleka, przy 1 jak nowa.
JAM_CHANCE_NAME=Zacięcia w stanie 0
JAM_CHANCE_HELP=Jak często zacina się broń bliska stanu 0: przy 1 raz na magazynek, przy 0.5 co 2. magazynek. Przy 0 nigdy.
JAM_START_NAME=Zacięcia poniżej
JAM_START_HELP=Poniżej tego stanu twoja broń palna może się zaciąć do przeładowania. Im gorszy stan, tym częściej.
BENCH_COST_NAME=Koszt naprawy w pracowni
BENCH_COST_HELP=Komponenty na naprawę w pracowni. 0.5 to połowa kosztu, 2 to podwójny, a 0 to darmowa naprawa.
SPARE_WORTH_NAME=Wartość zapasowego
SPARE_WORTH_HELP=Ile stanu przywraca zapasowy: przy 0.5 tyle, co daje jego rozebranie, 1 dwa razy tyle, 2 cztery razy. Rangi Złomiarza też ją podnoszą.
FREE_MEND_NAME=Darmowa poprawka powyżej
FREE_MEND_HELP=Powyżej tego stanu POPRAW jest darmowe. 100 to wyłącza, a 0 poprawia wszystko poza zepsutym.
MOD_LOCK_NAME=Blokada modyfikacji poniżej
MOD_LOCK_HELP=Poniżej tego stanu pracownia nie zmodyfikuje przedmiotu. Przy 1 stan musi być pełny, a 0 wyłącza blokadę.
TRADER_PRICE_NAME=Cena naprawy u handlarzy
TRADER_PRICE_HELP=Ile kapsli handlarz chce za naprawę. 0.5 zmniejsza cenę o połowę, a 2 ją podwaja.
TRADER_LEEWAY_NAME=Margines na inne towary
TRADER_LEEWAY_HELP=Handlarz naprawia dany rodzaj sprzętu do niższego stanu, gdy to tylko mała część jego zapasu. Wyższe wartości łagodzą ten spadek. Przy 0 nie naprawia go.
TRADER_FULL_STOCK_NAME=Zapas do pełnej naprawy
TRADER_FULL_STOCK_HELP=Handlarz, który ma w zapasie tyle różnych przedmiotów danego rodzaju, naprawia ten rodzaj do 100%. Przy mniejszej liczbie naprawia go do niższego stanu.
RAW_FOOD_DAYS_NAME=Surowa żywność wytrzymuje
RAW_FOOD_DAYS_HELP=Dni gry, przez które surowe mięso, jaja i płody rolne się nie psują. 2 to około 2.4 godziny gry.
COOKED_FOOD_DAYS_NAME=Gotowana żywność wytrzymuje
COOKED_FOOD_DAYS_HELP=Dni gry, przez które gotowana żywność się nie psuje. 7 to około 8.4 godziny gry.
FRIDGE_SPEED_NAME=Tempo psucia w lodówce
FRIDGE_SPEED_HELP=Jak szybko żywność psuje się w lodówce lub chłodziarce. 0.5 to połowa tempa.
SPOILED_PER_FERTILIZER_NAME=Zepsuta żywność na nawóz
SPOILED_PER_FERTILIZER_HELP=Ile zepsutej żywności zabiera stół chemiczny na 1 nawóz. 0 usuwa wiersz nawozu.
SPOILED_HEALING_NAME=Leczenie z zepsutej żywności
SPOILED_HEALING_HELP=Leczenie i premie, które daje zepsuta żywność poza trybem przetrwania, w % tych ze świeżej żywności. W trybie przetrwania nie daje żadnych.
SPOILED_HUNGER_NAME=Sycenie z zepsutej żywności
SPOILED_HUNGER_HELP=Głód i pragnienie, które zepsuta żywność zaspokaja w trybie przetrwania, w % świeżej.
SPOILED_RADS_NAME=Promieniowanie z zepsutej żywności
SPOILED_RADS_HELP=Dodatkowe rady, które zepsuta żywność dodaje do własnych. 1 to 15 dla mięsa i 5 dla innej żywności, 2 to dwa razy tyle, 0 nic.
SPOILED_SICKNESS_NAME=Choroby z zepsutej żywności
SPOILED_SICKNESS_HELP=Szansa na chorobę od zepsutej żywności w trybie przetrwania, jako wielokrotność szansy świeżej.

