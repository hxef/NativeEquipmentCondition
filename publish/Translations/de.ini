SPAWN_CONDITION_HELP=Gefundene Waffen und Rüstungen sind schon abgenutzt, je nach Vorbesitzer. Aus: Sie sind neu.
VENDOR_REPAIR_HELP=Händler für Waffen, Rüstungen oder Kleidung reparieren diese gegen Kronkorken. Aus: Nur an Werkbänken.
