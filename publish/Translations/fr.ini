POWER_ARMOR_BAR_HELP=Affiche une barre d'état sur le tableau de bord de l'armure assistée. Désactivé : l'état reste sur les fiches.
QUICK_CONTAINER_HELP=Affiche l'état dans la liste qui apparaît en visant un conteneur ou un corps. Désactivé : état non affiché.
CONFIRM_SCROLL_HELP=Correctif du jeu de base. À l'établi, la confirmation s'agrandit et défile. Désactivé : parfois petite.
