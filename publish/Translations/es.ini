[Page switches]
JAM_HELP=Bajo la mitad de estado, tus armas de fuego pueden encasquillarse hasta recargar. Desactivado: nunca.
SPAWN_CONDITION_HELP=Las armas y armaduras halladas ya están desgastadas, según quién las tuviera. Desactivado: nuevas.
VENDOR_REPAIR_HELP=Los comerciantes de armas, armaduras o ropa reparan las tuyas por chapas. Desactivado: solo el banco.
LOADING_TIPS_HELP=Añade consejos sobre desgaste, reparaciones y botín a las pantallas de carga. Desactivado: ninguno.
HUD_CONDITION_HELP=Muestra barras de estado junto a la munición y en la servoarmadura. Desactivado: solo en las fichas.
QUICK_CONTAINER_HELP=Muestra el estado en la lista que aparece al mirar un contenedor o un cadáver. Desactivado: no lo muestra.
CONFIRM_SCROLL_HELP=Arreglo del juego base. La confirmación del banco crece y se desplaza. Desactivado: puede ser pequeña.
INSPECT_PRICE_HELP=Arreglo del juego base. Al comerciar, Inspeccionar muestra el precio correcto. Desactivado: puede fallar.
TRACE_LOGS_NAME=Registros para informar de errores
TRACE_LOGS_HELP=Escribe 3 registros más junto a NEC.log. Crecen rápido, así que actívalo solo para informar de un error.

[Page wear]
WEAR_RATE_NAME=Velocidad de desgaste de armas
WEAR_RATE_HELP=Lo rápido que se desgastan tus armas. 1 es normal, 2 es el doble de rápido y 0 detiene el desgaste.
NPC_WEAR_RATE_NAME=Velocidad de desgaste de armas de otros personajes
NPC_WEAR_RATE_HELP=Lo rápido que se desgastan las armas de otros. 1 es normal, 0.33 es un tercio y 0 detiene el desgaste.
AUTO_WEAR_RATE_NAME=Velocidad de desgaste de armas automáticas
AUTO_WEAR_RATE_HELP=Multiplica las velocidades de arriba al disparar o cortar. 1 es normal, 2 el doble y 0 detiene el desgaste.
ARMOR_WEAR_RATE_NAME=Velocidad de desgaste de armaduras
ARMOR_WEAR_RATE_HELP=Lo rápido que se desgasta tu armadura. 1 es normal, 2 es el doble de rápido y 0 detiene el desgaste.
NPC_ARMOR_WEAR_RATE_NAME=Velocidad de desgaste de armaduras de otros personajes
NPC_ARMOR_WEAR_RATE_HELP=Lo rápido que se desgastan las armaduras de otros. 1 es normal, 0.33 es un tercio y 0 detiene el desgaste.

