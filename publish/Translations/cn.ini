PERK_DISCOUNT_BOTH_LOCK_FROM=主要由此輔助能力的改造配件組成的武器和裝甲，在工作台修理時所需的元件減少{0}%，且需要此輔助能力的修理現可從{1}%狀況開始。
PERK_DISCOUNT_BOTH_LOCK_ANY=主要由此輔助能力的改造配件組成的武器和裝甲，在工作台修理時所需的元件減少{0}%，且需要此輔助能力的修理現可在任何狀況下開始。
