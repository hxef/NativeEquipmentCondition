; Native Equipment Condition
;
; Every setting the mod has. Put your own changes in NEC_custom.ini in the
; same folder, with the same sections and keys, so an update of the mod
; writes over nothing of yours. A key in neither file keeps the value below.
; A change typed into either file takes a game restart. NEC's page in the Mod
; Configuration Menu changes any setting on the spot and saves it into
; NEC_custom.ini.
;
; NEC works alongside other DLL mods that change the same things. When one
; takes over something NEC changes, NEC lets it. A feature's switch here goes
; off only when that mod takes something the feature cannot work without, and
; it stays off while that mod is installed. NEC.log and NEC's page name that
; mod and what is off.

[Features]

; Your guns below half condition can jam. A reload clears the jam.
bJam=true

; Worn automatic weapons fire slower, for you and for NPCs. The Ripper counts,
; its blade runs on a motor.
bFireRate=true

; Worn weapons fill the VATS critical meter slower, and an NPC's worn weapon
; lands fewer critical hits. Your own critical chance outside VATS is left
; as it is.
bCritMeter=true

; Weapons and armor you find are already worn. How worn depends on where they
; come from and who carried them. What companions and other essential NPCs
; start with is new. When off, everything turns up new.
bSpawnCondition=true

; Traders who deal in weapons, armor or clothing repair them for caps. The
; further a trader repairs a kind of gear, the better shape their own stock of
; it is in. When off, only the workbenches repair, and a trader's stock is as
; worn as any loot.
bVendorRepair=true

; Loading screen tips about condition, repairs and loot. A tip about a
; feature switched off never shows.
bLoadingTips=true

; The CND bar on the HUD, in the ammo counter and on the power armor dash.
; When off, the item cards and the Pip-Boy still show condition.
bHudCondition=true

; Condition meters in the list the HUD shows when you look at a container or a
; body.
bQuickContainer=true

; Base game fix. A workbench's confirmation box grows to show more of a long
; component list and scrolls it with the mouse wheel, the arrow keys, the
; D-pad and W and S. When off, the box is left to the game or to another mod
; that fixes it.
bConfirmScroll=true

; Base game fix. At a trader, the inspect screen shows the price for the side
; the item is on, what the trader charges for theirs and pays for yours. The
; game shows whichever side it priced last. When off, the price is left to the
; game or to another mod that fixes it.
bInspectPrice=true

[Balance]

; How fast weapons wear. 2 wears every weapon out twice as fast, 0.5 half as
; fast. At 1 an ordinary weapon takes about 1100 shots or swings from new to
; broken. 60 wears one out inside a fight. 0 stops the wear, and anything
; below 0 counts as 0.
fWearRateMult=1.0

; How fast armor wears, on you and on NPCs. At 1 a piece takes about 100 blows
; of an ordinary weapon from new to broken. Every piece covering the limb a
; blow lands on takes it, and the pieces on no limb in particular, a scarf or
; a mask, share every blow. The armor an essential NPC comes with never wears,
; but whatever you give them does. 10 wears a chest piece out in a fight.
; Anything below 0 counts as 0.
fArmorWearRateMult=1.0

; How much damage a weapon at 0 condition still does, as a share of its full
; damage, in a straight line up to full damage at full condition. 0.66 is what
; Fallout 3 shipped. Anything below 0 counts as 0 and anything above 1 as 1.
fDamageFloor=0.66

; How much protection a piece of armor at 0 condition still gives, as a share
; of its full damage, energy and radiation resistance, in a straight line up
; to full at full condition. 0.66 keeps step with the damage, and is close to
; what the older games left a worn out piece: Fallout 3 kept 0.62 of the
; rating at 0 and New Vegas 0.66, where Fallout 76 keeps all of it down to the
; break and none past it. A piece at 0 stays on and protects this much until
; it is taken off. Anything below 0 counts as 0 and anything above 1 as 1.
fArmorFloor=0.66

; How fast worn items lose value: an item is worth its condition raised to
; this power. 1.5 is the Fallout 3 and New Vegas curve, where half condition
; gets 35% of the price. 1 makes the price follow the condition in a straight
; line. 0 keeps the full price at any condition, and anything below 0 counts
; as 0.
fValueExponent=1.5

; How fast an automatic weapon at 0 condition fires, as a share of its own
; rate, in a straight line up to its full rate at full condition. Kept near
; the top because it stacks with the damage: a gun at 0.75 of its rate hitting
; for 0.66 already deals half. Anything below 0.1 counts as 0.1 and anything
; above 1 as 1.
fFireRateFloor=0.75

; How much of the VATS critical meter a shot from a weapon at 0 condition
; fills, as a share of what it fills when the weapon is in full condition. An
; NPC's weapon at 0 keeps the same share of its critical chance. 1 means wear
; never lowers either.
fCritMeterFloor=0.5

; What a repair at a workbench costs. 0.5 halves every bill of components and
; 2 doubles it. The crafting perks still take off their share. At 0 every
; repair is free and done on the spot, the way MEND works, broken gear
; included. Anything below 0 counts as 0 and anything above 10 as 10.
fBenchCostMult=1.0

; The condition above which a workbench mends an item for free, in percent, a
; whole number such as 90. The button reads MEND and puts the item back to
; full on the spot, so the few shots that close the mod slots never cost
; components. 100 makes every repair cost components, and 0 mends everything
; but broken gear for free. Anything below 0 counts as 0 and anything above
; 100 as 100.
iFreeMendAbove=95

; What a trader asks for a repair. 0.5 halves every price and 2 doubles it.
; Anything above 10 counts as 10.
fTraderPriceMult=1.0

[HUD]

; Where the CND bars sit, in pixels of the HUD, which is 1280 across and 720
; high on any screen. 0 and 0 is each bar's own place. Above 0 moves a bar
; right or up, below 0 left or down.

; The CND bar by the ammo counter, which takes the place of the line between
; the 2 ammo numbers. Moved off it, that line shows again.
fHudBarX=0
fHudBarY=0

; The CND bar on the power armor dash, between its ammo digits. It still sways
; with the dash, and past the edge of the screen it hides.
fPowerArmorBarX=0
fPowerArmorBarY=0

[Log]

; How much NEC.log, in Documents\My Games\Fallout4\F4SE, writes: trace, debug,
; info, warning or error. Info says what NEC changed, what it shares with or
; leaves to other mods, and what it read from your load order. Debug adds more
; to help find a bug.
sLogLevel=info

; The 3 bug report logs beside NEC.log, with a line for every shot, hit, menu
; drawn and item spawned. They grow past a megabyte in an hour, so leave them
; off unless you are reporting a bug.
bTraceLogs=false
