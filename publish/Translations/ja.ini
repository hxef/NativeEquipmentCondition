[Repair]
REPAIR_QUESTION={0}の状態は{1}%です。修理する状態を選択:
REPAIR_DISCOUNT={0} {1}は、この修理に必要な部品を{2}%減らします
TOO_DAMAGED_FULL=改造するには状態が万全である必要があります
TOO_DAMAGED=改造するには状態が{0}%以上である必要があります
MEND_BUTTON=手入れ
MENDED_WEAPON=武器を手入れしました
MENDED_ARMOR=アーマーを手入れしました
BENCH_CANNOT_REPAIR=このアイテムは作業台では修理できません。商人なら修理できます
CANNOT_MODIFY=このアイテムは改造できません

