WORKBENCH_REPAIR_HELP=作業台が消耗した武器や防具を修理します。OFFでも商人は修理します。Pip-Boyでの修理もONにすると、Fallout 3やNew Vegasと同じ修理になります
SPARE_REPAIR_NAME=予備で修理
SPARE_REPAIR_HELP=同じ武器や防具をもう1つ持っていると、MODを問わず、修理ボックスに予備を使うボタンを追加します。Pip-Boyでの修理のSpares onlyにはこれが必要です
PIPBOY_REPAIR_NAME=Pip-Boyでの修理
PIPBOY_REPAIR_HELP=Pip-Boyで消耗した武器や防具を調べて修理を押します。Spares onlyは予備を1つ使い、Workbenchは作業台と同じように修理します
UNSCRAPPABLE_SPARES_NAME=解体できない予備
UNSCRAPPABLE_SPARES_HELP=解体を拒まれる装備を予備に使えるか: なし、レジェンダリーのみ、またはバニラのクライオレーターなどユニークアイテムも含むすべて
KEEP_SPARE_MODS_NAME=予備のMODを残す
KEEP_SPARE_MODS_HELP=Offは予備をMODごと消費します。他の設定は修理に要らないMODを返すか、一覧から選ばせます
SPARE_MOD_ROWS_NAME=予備MODの行
SPARE_MOD_ROWS_HELP=Changeは一覧の各MODが増やす分や減らす分を表示します(+3.7%や-4.2%など)。Resultは修理後の状態を表示します(64.2%など)
REPAIR_BOX_ROW_NAME=修理ボックスの初期選択
REPAIR_BOX_ROW_HELP=修理ボックスを開いたときに選択される行。予備がないと、予備を使うは修理する状態の最も高いレベルを選びます
REPAIR_COLUMNS_NAME=修理の行を列で表示
REPAIR_COLUMNS_HELP=修理ボックスの行を列で揃えます。OFFではバニラと同じく各行を中央揃えの1行で表示します
REPAIR_GAINS_NAME=修理ボックスの上昇値
