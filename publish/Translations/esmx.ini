BENCH_COST_HELP=Componentes por reparación en el banco. 0.5 reduce el costo a la mitad, 2 lo duplica y 0 la hace gratis.
FREE_MEND_NAME=Retoque gratis por encima de
FREE_MEND_HELP=Sobre este estado, RETOCAR en el banco es gratis. 100 lo desactiva y 0 retoca todo salvo lo roto.
MOD_LOCK_NAME=Bloqueo de mods por debajo de
MOD_LOCK_HELP=Bajo este estado, un banco de trabajo no modifica un objeto. Con 1 debe estar al máximo, y 0 quita el bloqueo.
TRADER_PRICE_NAME=Precio de reparación de comerciantes
TRADER_PRICE_HELP=Cuántas tapas pide un comerciante por una reparación. 0.5 reduce el precio a la mitad y 2 lo duplica.
RAW_FOOD_DAYS_NAME=La comida cruda dura
RAW_FOOD_DAYS_HELP=Días de juego que duran la carne cruda, los huevos y las cosechas. 2 son unas 2.4 horas de juego.
COOKED_FOOD_DAYS_NAME=La comida cocinada dura
COOKED_FOOD_DAYS_HELP=Días de juego que dura la comida cocinada. 7 son unas 8.4 horas de juego.
FRIDGE_SPEED_NAME=Velocidad de podredumbre en refrigerador
FRIDGE_SPEED_HELP=Qué tan rápido se pudre la comida en un refrigerador o una hielera. 0.5 es media velocidad.
SPOILED_PER_FERTILIZER_NAME=Comida podrida por fertilizante
SPOILED_PER_FERTILIZER_HELP=Cuánta comida podrida necesita una estación de química para 1 fertilizante. 0 quita la fila de fertilizante.
SPOILED_HEALING_NAME=Curación de comida podrida
SPOILED_HEALING_HELP=La curación y las bonificaciones que da la comida podrida fuera de Supervivencia, en % de las de la comida fresca. En Supervivencia no da ninguna.
SPOILED_HUNGER_NAME=Saciedad de comida podrida
SPOILED_HUNGER_HELP=El hambre y la sed que sacia la comida podrida en Supervivencia, en % de las de la comida fresca. Supervivencia sacia al menos su comida más pequeña, incluso en 0.
SPOILED_RADS_NAME=Rads de comida podrida
SPOILED_RADS_HELP=Cuántos rads extra da la comida podrida. 1 es lo normal, 2 es el doble y 0 no agrega ninguno.
SPOILED_SICKNESS_NAME=Enfermedad por comida podrida
SPOILED_SICKNESS_HELP=La probabilidad de que la comida podrida te enferme en Supervivencia, como múltiplo de la de la comida fresca. La comida sin probabilidad propia toma la más pequeña de tu orden de carga.

