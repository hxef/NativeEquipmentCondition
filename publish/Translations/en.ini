HUD_BAR_X_NAME=HUD bar from left
HUD_BAR_X_HELP=Where the ammo counter's bar and CND word start, from the left. Same at any resolution.
HUD_BAR_Y_NAME=HUD bar from top
HUD_BAR_Y_HELP=Where the ammo counter's bar and CND word start, from the top. Same at any resolution.
HUD_BAR_DEFAULT=Default: {0}.
POWER_ARMOR_BAR_X_NAME=Power armor bar left or right
POWER_ARMOR_BAR_X_HELP=Moves the bar in power armor: right above 0, left below 0. Past the edge of the screen it hides.
POWER_ARMOR_BAR_Y_NAME=Power armor bar up or down
POWER_ARMOR_BAR_Y_HELP=Moves the bar in power armor: up above 0, down below 0. Past the edge of the screen it hides.
HUD_BAR_HIDES_NAME=HUD bar hides with counter
HUD_BAR_HIDES_HELP=Hides the ammo counter's bar when the counter fades after a shot. Melee weapons keep it. When off, it stays.
LOG_LEVEL_NAME=Log detail

; The path and debug stay as they are in every language, debug being a word
; NEC.ini takes.
LOG_LEVEL_HELP=How much NEC.log writes, in Documents\My Games\Fallout4\F4SE. Pick debug when you report a bug.

[Page notes]
; The grey lines of the MCM page about parts left to other mods, and the words
; that join a list. A DLL is named by its file name in every language.

; The first lines of a block's note, or of a hidden switch's in its place. {0}
; is a part, or a part with its pieces in brackets. {1} reads right after
; "left to", so OWNER_MOD takes that case.
PART_OFF={0}: off, left to {1}.

; A switch or a piece that went off with a part it rides on, as Jamming with
; Gun wear from firing.
PART_SINCE={0}: off, since {1} is left to {2}.

; The 2 lines above for pieces off only for now, since another mod changed
; their place. They come back once NEC sees its own part run there again.
PART_OFF_NOW={0}: off for now, left to {1}.
PART_SINCE_NOW={0}: off for now, since {1} is left to {2}.
PART_VERSION={0}: off, as this game version ({1}) is not supported.

; An owner NEC cannot name, only inside the owner list of the lines above.
OWNER_MOD=another mod

; The last 2 items of a list, and every pair before them.
LIST_AND={0} and {1}
LIST_COMMA={0}, {1}

; The settings of a block that do nothing while the parts above stay left to
; other mods, joined with commas only, as a name can hold "and".
NO_EFFECT=No effect for now: {0}.

; The list at the top of the page: its first line, then 1 line a mod with the
; parts and pieces it has.
TOP_INTRO=Another mod took over the parts listed here, so NEC leaves them alone.
TOP_BY=Left to {0}: {1}.
TOP_MOD=Left to another mod: {0}.
TOP_VERSION=Off on this game version ({0}): {1}.

; In place of the 8th mod's line when more than 8 have parts.
TOP_MORE=And {0} more mods. NEC.log names them all.

; The help line of every grey row.
NOTE_HELP=To get a part back, remove the mod it is left to and restart the game.

; The last line of a grey row too tall for the page, in place of the lines it
; leaves out.
NOTE_REST=NEC.log names the rest.

; The help line of every grey row while only this game version keeps parts off
; and no mod has any.
NOTE_HELP_VERSION=NEC is made for game version 1.11.240.

