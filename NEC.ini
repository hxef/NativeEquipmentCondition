; Native Equipment Condition
;
; Every setting the mod has. Put your own changes in NEC_custom.ini in the
; same folder, with the same sections and keys, so an update of the mod
; writes over nothing of yours. A key in neither file keeps the value below.
;
; [Features] and [Log] are read once, as the game starts. [Balance] is read
; again on every save load and new game, so a change takes a load and no
; restart.

[Features]

; Worn guns can jam.
bJam=true

; Worn automatic weapons fire slower, in anyone's hands. The Ripper counts,
; its blade runs on a motor.
bFireRate=true

; Worn weapons fill the VATS critical meter slower, and an NPC's worn weapon
; lands fewer critical hits. Your own critical chance outside VATS is left
; as it is.
bCritMeter=true

; Weapons spawn already worn, in proportion to where they came from and who
; carries them. Off, every weapon spawns new.
bSpawnCondition=true

; Traders who deal in weapons repair them for caps. Off, the weapon workbench
; is the only way to repair a weapon.
bVendorRepair=true

; Loading screen tips about condition.
bLoadingTips=true

; The CND bar on the HUD, in the ammo counter and on the power armor dash.
; Off, the item cards and the Pip-Boy still show the condition.
bHudCondition=true

; Condition meters on the rows of the quick container, the list the HUD shows
; while the crosshair rests on a container.
bQuickContainer=true

; A workbench's confirmation box grows to show more of a long component list
; and scrolls it with the mouse wheel, the arrow keys, the D-pad and W and S.
; Off, the box is left as the game has it.
bConfirmScroll=true

[Balance]

; How fast weapons wear. 2 wears every weapon out twice as fast, 0.5 half as
; fast. At 1 an ordinary weapon takes about 1100 shots or swings from new to
; broken. 60 wears one out inside a fight, which is how the wear is tested.
; 0 stops the wear, and anything below 0 counts as 0.
fWearRateMult=1.0

; What a weapon at 0 condition still hits for, as a share of its full damage,
; in a straight line up to full damage at full condition. 0.66 is what
; Fallout 3 shipped. 0.05 makes the falloff impossible to miss, which is how
; it is tested. Anything below 0 counts as 0 and anything above 1 as 1.
fDamageFloor=0.66

; What a worn item is worth: its condition raised to this power. 1.5 is the
; Fallout 3 and New Vegas curve, where half condition gets 35% of the price.
; 1 makes the price follow the condition in a straight line. 0 keeps the full
; price at any condition, and anything below 0 counts as 0.
fValueExponent=1.5

; How fast an automatic weapon at 0 condition fires, as a share of its own
; rate, in a straight line up to its full rate at full condition. Kept near
; the top because it multiplies into the damage: a gun at 0.75 of its rate
; hitting for 0.66 already deals half. Anything below 0.1 counts as 0.1 and
; anything above 1 as 1.
fFireRateFloor=0.75

; How much of the VATS critical meter a shot from a weapon at 0 condition
; fills, as a share of what it fills when the weapon is sound. An NPC's
; weapon at 0 keeps the same share of its critical chance. 1 leaves both as
; they were.
fCritMeterFloor=0.5

; What a repair at the weapon workbench costs. 0.5 halves every bill of
; components and 2 doubles it. The crafting perks still take off their share.
; Anything below 0 counts as 0 and anything above 10 as 10.
fBenchCostMult=1.0

; What a trader asks for a repair. 0.5 halves every price and 2 doubles it.
fTraderPriceMult=1.0

[Log]

; How much NEC.log, in Documents\My Games\Fallout4\F4SE, writes: trace,
; debug, info, warning or error. Info says which hooks were patched and what
; the load order was measured at. Debug adds what CommonLibF4 has to say.
sLogLevel=info

; The 3 trace logs beside NEC.log, a line for every shot, hit, menu drawn and
; item spawned. For working on the mod rather than playing it, and they grow
; past a megabyte in an hour, so they are off.
bTraceLogs=false
