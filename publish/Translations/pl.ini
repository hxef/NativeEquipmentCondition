COMPANION_ARMOR_WEAR_RATE_HELP=Jak szybko zużywają się pancerze twoich towarzyszy, ponad szybkość pancerzy NPC. 1 to normalnie, a 0 wyłącza zużycie.
SETTLER_ARMOR_WEAR_RATE_NAME=Szybkość zużycia pancerzy osadników
SETTLER_ARMOR_WEAR_RATE_HELP=Jak szybko zużywają się pancerze twoich osadników, ponad szybkość pancerzy NPC. 1 to normalnie, a 0 wyłącza zużycie.

[Page numbers]
