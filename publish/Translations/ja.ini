[Tips]
TIP_WEAR=武器とアーマーの状態は使うほど悪化する。消耗した武器は与えるダメージが減り、消耗したアーマーは防御力が落ちる。どちらもキャップでの価値が下がる
TIP_BENCH=武器作業台やアーマー作業台で、消耗した装備をその材料となる部品で修理しよう。装備は状態が万全でないと改造できない
TIP_BENCH_REPAIR=武器作業台やアーマー作業台で、消耗した装備をその材料となる部品で修理しよう
TIP_BENCH_SUPPLIES=武器作業台やアーマー作業台で、消耗した装備を少しの消耗品で修理しよう。消耗が深いときはその材料となる部品も使う。装備は状態が万全でないと改造できない
TIP_BENCH_REPAIR_SUPPLIES=武器作業台やアーマー作業台で、消耗した装備を少しの消耗品で修理しよう。消耗が深いときはその材料となる部品も使う
TIP_TRADER=部品が足りない？ 武器屋やアーマー屋、服屋は、扱っている種類の装備をキャップで修理してくれる。品揃えが豊富な店ほど、新品に近い状態まで直せる
TIP_BROKEN=壊れた武器は自動的にしまわれる。壊れたアーマーは脱ぐまで身に着けたままで、ボーナスもそのまま残る。どちらにしても、壊れた装備は修理するまで再び装備できない
TIP_JAM=消耗した銃は弾詰まりを起こすことがあり、最悪のタイミングでリロードを強いられる。頼りにしている武器は良い状態に保っておこう
TIP_LOOT=戦利品が完璧な状態で見つかることはめったにない。レイダーは装備を雑に扱うが、ガンナーのような装備の整った勢力は手入れを怠らない
TIP_FOOD=食料は日が経つにつれて傷んでいくが、クーラーや冷蔵庫の中ではゆっくり傷む。傷んだ食料は回復量が少なく、放射能が多く、サバイバルではほとんど空腹を満たさない。クッキングステーションでは使えないが、ケミストリーステーションで肥料に変えられる

