PERK_DISCOUNT_BOTH=Оружие и броня, собранные в основном из модификаций этой способности, требуют на {0}% меньше компонентов при ремонте на верстаке.
PERK_DISCOUNT_WEAPONS_LOCK_FROM=Оружие, собранное в основном из модификаций этой способности, требует на {0}% меньше компонентов при ремонте на верстаке, а ремонт, для которого нужна эта способность, теперь возможен с {1}% состояния.
PERK_DISCOUNT_WEAPONS_LOCK_ANY=Оружие, собранное в основном из модификаций этой способности, требует на {0}% меньше компонентов при ремонте на верстаке, а ремонт, для которого нужна эта способность, теперь возможен при любом состоянии.
PERK_DISCOUNT_ARMOR_LOCK_FROM=Броня, собранная в основном из модификаций этой способности, требует на {0}% меньше компонентов при ремонте на верстаке, а ремонт, для которого нужна эта способность, теперь возможен с {1}% состояния.
PERK_DISCOUNT_ARMOR_LOCK_ANY=Броня, собранная в основном из модификаций этой способности, требует на {0}% меньше компонентов при ремонте на верстаке, а ремонт, для которого нужна эта способность, теперь возможен при любом состоянии.
PERK_DISCOUNT_BOTH_LOCK_FROM=Оружие и броня, собранные в основном из модификаций этой способности, требуют на {0}% меньше компонентов при ремонте на верстаке, а ремонт, для которого нужна эта способность, теперь возможен с {1}% состояния.
PERK_DISCOUNT_BOTH_LOCK_ANY=Оружие и броня, собранные в основном из модификаций этой способности, требуют на {0}% меньше компонентов при ремонте на верстаке, а ремонт, для которого нужна эта способность, теперь возможен при любом состоянии.
PERK_PAGE_LOCK_FROM=Ремонт, для которого нужна эта способность, теперь возможен с {0}% состояния.
PERK_PAGE_LOCK_ANY=Ремонт, для которого нужна эта способность, теперь возможен при любом состоянии.
PERK_SCRAPPER=Запасные предметы для ремонта оружия и брони на верстаке восстанавливают больше состояния.
