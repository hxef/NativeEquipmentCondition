AUTO_WEAR_RATE_NAME=Abnutzungstempo von Automatikwaffen
AUTO_WEAR_RATE_HELP=Multipliziert die Tempos oben beim Schießen oder Schneiden. 1 ist normal, 2 verdoppelt, 0 stoppt sie.
