POWER_ARMOR_BAR_NAME=Powerrüstungs-Zustandsbalken
POWER_ARMOR_BAR_HELP=Zeigt einen Zustandsbalken am Armaturenbrett der Powerrüstung. Aus: Nur in den Gegenstandsinfos.
QUICK_CONTAINER_HELP=Zeigt den Zustand in der Liste, die beim Blick auf Behälter oder Leichen erscheint. Aus: Kein Zustand.
CONFIRM_SCROLL_HELP=Grundspiel-Fix. Das Bestätigungsfenster der Werkbank wächst und scrollt. Aus: Es kann klein bleiben.
INSPECT_PRICE_HELP=Grundspiel-Fix. Beim Händler zeigt Untersuchen den richtigen Preis. Aus: Er kann falsch sein.
FOOD_SPOILS_HELP=Essen, das du oder ein Begleiter getragen hast, und Essen bei Toten verdirbt mit der Zeit. Aus: Essen hält sich.
FRIDGE_ICON_NAME=Kühlschrank-Symbol
FRIDGE_ICON_HELP=Zeigt ein Symbol neben dem Namen des Kühlschranks, wenn du ihn ansiehst, und auf den Karten des Essens darin. Essen verdirbt dort langsamer.
TRACE_LOGS_NAME=Protokolle für Fehlerberichte
TRACE_LOGS_HELP=Schreibt 4 Protokolle mehr neben NEC.log. Sie wachsen schnell, also nur für Fehlerberichte einschalten.

