VENDOR_REPAIR_HELP=Chi vende armi, armature o vestiti ripara i tuoi in cambio di tappi. Se disattivato, solo al banco da lavoro.
SPARE_REPAIR_NAME=Riparazione con ricambio
SPARE_REPAIR_HELP=Aggiunge USA UN RICAMBIO alla riparazione del banco da lavoro se porti un'altra arma o armatura uguale, con qualsiasi mod.
UNSCRAPPABLE_SPARES_NAME=Ricambi non riciclabili
UNSCRAPPABLE_SPARES_HELP=Equipaggiamento che RICICLA rifiuta, come ricambio: niente, solo leggendari o tutto, anche pezzi unici come il Cryolator originale.
REPAIR_BOX_ROW_NAME=Finestra di riparazione apre su
