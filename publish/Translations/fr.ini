REPAIR_COLUMNS_NAME=Lignes de réparation en colonnes
REPAIR_COLUMNS_HELP=Aligne en colonnes les lignes des fenêtres de réparation. Désactivé : une ligne centrée chacune, comme d'origine.
REPAIR_GAINS_NAME=Gains dans les fenêtres de réparation
REPAIR_GAINS_HELP=Montre ce que chaque réparation ajoute aux dégâts ou résistances de l'objet. Désactivé : les fenêtres l'omettent.
