[Page switches]
PLAIN_APPAREL_NAME=Zwykła odzież nigdy się nie zużywa
PLAIN_APPAREL_HELP=Odzież bez wartości pancerza i premii nigdy się nie zużywa i nie pokazuje stanu. Wyłączone: zużywa się jak pancerz.
SPAWN_CONDITION_HELP=Znaleziona broń i pancerze są już zużyte, zależnie od poprzedniego właściciela. Wyłączone: są nowe.
VENDOR_REPAIR_HELP=Handlarze bronią, pancerzami lub ubraniami naprawiają twoje rzeczy za kapsle. Wyłączone: tylko pracownie.
SPARE_REPAIR_NAME=Naprawa zapasowym
SPARE_REPAIR_HELP=Dodaje UŻYJ ZAPASOWEGO do okna naprawy w pracowni, gdy nosisz drugą taką samą broń lub pancerz, z dowolnymi modami.
UNSCRAPPABLE_SPARES_NAME=Zapasowe nie do przetworzenia
UNSCRAPPABLE_SPARES_HELP=Sprzęt, którego PRZETWÓRZ nie przyjmuje, jako zapasowy: nic, tylko legendarny albo wszystko, z unikatami jak Kriolator z oryginału.
REPAIR_BOX_ROW_NAME=Okno naprawy otwiera się na
REPAIR_BOX_ROW_HELP=Wiersz podświetlony po otwarciu okna naprawy. Bez zapasowego UŻYJ ZAPASOWEGO wybiera najwyższy poziom stanu naprawy.
REPAIR_COLUMNS_NAME=Wiersze naprawy w kolumnach
REPAIR_COLUMNS_HELP=Układa wiersze okien naprawy w kolumnach. Wyłączone: każdy wiersz to jedna wyśrodkowana linia, jak w oryginale.
REPAIR_GAINS_NAME=Zyski w oknach naprawy
REPAIR_GAINS_HELP=Pokazuje, co każda naprawa dodaje do obrażeń lub odporności przedmiotu. Wyłączone: okna naprawy to pomijają.
LOADING_TIPS_HELP=Dodaje porady o zużyciu, naprawach i łupach na ekranach wczytywania. Wyłączone: nie pojawiają się.
HUD_CONDITION_NAME=Pasek stanu broni
HUD_CONDITION_HELP=Pokazuje pasek stanu przy amunicji. Wyłączone: stan tylko na kartach.
POWER_ARMOR_BAR_NAME=Pasek stanu pancerza wspomaganego
POWER_ARMOR_BAR_HELP=Pokazuje pasek stanu na desce rozdzielczej pancerza wspomaganego. Wyłączone: stan tylko na kartach.
QUICK_CONTAINER_HELP=Pokazuje stan w podglądzie pojemnika lub ciała, na które patrzysz. Wyłączone: podgląd go nie pokazuje.
CONFIRM_SCROLL_HELP=Poprawka błędu gry. Potwierdzenie w pracowni jest większe i przewija listy. Wyłączone: bywa małe.
INSPECT_PRICE_HELP=Poprawka błędu gry. Badanie u handlarza pokazuje właściwą cenę. Wyłączone: bywa błędna.
FOOD_SPOILS_HELP=Żywność, którą nosiłeś ty lub towarzysz, oraz żywność przy zmarłych psuje się z czasem. Wyłączone: żywność się nie psuje.
FRIDGE_ICON_NAME=Ikona lodówki
FRIDGE_ICON_HELP=Pokazuje ikonę przy nazwie lodówki i na kartach żywności w środku. Żywność psuje się tam wolniej.
TRACE_LOGS_NAME=Dzienniki do zgłoszeń błędów
TRACE_LOGS_HELP=Zapisuje 4 dodatkowe dzienniki obok NEC.log. Szybko rosną, więc włączaj tylko przy zgłaszaniu błędu.

