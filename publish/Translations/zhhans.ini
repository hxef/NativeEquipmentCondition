[Page switches]
JAM_HELP=你的枪支状况低于一半时可能卡弹，重新装填才能排除。关闭时，枪支不会卡弹。
SPAWN_CONDITION_HELP=你找到的武器和装甲已有损耗，程度取决于原来的持有者。关闭时，均为全新。
VENDOR_REPAIR_HELP=出售武器、装甲或服饰的商人会收瓶盖修理你的同类装备。关闭时，只有工作台能修理。
LOADING_TIPS_HELP=在载入画面加入损耗、修理和战利品的相关提示。关闭时，不会显示这些提示。
HUD_CONDITION_HELP=在弹药计数旁和动力装甲中显示状况条。关闭时，物品信息仍会显示状况。
QUICK_CONTAINER_HELP=看向容器或尸体时，弹出的清单会显示状况。关闭时则不显示。
CONFIRM_SCROLL_HELP=原版游戏修正。工作台确认窗口会放大并可滚动。关闭时，窗口可能保持原本大小。
INSPECT_PRICE_HELP=原版游戏修正。与商人交易时，检查物品会显示正确的买卖价。关闭时，价格可能有误。
TRACE_LOGS_NAME=错误报告日志
TRACE_LOGS_HELP=在NEC.log旁另外写入3个日志，用于错误报告。日志增长很快，平时游玩请保持关闭。

[Page wear]
WEAR_RATE_NAME=武器损耗速度
WEAR_RATE_HELP=你的武器损耗的速度。1为正常，2为2倍速度，0则停止损耗。
NPC_WEAR_RATE_NAME=其他角色的武器损耗速度
NPC_WEAR_RATE_HELP=其他角色的武器损耗的速度。1为正常，0.33为三分之一速度，0则停止损耗。
AUTO_WEAR_RATE_NAME=自动武器损耗速度
AUTO_WEAR_RATE_HELP=射击或切割时，乘以上方的损耗速度。1为正常，2为两倍速度，0则停止损耗。
ARMOR_WEAR_RATE_NAME=装甲损耗速度
ARMOR_WEAR_RATE_HELP=你的装甲损耗的速度。1为正常，2为2倍速度，0则停止损耗。
NPC_ARMOR_WEAR_RATE_NAME=其他角色的装甲损耗速度
NPC_ARMOR_WEAR_RATE_HELP=其他角色的装甲损耗的速度。1为正常，0.33为三分之一速度，0则停止损耗。

[Page numbers]
DAMAGE_FLOOR_NAME=状况为0时的伤害
DAMAGE_FLOOR_HELP=武器在状况为0时保留多少伤害。设为1时，损耗不会降低伤害。
WEAPON_START_NAME=武器惩罚开始的状况
WEAPON_START_HELP=低于此状况时，损耗会降低武器的性能。设为0.5时，武器在状况降到一半前都如同全新。
ARMOR_FLOOR_NAME=状况为0时的防护
ARMOR_FLOOR_HELP=装甲在状况为0时保留多少防护。设为1时，损耗不会降低防护。
ARMOR_START_NAME=装甲惩罚开始的状况
ARMOR_START_HELP=低于此状况时，损耗会降低装甲的防护。设为0.5时，装甲在状况降到一半前都如同全新。
VALUE_EXPONENT_NAME=损耗降低价格
VALUE_EXPONENT_HELP=损耗物品失去价值的速度。设为1.5时，状况一半的物品值原价35%。设为0则保持原价。
FIRE_RATE_FLOOR_NAME=状况为0时的射速
FIRE_RATE_FLOOR_HELP=自动武器在状况为0时仍保有多少射速。设为1时，损耗不会降低射速。
CRIT_METER_FLOOR_NAME=状况为0时的爆击
CRIT_METER_FLOOR_HELP=武器在状况为0时保留多少爆击，对你和其他角色都适用。设为1时，损耗不会减少爆击。
ACCURACY_FLOOR_NAME=状况为0时的准度
ACCURACY_FLOOR_HELP=枪支在状况为0时保有多少准度。设为0.75时散布扩大三分之一，设为1时不会降低。
RANGE_FLOOR_NAME=状况为0时的射程
RANGE_FLOOR_HELP=枪支在状况为0时保持伤害的距离比例。设为0时都像远距离射击，设为1时不缩短。
BENCH_COST_NAME=工作台修理成本
BENCH_COST_HELP=在工作台修理所需的元件数量。0.5会使花费减半，2则加倍，0则让所有修理免费。
FREE_MEND_NAME=免费修补的状况
FREE_MEND_HELP=状况高于此值时，在工作台修补免费。设为100则取消，设为0则损坏物品以外皆可修补。
TRADER_PRICE_NAME=商人修理价格
TRADER_PRICE_HELP=商人修理所收取的瓶盖数量。0.5会使价格减半，2则加倍。

[Page HUD and log]
HUD_BAR_X_NAME=状态栏状况条距左边缘
HUD_BAR_X_HELP=弹药计数旁状况条与文字的起点，从左边缘算起，任何分辨率皆同。
HUD_BAR_Y_NAME=状态栏状况条距上边缘
HUD_BAR_Y_HELP=弹药计数旁状况条与文字的起点，从上边缘算起，任何分辨率皆同。
HUD_BAR_DEFAULT=默认为{0}。
POWER_ARMOR_BAR_X_NAME=动力装甲状况条左右位置
POWER_ARMOR_BAR_X_HELP=移动动力装甲中的状况条：大于0向右，小于0向左。超出屏幕边缘时会隐藏。
POWER_ARMOR_BAR_Y_NAME=动力装甲状况条上下位置
POWER_ARMOR_BAR_Y_HELP=移动动力装甲中的状况条：大于0向上，小于0向下。超出屏幕边缘时会隐藏。
HUD_BAR_HIDES_NAME=状况条随弹药计数隐藏
HUD_BAR_HIDES_HELP=射击后弹药计数淡出时，状况条也会隐藏。近战武器仍会显示。关闭时会保留。
LOG_LEVEL_NAME=日志详细程度
LOG_LEVEL_HELP=NEC.log（位于Documents\My Games\Fallout4\F4SE）的详细程度。报告错误时请选debug。

