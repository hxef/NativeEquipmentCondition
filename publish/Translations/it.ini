BENCH_COST_HELP=Componenti richiesti da una riparazione al banco. 0.5 dimezza il costo, 2 lo raddoppia e 0 la rende gratis.
FREE_MEND_NAME=Aggiusta gratis sopra
FREE_MEND_HELP=Sopra queste condizioni, AGGIUSTA al banco è gratis. 100 lo disattiva e 0 aggiusta tutto tranne il rotto.
TRADER_PRICE_NAME=Prezzo riparazioni dai commercianti
TRADER_PRICE_HELP=Quanti tappi chiede un commerciante per una riparazione. 0.5 dimezza il prezzo e 2 lo raddoppia.

