RANGE_FLOOR_NAME=Alcance com condição 0
RANGE_FLOOR_HELP=Até onde uma arma de fogo mantém o dano com condição 0. Com 0, acerta como de longe. Com 1, não cai.
BENCH_COST_NAME=Custo de conserto na bancada
