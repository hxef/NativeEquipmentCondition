; Native Equipment Condition
;
; Every setting the mod has. Put your own changes in NEC_custom.ini in the
; same folder, with the same sections and keys, so an update of the mod
; writes over nothing of yours. A key in neither file keeps the value below.
; A change typed into either file takes a game restart. NEC's page in the Mod
; Configuration Menu changes any setting on the spot and saves it into
; NEC_custom.ini.
;
; NEC works alongside other DLL mods that change the same things. When one
; takes over something NEC changes, NEC lets it. A feature's switch here goes
; off only when that mod takes something the feature cannot work without, and
; it stays off while that mod is installed. NEC.log and NEC's page name that
; mod and what is off.

[Features]

; Your guns below half condition, or below fWeaponPenaltyStart when that is
; lower, can jam. A reload clears the jam.
bJam=true

; Apparel with no armor rating or bonus never wears and shows no CND. When
; off, it wears like armor, and a piece worn before has its old condition.
bPlainApparelNeverWears=false

; Weapons and armor you find are already worn. How worn depends on where they
; come from and who carried them. What companions and other essential NPCs
; start with is new. When off, everything turns up new.
bSpawnCondition=true

; Traders who deal in weapons, armor or clothing repair them for caps. The
; further a trader repairs a kind of gear, the better shape their own stock of
; it is in. When off, only the workbenches repair, and a trader's stock is as
; worn as any loot, but for apparel with no armor rating or bonus, which they
; always sell at 100%.
bVendorRepair=true

; Loading screen tips about condition, repairs and loot. A tip about a
; feature switched off never shows.
bLoadingTips=true

; The Weapon CND bar on the HUD, by the ammo counter. When off, the item cards
; and the Pip-Boy still show condition.
bHudCondition=true

; The Power armor CND bar on the HUD, on the power armor dash. When off, the
; item cards and the Pip-Boy still show condition.
bPowerArmorBar=true

; Condition meters in the list the HUD shows when you look at a container or a
; body.
bQuickContainer=true

; Base game fix. A workbench's confirmation box grows to show more of a long
; component list and scrolls it with the mouse wheel, the arrow keys, the
; D-pad and W and S. When off, the box is left to the game or to another mod
; that fixes it.
bConfirmScroll=true

; Base game fix. At a trader, the inspect screen shows the price for the side
; the item is on, what the trader charges for theirs and pays for yours. The
; game shows whichever side it priced last. When off, the price is left to the
; game or to another mod that fixes it.
bInspectPrice=true

; Food you or a companion carried, and food on the dead, spoils with time, as
; in Fallout 76. Spoiled food shows as a 2nd row at 0 condition, heals only
; 10% as much and gives more rads. In Survival it heals nothing and fills only
; 10% of the hunger and thirst. Food never carried never spoils. When off,
; food never spoils, as in the game.
bFoodSpoils=false

; An icon beside a fridge's or cooler's name when you look at it, and on the
; cards of food inside, so you can tell food spoils slower there. Needs food
; spoiling on.
bFridgeIcon=true

[Balance]

; How fast your weapons wear, 0 or more. 2 wears them out twice as fast, 0.5
; half as fast. At 1 an ordinary weapon takes about 1100 shots or swings from
; new to broken. 60 wears one out inside a fight. 0 stops the wear.
fWearRateMult=1.0

; How fast NPC weapons wear, 0 or more, shot by shot and blow by blow as yours
; do. At 0.33 they wear a third as fast as yours at 1. The weapons an
; essential NPC comes with never wear, but whatever you give them does. A
; weapon worn to 0 stays in their hands. 0 stops the wear.
fNpcWearRateMult=0.33

; How fast automatic weapons wear as they fire or cut, up to 10, on top of
; fWearRateMult for yours and fNpcWearRateMult for NPCs'. 2 wears every
; automatic twice as fast and 0.5 half as fast. A gun modded to fire automatic
; counts, and so do the Ripper and the other motor driven blades. A bash wears
; as any other weapon's does. 0 stops the wear.
fAutoWearRateMult=1.0

; How fast your armor wears, 0 or more. At 1 a piece takes about 100 blows of
; an ordinary weapon from new to broken. Every piece covering the limb a blow
; lands on takes it, and the pieces on no limb in particular, a scarf or a
; mask, share every blow. 10 wears a chest piece out in a fight.
fArmorWearRateMult=1.0

; How fast NPC armor wears, 0 or more, blow by blow as yours does. The armor
; an essential NPC comes with never wears, but whatever you give them does. 0
; stops the wear.
fNpcArmorWearRateMult=1.0

; How much damage a weapon at 0 condition still does, up to 1, as a share of
; its full damage, in a straight line up to full damage at
; fWeaponPenaltyStart. 0.66 is what Fallout 3 shipped.
fDamageFloor=0.66

; The condition where wear starts to lower a weapon's damage, fire rate, VATS
; criticals, accuracy and range, yours and NPCs', up to 1. Above it a weapon
; performs as new, and below it each of those runs in a straight line down to
; its floor at 0 condition. At 0.5 a weapon performs as new down to half
; condition. Jams begin below half condition or below this, whichever is
; lower, with the same chances squeezed into that span. The price still falls
; from full condition. At 0 a weapon performs as new until it breaks, and a
; broken one at its floors.
fWeaponPenaltyStart=1.0

; How much protection a piece of armor at 0 condition still gives, up to 1, as
; a share of its full damage, energy and radiation resistance, in a straight
; line up to full at fArmorPenaltyStart. 0.66 keeps step with the damage, and
; is close to what the older games left a worn out piece: Fallout 3 kept 0.62
; of the rating at 0 and New Vegas 0.66, where Fallout 76 keeps all of it down
; to the break and none past it. A piece at 0 stays on and protects this much
; until it is taken off.
fArmorFloor=0.66

; The condition where wear starts to lower the protection of a piece of armor,
; yours and NPCs', up to 1. Above it a piece protects as new, and below it its
; protection runs in a straight line down to fArmorFloor at 0 condition. At
; 0.5 a piece protects as new down to half condition. The price still falls
; from full condition. At 0 a piece protects as new until it breaks, and a
; broken one at fArmorFloor.
fArmorPenaltyStart=1.0

; How fast worn items lose value, 0 or more: an item is worth its condition
; raised to this power. 1.5 is the Fallout 3 and New Vegas curve, where half
; condition gets 35% of the price. 1 makes the price follow the condition in a
; straight line. 0 keeps the full price at any condition.
fValueExponent=1.5

; How fast an automatic weapon at 0 condition fires, yours and NPCs', from 0.1
; to 1, as a share of its own rate, in a straight line up to its full rate at
; fWeaponPenaltyStart. The Ripper counts, its blade runs on a motor. Kept near
; the top because it stacks with the damage: a gun at 0.75 of its rate hitting
; for 0.66 already deals half. 1 means wear never slows it.
fFireRateFloor=0.75

; How much of the VATS critical meter a shot from a weapon at 0 condition
; fills, as a share of what it fills when the weapon is in full condition. An
; NPC's weapon at 0 keeps the same share of its critical chance. Your own
; critical chance outside VATS is left as it is. 1 means wear never lowers
; either.
fCritMeterFloor=0.5

; How accurate a gun at 0 condition still is, yours and NPCs', from 0.1 to 1,
; as a share of its accuracy when new, in a straight line up to full at
; fWeaponPenaltyStart. At 0.75 its shots spread over a cone a third wider from
; the hip and down the sights, the crosshair opens with them, and the item
; card and VATS count 0.75 of its accuracy. Sneaking, aiming and perks still
; tighten the spread as before, and no gun spreads wider than the game
; allows. 1 means wear never lowers it.
fAccuracyFloor=0.75

; How far a gun at 0 condition still carries its damage, yours and NPCs', up
; to 1, as a share of its range when new, in a straight line up to full at
; fWeaponPenaltyStart. At 0.75 the point where its damage starts to fall and
; the point where it bottoms out both come in to three quarters of their
; distance. Up close nothing changes, and the item card's range drops with it.
; At 0 a broken gun hits as if from afar at any distance. 1 means wear never
; shortens it.
fRangeFloor=0.75

; What a repair at a workbench costs, up to 10. 0.5 halves every bill of
; components and 2 doubles it. The crafting perks still take off their share.
; At 0 every repair is free and done on the spot, the way MEND works, broken
; gear included.
fBenchCostMult=1.0

; The condition above which a workbench mends an item for free, in percent, a
; whole number up to 100 such as 90. The button reads MEND and puts the item
; back to full on the spot, so the few shots that close the mod slots at the
; default mod lock never cost components. 100 makes every repair cost
; components, and 0 mends everything but broken gear for free.
iFreeMendAbove=95

; The condition a weapon or piece of armor needs before a workbench opens its
; mod slots, up to 1. At 1 it must be repaired to full first. That stops a
; cheap trick: a repair costs what the mods on the item are built from, so
; with the slots open you could swap in cheap mods, repair, and swap the good
; ones back. At 0.5, gear at half condition or more can be modded. At 0 the
; slots never lock.
fModLockStart=1.0

; What a trader asks for a repair, up to 10. 0.5 halves every price and 2
; doubles it.
fTraderPriceMult=1.0

; Game days raw meat, eggs and crops stay fresh, from 0.25 to 30.
; Sleeping, waiting and fast travel count.
fRawFoodDays=2.0

; Game days cooked food stays fresh, from 0.25 to 30.
fCookedFoodDays=7.0

; How fast food spoils in a fridge or cooler, from 0.01 to 1. 0.5 is half
; speed, as in Fallout 76. 1 makes a fridge change nothing.
fFridgeSpoilSpeed=0.5

; Spoiled food a chemistry station takes for 1 Fertilizer, up to 20. 0
; removes the Fertilizer row.
iSpoiledPerFertilizer=10

; Healing and bonuses spoiled food gives outside Survival, in % of the fresh
; food's, from 0 to 100. In Survival it gives none.
iSpoiledHealing=10

; Hunger and thirst spoiled food fills in Survival, in % of the fresh food's,
; from 0 to 100. Survival fills at least its smallest meal, even at 0.
iSpoiledHunger=10

; How many extra rads spoiled food gives, from 0 to 5. 1 is normal, 2 is
; twice as many and 0 adds none.
fSpoiledRadsMult=1.0

[HUD]

; Where the CND bars sit, moved from their own place in units of the HUD,
; which is 1280 across and 720 high on any screen. 0 and 0 is each bar's own
; place. Above 0 moves a bar right or up, below 0 left or down.
;
; How long and how thick each bar is drawn, from 0.5 to 3 times its own
; length or thickness. 1 is its own size. The bar grows or shrinks from its
; right end, where the CND word starts, and the word keeps its size.

; The Weapon CND bar, by the ammo counter, which takes the place of the line
; between the 2 ammo numbers where it fits. Moved off it, that line shows
; again. The bar stays whole on screen however far it is moved. The MCM page
; shows where the bar starts instead, in the same units from the top left
; corner of the screen.
fHudBarX=0
fHudBarY=0
fHudBarLength=1.0
fHudBarThickness=1.0

; The Weapon CND bar hides with the ammo counter, which the game fades out
; about 10 seconds after your last shot. The game never shows the counter for
; a melee weapon, so the bar still shows while the weapon is out. When off,
; the bar stays while a gun is out.
bHudBarHidesWithCounter=false

; Shows the CND word beside the Weapon CND bar. When off, only the bar shows.
bHudBarShowsWord=true

; The Power armor CND bar, on the power armor dash between its ammo digits. It
; still sways with the dash, and past the edge of the screen it hides.
; fPowerArmorBarX moves the bar left or right of its own place, right
; above 0 and left below 0. fPowerArmorBarY moves it up or down, up above 0
; and down below 0.
fPowerArmorBarX=0
fPowerArmorBarY=0
fPowerArmorBarLength=1.0
fPowerArmorBarThickness=1.0

; Shows the CND word beside the Power armor CND bar. When off, only the bar
; shows.
bPowerArmorBarShowsWord=true

[Log]

; How much NEC.log, in Documents\My Games\Fallout4\F4SE, writes: trace, debug,
; info, warning or error. Info says what NEC changed, what it shares with or
; leaves to other mods, and what it read from your load order. Debug adds more
; to help find a bug.
sLogLevel=info

; The 4 bug report logs beside NEC.log, with a line for every shot, hit, menu
; drawn, item spawned and food stamped. They grow past a megabyte in an hour,
; so leave them off unless you are reporting a bug.
bTraceLogs=false
