[Page switches]
JAM_HELP=Ваше оружие ниже половины состояния может заклинить до перезарядки. Если отключено, нет.
PLAIN_APPAREL_NAME=Простая одежда не изнашивается
PLAIN_APPAREL_HELP=Одежда без показателя брони и бонусов не изнашивается и не показывает состояние. Если отключено, изнашивается как броня.
SPAWN_CONDITION_HELP=Найденные оружие и броня уже изношены, смотря у кого они были. Если отключено, они новые.
VENDOR_REPAIR_HELP=Торговцы оружием, броней или одеждой чинят их за крышки. Если отключено, только верстаки.
SPARE_REPAIR_NAME=Ремонт запасным
SPARE_REPAIR_HELP=Добавляет ИСПОЛЬЗОВАТЬ ЗАПАСНОЙ в окно ремонта на верстаке, если у вас есть еще один такой предмет.
UNSCRAPPABLE_SPARES_NAME=Неразбираемые запасные
UNSCRAPPABLE_SPARES_HELP=Снаряжение, которое РАЗОБРАТЬ не принимает, как запасное: ничего, только легендарное или все, даже уникальное, как Криолятор из оригинала.
LOADING_TIPS_HELP=Добавляет на экраны загрузки советы об износе, ремонте и трофеях. Если отключено, их нет.
HUD_CONDITION_NAME=Полоса состояния оружия
HUD_CONDITION_HELP=Показывает полосу состояния у патронов. Если отключено, состояние лишь в карточках.
POWER_ARMOR_BAR_NAME=Полоса состояния силовой брони
POWER_ARMOR_BAR_HELP=Показывает полосу состояния на панели силовой брони. Если отключено, состояние лишь в карточках.
QUICK_CONTAINER_HELP=Показывает состояние в списке при взгляде на ящик или тело. Если отключено, его там нет.
CONFIRM_SCROLL_HELP=Исправление игры. Окно подтверждения больше, с прокруткой. Если отключено, бывает маленьким.
INSPECT_PRICE_HELP=Исправление игры. Осмотр у торговца дает верную цену. Если отключено, возможна ошибка.
FOOD_SPOILS_HELP=Пища, которую носили вы или спутник, и пища на мертвых портится со временем. Если отключено, пища не портится.
FRIDGE_ICON_NAME=Значок холодильника
FRIDGE_ICON_HELP=Показывает значок у названия холодильника и на карточках пищи внутри. Там пища портится медленнее.
TRACE_LOGS_NAME=Журналы для отчетов об ошибках
TRACE_LOGS_HELP=Пишет еще 4 журнала рядом с NEC.log. Они быстро растут, так что включайте только для отчета.

[Page wear]
WEAR_RATE_NAME=Скорость износа оружия
WEAR_RATE_HELP=Как быстро изнашивается ваше оружие. 1 обычная скорость, 2 вдвое быстрее, 0 без износа.
NPC_WEAR_RATE_NAME=Скорость износа оружия NPC
NPC_WEAR_RATE_HELP=Как быстро изнашивается оружие NPC. 1 обычная скорость, 0.33 втрое медленнее, 0 без износа.
AUTO_WEAR_RATE_NAME=Скорость износа автоматического оружия
AUTO_WEAR_RATE_HELP=Умножает скорости выше при стрельбе и резке. 1 обычная, 2 вдвое выше, 0 без износа.
ARMOR_WEAR_RATE_NAME=Скорость износа брони
ARMOR_WEAR_RATE_HELP=Как быстро изнашивается ваша броня. 1 обычная скорость, 2 вдвое быстрее, 0 без износа.
NPC_ARMOR_WEAR_RATE_NAME=Скорость износа брони NPC
NPC_ARMOR_WEAR_RATE_HELP=Как быстро изнашивается броня NPC. 1 обычная скорость, 0.33 втрое медленнее, 0 без износа.

[Page numbers]
DAMAGE_FLOOR_NAME=Урон при состоянии 0
DAMAGE_FLOOR_HELP=Сколько урона сохраняет оружие в состоянии 0. При 1 износ его не снижает.
WEAPON_START_NAME=Штрафы оружия ниже
WEAPON_START_HELP=Ниже этого состояния износ ослабляет оружие. При 0.5 оружие как новое до половины состояния.
ARMOR_FLOOR_NAME=Защита при состоянии 0
ARMOR_FLOOR_HELP=Сколько защиты сохраняет броня в состоянии 0. При 1 износ ее не снижает.
ARMOR_START_NAME=Штрафы брони ниже
ARMOR_START_HELP=Ниже этого состояния износ ослабляет броню. При 0.5 броня как новая до половины состояния.
LOOT_SHIFT_NAME=Сдвиг состояния трофеев
LOOT_SHIFT_HELP=Сдвигает трофеи к изношенному или новому. При -100 всё найденное изношено до предела, при 100 в лучшем состоянии.
VALUE_EXPONENT_NAME=Падение цены при износе
VALUE_EXPONENT_HELP=Как быстро дешевеют изношенные предметы. При 1.5 полуизношенный стоит 35%. 0 сохраняет цену.
FIRE_RATE_FLOOR_NAME=Скорострельность при состоянии 0
FIRE_RATE_FLOOR_HELP=Как быстро еще стреляет автоматическое оружие в состоянии 0. При 1 износ его не замедляет.
CRIT_METER_FLOOR_NAME=Критические атаки при состоянии 0
CRIT_METER_FLOOR_HELP=Доля критических атак при состоянии 0, у вас и у NPC. При 1 износ их не снижает.
ACCURACY_FLOOR_NAME=Меткость при состоянии 0
ACCURACY_FLOOR_HELP=Меткость оружия в состоянии 0. При 0.75 разброс на треть шире. При 1 износ ее не снижает.
RANGE_FLOOR_NAME=Дальность при состоянии 0
RANGE_FLOOR_HELP=Как далеко оружие в состоянии 0 сохраняет урон. При 0 бьет как издалека, при 1 как новое.
BENCH_COST_NAME=Стоимость ремонта на верстаке
BENCH_COST_HELP=Компоненты для ремонта на верстаке. 0.5 вдвое дешевле, 2 вдвое дороже, а 0 бесплатно.
SPARE_WORTH_NAME=Ценность запасного
SPARE_WORTH_HELP=Сколько состояния восстанавливает запасной: при 0.5 как от его разборки, 1 вдвое больше, 2 вчетверо. Ранги Мусорщика тоже повышают.
FREE_MEND_NAME=Бесплатно подправить выше
FREE_MEND_HELP=Выше этого состояния ПОДПРАВИТЬ бесплатно. 100 отключает, при 0 все, кроме сломанного.
MOD_LOCK_NAME=Запрет модификаций ниже
MOD_LOCK_HELP=Ниже этого состояния верстак не модифицирует предмет. При 1 нужно полное состояние, 0 снимает запрет.
TRADER_PRICE_NAME=Цена ремонта у торговцев
TRADER_PRICE_HELP=Сколько крышек торговец просит за ремонт. 0.5 вдвое снижает цену, а 2 удваивает ее.
RAW_FOOD_DAYS_NAME=Сырая пища хранится
RAW_FOOD_DAYS_HELP=Игровых дней, в течение которых хранятся сырое мясо, яйца и урожай. 2 дня это около 2.4 часа игры.
COOKED_FOOD_DAYS_NAME=Готовая пища хранится
COOKED_FOOD_DAYS_HELP=Игровых дней, в течение которых хранится готовая пища. 7 дней это около 8.4 часа игры.
FRIDGE_SPEED_NAME=Порча в холодильнике
FRIDGE_SPEED_HELP=Как быстро пища портится в холодильнике или сумке-холодильнике. 0.5 значит вдвое медленнее.
SPOILED_PER_FERTILIZER_NAME=Испорченной пищи на удобрение
SPOILED_PER_FERTILIZER_HELP=Сколько испорченной пищи химическая станция берёт на 1 удобрение. 0 убирает строку удобрения.
SPOILED_HEALING_NAME=Лечение испорченной пищей
SPOILED_HEALING_HELP=Лечение и бонусы, которые испорченная пища даёт вне режима выживания, в % от свежей пищи. В режиме выживания она их не даёт.
SPOILED_HUNGER_NAME=Сытость от испорченной пищи
SPOILED_HUNGER_HELP=Голод и жажда, что утоляет испорченная пища в режиме выживания, в % от свежей.
SPOILED_RADS_NAME=Радиация от испорченной пищи
SPOILED_RADS_HELP=Дополнительные рады, которые испорченная пища добавляет к своим. 1 это 15 для мяса и 5 для другой пищи, 2 вдвое больше, 0 ничего.
SPOILED_SICKNESS_NAME=Болезни от испорченной пищи
SPOILED_SICKNESS_HELP=Шанс заболеть от испорченной пищи в режиме выживания, кратный шансу свежей пищи.

[Page HUD and log]
HUD_BAR_X_NAME=Полоса состояния оружия от левого края
HUD_BAR_X_HELP=Начало полосы с надписью у патронов, слева, при любом разрешении.
HUD_BAR_Y_NAME=Полоса состояния оружия от верхнего края
HUD_BAR_Y_HELP=Начало полосы с надписью у патронов, сверху, при любом разрешении.
HUD_BAR_DEFAULT=По умолчанию: {0}.
HUD_BAR_LENGTH_NAME=Полоса состояния оружия длина
HUD_BAR_LENGTH_HELP=Длина полосы у патронов. 1 обычная, 2 вдвое длиннее. Надпись состояния не меняет размер.
HUD_BAR_THICKNESS_NAME=Полоса состояния оружия толщина
HUD_BAR_THICKNESS_HELP=Толщина полосы у патронов. 1 обычная, 2 вдвое толще. Надпись состояния не меняет размер.
HUD_BAR_HIDES_NAME=Полоса состояния оружия скрывается со счетчиком
HUD_BAR_HIDES_HELP=Полоса гаснет со счетчиком патронов после выстрела. В ближнем бою видна. Если отключено, видна.
HUD_BAR_ALONE_NAME=Полоса состояния оружия отдельно
HUD_BAR_ALONE_HELP=Оставляет полосу на её месте, когда мод HUD скрывает счетчик патронов. Если отключено, скрывается с ним.
HUD_BAR_WORD_NAME=Полоса состояния оружия с надписью
HUD_BAR_WORD_HELP=Показывает надпись состояния у полосы патронов. Если отключено, видна только полоса.
POWER_ARMOR_BAR_X_NAME=Полоса состояния силовой брони по горизонтали
POWER_ARMOR_BAR_X_HELP=Сдвигает полосу в силовой броне: выше 0 вправо, ниже 0 влево. За краем экрана полоса скрывается.
POWER_ARMOR_BAR_Y_NAME=Полоса состояния силовой брони по вертикали
POWER_ARMOR_BAR_Y_HELP=Сдвигает полосу в силовой броне: выше 0 вверх, ниже 0 вниз. За краем экрана полоса скрывается.
POWER_ARMOR_BAR_LENGTH_NAME=Полоса состояния силовой брони длина
POWER_ARMOR_BAR_LENGTH_HELP=Длина полосы в силовой броне. 1 обычная, 2 вдвое длиннее. Надпись состояния не меняет размер.
POWER_ARMOR_BAR_THICKNESS_NAME=Полоса состояния силовой брони толщина
POWER_ARMOR_BAR_THICKNESS_HELP=Толщина полосы в силовой броне. 1 обычная, 2 вдвое толще. Надпись состояния не меняет размер.
POWER_ARMOR_BAR_WORD_NAME=Полоса состояния силовой брони с надписью
POWER_ARMOR_BAR_WORD_HELP=Показывает надпись состояния у полосы в силовой броне. Если отключено, видна только полоса.
PICKUP_BAR_NAME=Полоса состояния при подборе
PICKUP_BAR_HELP=Полоса состояния под названием лежащего перед вами оружия, брони или еды. У еды это свежесть.
PICKUP_BAR_X_NAME=Полоса состояния при подборе по горизонтали
PICKUP_BAR_X_HELP=Сдвигает полосу в подсказке подбора: выше 0 вправо, ниже 0 влево.
PICKUP_BAR_Y_NAME=Полоса состояния при подборе по вертикали
PICKUP_BAR_Y_HELP=Сдвигает полосу в подсказке подбора: выше 0 вверх, ниже 0 вниз.
PICKUP_BAR_LENGTH_NAME=Полоса состояния при подборе длина
PICKUP_BAR_LENGTH_HELP=Длина полосы в подсказке подбора. 1 обычная, 2 вдвое длиннее. Надпись состояния не меняет размер.
PICKUP_BAR_THICKNESS_NAME=Полоса состояния при подборе толщина
PICKUP_BAR_THICKNESS_HELP=Толщина полосы в подсказке подбора. 1 обычная, 2 вдвое толще. Надпись состояния не меняет размер.
PICKUP_BAR_WORD_NAME=Полоса состояния при подборе с надписью
PICKUP_BAR_WORD_HELP=Показывает надпись состояния у полосы в подсказке подбора. Если отключено, видна только полоса.
LOG_LEVEL_NAME=Подробность журнала
LOG_LEVEL_HELP=Сколько пишет NEC.log в Documents\My Games\Fallout4\F4SE. Для отчета об ошибке выберите debug.
NEC_VERSION=NEC {0} для Fallout 4 {1}

