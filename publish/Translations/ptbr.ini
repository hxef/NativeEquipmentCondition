[Tips]
TIP_WEAR=A condição de armas e armaduras piora com o uso. Uma arma desgastada causa menos dano, uma armadura desgastada protege menos e ambas valem menos tampas.
TIP_BENCH=Use a bancada de armas ou a bancada de armaduras para consertar equipamentos desgastados com os componentes de que são feitos. Só equipamentos em perfeito estado podem ser modificados.
TIP_TRADER=Sem componentes? Armeiros, vendedores de armaduras e alfaiates consertam o seu tipo de equipamento por tampas. Quanto mais sortida a loja, mais perto de novo eles conseguem deixá-lo.
TIP_BROKEN=Uma arma que quebra é guardada. Uma armadura quebrada continua vestida, com todos os bônus, até você tirá-la. De qualquer forma, equipamentos quebrados só podem ser equipados de novo depois de consertados.
TIP_JAM=Armas de fogo com a condição abaixo da metade podem emperrar e forçar uma recarga no pior momento possível. Mantenha em bom estado as armas em que você confia.
TIP_LOOT=O saque raramente está em perfeito estado. Os invasores maltratam o próprio equipamento, enquanto facções bem equipadas, como os Atiradores, cuidam do seu.

