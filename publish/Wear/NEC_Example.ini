; NEC wear list, an example that changes nothing as it is. Copy it under
; another name, such as MyWeapons.ini, and remove the ; from the lines you
; want.
;
; A line holds wear, damage or both, each followed by its number:
;
;   Plugin|ID = wear 1.5 damage 0.3
;
; That weapon wears 1.5 times as fast as usual. At 0 condition it still hits
; for 0.3 of its full damage, so 30%, and its damage climbs in a straight line
; back to full as its condition rises, as for every other weapon.
;
; A line for armor or clothing holds protection in place of damage:
;
;   Plugin|ID = wear 1.5 protection 0.5
;
; That piece wears 1.5 times as fast as usual. At 0 condition it still gives
; half its protection, and its protection climbs back to full as its
; condition rises.
;
; ID      the form ID, as FO4Edit shows it, of 1 of these 5:
;         1. a weapon
;         2. a weapon mod, such as a receiver or a blade
;         3. a piece of armor or clothing
;         4. an armor mod, such as a lining
;         5. a keyword, such as WeaponTypeMelee1H for every one handed
;            melee weapon, WeaponTypeLaser for every laser weapon or
;            ArmorTypeHelmet for every helmet
;
; wear    a multiplier for how fast it wears, from 0 to 10. 1 is normal,
;         2 is double and 0 never wears. The CND row on its item card
;         shows the result.
;
; damage  the share of its full damage it still does at 0 condition, from 0
;         to 1. 0.5 is half, and 1 keeps all of it, so wear never lowers it.
;         The MCM slider Damage at 0 condition sets it for every other
;         weapon.
;
; protection  the share of its full protection a piece of armor still
;         gives at 0 condition, from 0 to 1. The MCM slider Protection at
;         0 condition sets it for every other piece.
;
; The Baseball Bat hits for 30% at 0 condition.
;Fallout4.esm|08E736 = damage 0.3            ; Baseball Bat
;
; Every one handed melee weapon hits for 40% at 0 condition.
;Fallout4.esm|04A0A4 = damage 0.4            ; WeaponTypeMelee1H keyword
;
; A Combat Knife with this blade wears 1.2 times as fast and hits for half at
; 0 condition.
;Fallout4.esm|187A10 = wear 1.2 damage 0.5   ; a blade for the Combat Knife
;
; Ballistic weapons wear 0.8 times as fast and hit for 90% at 0 condition.
;Fallout4.esm|092A86 = wear 0.8 damage 0.9   ; WeaponTypeBallistic keyword
;
; A 10mm with this receiver wears 1.2 times as fast.
;Fallout4.esm|148338 = wear 1.2              ; a 10mm receiver
;
; This weapon of a mod wears twice as fast.
;MyWeaponMod.esp|000801 = wear 2             ; a mod's weapon
;
; The Combat Armor Chest Piece wears 1.5 times as fast and gives half its
; protection at 0 condition.
;Fallout4.esm|11D3C3 = wear 1.5 protection 0.5   ; Combat Armor Chest Piece
;
; The Vault 111 Jumpsuit keeps all its protection however worn it is.
;Fallout4.esm|01EED7 = protection 1              ; Vault 111 Jumpsuit
;
; Every helmet wears 0.8 times as fast.
;Fallout4.esm|12EEE9 = wear 0.8                  ; ArmorTypeHelmet keyword
;
; A Combat Armor Chest Piece with this lighter lining wears 1.2 times as fast.
;Fallout4.esm|245B20 = wear 1.2                  ; a lighter combat armor lining
;
; This armor of a mod wears 1.5 times as fast and gives half its protection at
; 0 condition.
;MyArmorMod.esp|000801 = wear 1.5 protection 0.5 ; a mod's armor
;
; Good to know:
; * wear comes from the item's own line, else from the first line read
;   for 1 of its keywords. Each listed mod on the item then multiplies
;   it, up to 10 in all. A 10mm with the receiver above wears 0.8 x 1.2,
;   so 0.96 times the usual.
; * damage and protection come from the item's own line, else from 1 of
;   its mods, else from 1 of its keywords. The first such line read counts.
; * A weapon's line takes no protection and an armor line no damage. A
;   keyword's line may hold both, and each counts for the kind it fits.
; * NEC leaves power armor pieces to vanilla's own wear, so it skips a line
;   for one.
; * Files are read in name order. An item, mod or keyword set again
;   keeps the first number.
; * Mods and keywords count as the weapon has them, so a receiver that
;   makes a gun automatic brings WeaponTypeAutomatic with it.
; * A weapon's line covers only that record. Some unique weapons, such as
;   the Deliverer, have a record of their own.
; * The wear speed sliders in MCM still apply on top of wear.
; * The first 2 digits of an ID never count. For a light plugin (.esl or
;   ESL flagged), write the last 3 digits or the whole ID.
; * NEC.log lists what each file sets and any line it skips.
