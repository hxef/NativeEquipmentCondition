[Tips]
TIP_WEAR=El estado de las armas y las armaduras empeora con el uso. Un arma desgastada causa menos daño, una armadura desgastada protege menos y ambas valen menos tapas.
TIP_BENCH=Usa un banco de trabajo para armas o para armaduras para reparar el equipo desgastado con los componentes de los que está hecho. Solo el equipo en perfecto estado se puede modificar.
TIP_BENCH_REPAIR=Usa un banco de trabajo para armas o para armaduras para reparar el equipo desgastado con los componentes de los que está hecho.
TIP_TRADER=¿Te faltan componentes? Armeros, vendedores de armaduras y sastres reparan su tipo de equipo a cambio de tapas. Cuanto mejor surtida esté la tienda, más se acercará a quedar como nuevo.
TIP_BROKEN=Un arma que se rompe se guarda. Una armadura rota sigue puesta, con sus bonificaciones, hasta que te la quites. En cualquier caso, el equipo roto no se puede volver a equipar hasta que se repare.
TIP_JAM=Las armas de fuego con el estado por debajo de la mitad pueden encasquillarse y obligarte a recargar en el peor momento. Mantén en buen estado las armas de las que dependes.
TIP_LOOT=El botín rara vez está en perfecto estado. Los saqueadores maltratan su equipo, mientras que las facciones bien equipadas, como los Artilleros, cuidan el suyo.
TIP_FOOD=La comida se pudre con los días, más lento en una hielera o un refrigerador. La comida podrida cura poco, da más rads y apenas te alimenta en Supervivencia. Las cocinas no la aceptan, pero una central química la convierte en fertilizante.

