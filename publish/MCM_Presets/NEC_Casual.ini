; NEC preset: Casual
; Loot turns up in better shape, and no perk rank holds a repair back.
; MEND is free from 90% and a repair takes only its supplies from 75%.
; Plain apparel and settlers' gear never wear, and companions' gear wears half as fast.
; A gameplay setting left out takes NEC.ini's value. A shared preset goes in Data\F4SE\Plugins\NEC\Config\MCM_Presets.

[Features]
bPlainApparelNeverWears=true
iPipboyRepair=2
iRepairLock=0

[Loot]
