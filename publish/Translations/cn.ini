[Repair]
REPAIR_QUESTION={0}的狀況為{1}%。修理至：
REPAIR_DISCOUNT={0}等級{1}使這次修理所需的元件減少{2}%。
TOO_DAMAGED_FULL=狀況需完好才能改造。
TOO_DAMAGED=狀況需達{0}%以上才能改造。
MEND_BUTTON=修補
MENDED_WEAPON=武器已修補。
MENDED_ARMOR=裝甲已修補。
BENCH_CANNOT_REPAIR=此物品無法在工作台修理。商人可以將其修復。
CANNOT_MODIFY=此物品無法改造。

[Trader]
REPAIR_PRICE={0}%，{1}枚瓶蓋
REPAIR_PAID=已花費{1}枚瓶蓋修理至{0}%。
REPAIR_UP_TO_FULL_WEAPONS=這名商人可以將武器修復至完美狀況。
REPAIR_UP_TO_FULL_ARMOR=這名商人可以將裝甲修復至完美狀況。
REPAIR_UP_TO_FULL_CLOTHING=這名商人可以將服飾修復至完美狀況。
REPAIR_UP_TO_WEAPONS=這名商人最多可將武器的狀況修理至{0}%。
REPAIR_UP_TO_ARMOR=這名商人最多可將裝甲的狀況修理至{0}%。
REPAIR_UP_TO_CLOTHING=這名商人最多可將服飾的狀況修理至{0}%。
REPAIR_CEILING_WEAPONS=這名商人最多只能將武器修理至{0}%。
REPAIR_CEILING_ARMOR=這名商人最多只能將裝甲修理至{0}%。
REPAIR_CEILING_CLOTHING=這名商人最多只能將服飾修理至{0}%。
REPAIR_UNAFFORDABLE=瓶蓋不足，無法修理。
REPAIR_TRADE_PENDING=修理前請先接受或重設交易。

[Tips]
TIP_WEAR=武器和裝甲的狀況會隨著使用而下降。損耗的武器傷害較低，損耗的裝甲防護力較差，兩者能換得的瓶蓋也會變少。
TIP_BENCH=使用武器工作台或裝甲工作台，以製作裝備的元件修理損耗的裝備。裝備狀況需完好才能改造。
TIP_TRADER=元件不夠用嗎？武器店、裝甲店和服飾店可以收取瓶蓋，修理自家經營的那類裝備。店裡貨色越齊全，就能修得越接近全新。
TIP_BROKEN=損壞的武器會被收起。損壞的裝甲會連同加成效果一直穿在身上，直到你脫下為止。無論哪種情況，損壞的裝備都必須修理後才能再次裝備。
TIP_JAM=狀況低於一半的槍枝可能會卡彈，讓你在最糟的時機被迫重新裝填。記得讓你倚賴的武器保持良好狀況。
TIP_LOOT=戰利品很少是完好如新的狀況。掠奪者不愛惜裝備，而像「槍手」這樣裝備精良的派系則會好好保養。

