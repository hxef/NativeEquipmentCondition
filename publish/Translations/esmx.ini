[Page switches]
; The switch at the top of NEC's main page that turns all of NEC on or off.
NEC_ON_NAME=Todas las funciones de NEC
NEC_ON_HELP=Activa o desactiva todo NEC mientras juegas. Desactivado: los preajustes y demás páginas de NEC se ocultan, y armas y armaduras conservan su estado.
PLAIN_APPAREL_NAME=La ropa sencilla nunca se desgasta
PLAIN_APPAREL_HELP=La ropa sin valor de armadura ni bonificación nunca se desgasta y no muestra CON. Desactivado: se desgasta como la armadura.
SPAWN_CONDITION_HELP=Las armas y armaduras halladas ya están desgastadas, según su origen y quién las tuviera. Desactivado: nuevas.
VENDOR_REPAIR_HELP=Los comerciantes de armas, armaduras o ropa reparan las tuyas por tapas. Desactivado: no reparan nada.
TRADER_SIGN_NAME=Cartel de reparaciones del comerciante
TRADER_SIGN_HELP=Muestra en la pantalla de trueque hasta dónde repara un comerciante armas, armaduras y ropa. Si está desactivado, lo indica su cuadro de reparación.
WORKBENCH_REPAIR_NAME=Reparaciones en el banco de trabajo
WORKBENCH_REPAIR_HELP=Los bancos reparan armas y armaduras. Si no, los comerciantes aún reparan. Activa también Reparaciones desde el Pip-Boy, como Fallout 3 y New Vegas.
SPARE_REPAIR_NAME=Reparar con repuesto
SPARE_REPAIR_HELP=Añade USAR UN REPUESTO al cuadro de reparación si llevas otra arma o armadura igual, con cualquier mod. Spares only en el Pip-Boy lo necesita.
PIPBOY_REPAIR_NAME=Reparaciones desde el Pip-Boy
PIPBOY_REPAIR_HELP=Inspecciona un arma o armadura gastada en el Pip-Boy y pulsa ¿REPARAR. Spares only gasta un repuesto, Workbench repara como en el banco.
UNSCRAPPABLE_SPARES_NAME=Repuestos no desmantelables
UNSCRAPPABLE_SPARES_HELP=Equipo que DESMANTELAR rechaza, como repuesto: nada, solo legendarios o todo, hasta objetos únicos como el Cryolator del juego base.
KEEP_SPARE_MODS_NAME=Conservar mods del repuesto
KEEP_SPARE_MODS_HELP=Off gasta un repuesto con todos sus mods. Los demás devuelven los mods que la reparación no necesita, o te dejan elegirlos de una lista.
SPARE_MOD_ROWS_NAME=Filas de mods del repuesto
SPARE_MOD_ROWS_HELP=Change muestra lo que cada mod de la lista añade o cuesta, como +3.7% o -4.2%. Result muestra el estado que alcanza la reparación, como 64.2%.
REPAIR_BOX_ROW_NAME=Cuadro de reparación abre en
REPAIR_BOX_ROW_HELP=Fila resaltada al abrir el cuadro de reparación. Sin repuesto, USAR UN REPUESTO elige el mayor nivel de estado de reparación.
REPAIR_COLUMNS_NAME=Filas de reparación en columnas
REPAIR_COLUMNS_HELP=Pone en columnas las filas de los cuadros de reparación. Desactivado: una línea centrada por fila, como el juego base.
REPAIR_GAINS_NAME=Mejoras en los cuadros de reparación
REPAIR_GAINS_HELP=Muestra lo que cada reparación añade al daño o las resistencias del objeto. Desactivado: los cuadros lo omiten.
REPAIR_LOCK_NAME=Bloqueo de reparaciones
REPAIR_LOCK_HELP=Las reparaciones que gastan componentes requieren rangos de extras de fabricación, el último para cada objeto o el más alto que pidan sus mods.
LOCK_SPARES_NAME=Bloquear también repuestos
LOCK_SPARES_HELP=Los repuestos también siguen el Bloqueo de reparaciones y solo reparan desde el estado que permiten tus rangos de extras. Un comerciante aún repara.
LOADING_TIPS_HELP=Agrega consejos sobre desgaste, reparaciones, botín y comida que se pudre a las pantallas de carga. Desactivado: ninguno.
HUD_CONDITION_NAME=CON del arma
HUD_CONDITION_HELP=Muestra el estado de tu arma junto a la munición, como barra o como porcentaje. Off no muestra nada.
POWER_ARMOR_BAR_NAME=CON del panel de la servoarmadura
POWER_ARMOR_BAR_HELP=Muestra el estado de tu arma en el panel de la servoarmadura, como barra o como porcentaje. Off no muestra nada.
QUICK_CONTAINER_NAME=CON en la lista de contenedores
QUICK_CONTAINER_HELP=Muestra el estado en las filas de la lista de contenedores, la que aparece ante un contenedor o un cadáver, como barra o porcentaje.
CARD_CND_NAME=CON en las fichas
CARD_CND_HELP=Muestra CON en las fichas como barra con marco o como porcentaje, por ejemplo 87.4%. Off deja las fichas como el juego base, sin fila CON.
CARD_WEAR_RATE_NAME=Velocidad de desgaste en las fichas
CARD_WEAR_RATE_HELP=Muestra junto a CON lo rápido que un objeto se desgasta o pudre, x1.0 para uno normal de su tipo. Si se desactiva, solo CON.
POWER_ARMOR_CND_NAME=CON de la servoarmadura en las fichas
POWER_ARMOR_CND_HELP=Muestra la Salud de las piezas de servoarmadura como CON. No cambia nada más. Si se desactiva, como el juego base.
CND_DECIMALS_NAME=Decimales de CON
CND_DECIMALS_HELP=Always muestra 98.0% y 97.5%. Fractions only muestra 98% y 97.5%. Off muestra números enteros.
CND_COLUMN_NAME=Columna CON en listas de mods de interfaz
CND_COLUMN_HELP=Añade una columna CON a las listas de Pip-Boy, comercio, contenedores y banco de tu mod de interfaz. Si se desactiva, no cambian.
CONFIRM_SCROLL_HELP=Arreglo del juego base. La confirmación del banco crece y se desplaza. Desactivado: puede ser pequeña.
INSPECT_PRICE_HELP=Arreglo del juego base. Al comerciar, Inspeccionar muestra el precio correcto. Desactivado: puede fallar.
FOOD_SPOILS_HELP=La comida que tú o un acompañante llevaron, y la de los muertos, se pudre con el tiempo. Desactivado: se conserva.
FRIDGE_ICON_NAME=Ícono de refrigerador
FRIDGE_ICON_HELP=Muestra un ícono en el nombre del refrigerador y en las fichas de su comida, que allí se pudre más despacio.
TRACE_LOGS_NAME=Registros para reportar errores
TRACE_LOGS_HELP=Escribe 5 registros más junto a NEC.log. Crecen rápido, así que actívalo solo para reportar un error.

[Page wear]
WEAR_RATE_NAME=Velocidad de desgaste de armas
WEAR_RATE_HELP=Qué tan rápido se desgastan tus armas. 1 es normal, 2 es el doble de rápido y 0 detiene el desgaste.
NPC_WEAR_RATE_NAME=Velocidad de desgaste de armas de otros personajes
NPC_WEAR_RATE_HELP=Qué tan rápido se desgastan las armas de otros. 1 es normal, 0.33 es un tercio y 0 detiene el desgaste.
AUTO_WEAR_RATE_NAME=Velocidad de desgaste de armas automáticas
AUTO_WEAR_RATE_HELP=Multiplica las velocidades de arriba al disparar o cortar. 1 es normal, 2 el doble y 0 detiene el desgaste.
ARMOR_WEAR_RATE_NAME=Velocidad de desgaste de armaduras
ARMOR_WEAR_RATE_HELP=Qué tan rápido se desgasta tu armadura. 1 es normal, 2 es el doble de rápido y 0 detiene el desgaste.
NPC_ARMOR_WEAR_RATE_NAME=Velocidad de desgaste de armaduras de otros personajes
NPC_ARMOR_WEAR_RATE_HELP=Qué tan rápido se desgastan las armaduras de otros. 1 es normal, 0.33 es un tercio y 0 detiene el desgaste.
COMPANION_WEAR_RATE_NAME=Velocidad de desgaste de armas de compañeros
COMPANION_WEAR_RATE_HELP=Qué tan rápido se desgastan las armas de tus compañeros, sobre la de otros. 1 es normal y 0 detiene el desgaste.
SETTLER_WEAR_RATE_NAME=Velocidad de desgaste de armas de colonos
SETTLER_WEAR_RATE_HELP=Qué tan rápido se desgastan las armas de tus colonos, sobre la de otros. 1 es normal y 0 detiene el desgaste.
SUPPRESSED_WEAR_RATE_NAME=Velocidad de desgaste de armas con silenciador
SUPPRESSED_WEAR_RATE_HELP=Multiplica las velocidades de arriba al disparar con silenciador. 1 es normal, 2 el doble y 0.5 la mitad.
COMPANION_ARMOR_WEAR_RATE_NAME=Velocidad de desgaste de armaduras de compañeros
COMPANION_ARMOR_WEAR_RATE_HELP=Qué tan rápido se desgastan las armaduras de tus compañeros, sobre la de otros. 1 es normal y 0 detiene el desgaste.
SETTLER_ARMOR_WEAR_RATE_NAME=Velocidad de desgaste de armaduras de colonos
SETTLER_ARMOR_WEAR_RATE_HELP=Qué tan rápido se desgastan las armaduras de tus colonos, sobre la de otros. 1 es normal y 0 detiene el desgaste.

[Page numbers]
DAMAGE_FLOOR_NAME=Daño con estado 0
DAMAGE_FLOOR_HELP=Cuánto daño conserva un arma con estado 0. Con 1, el desgaste nunca lo reduce.
WEAPON_START_NAME=Penalización de armas empieza en
WEAPON_START_HELP=En este estado, el desgaste empieza a debilitar un arma, y las barras CON lo marcan. Con 0.5, funciona como nueva hasta la mitad de su estado.
ARMOR_FLOOR_NAME=Protección con estado 0
ARMOR_FLOOR_HELP=Cuánta protección conserva una armadura con estado 0. Con 1, el desgaste nunca la reduce.
ARMOR_START_NAME=Penalización de armaduras empieza en
ARMOR_START_HELP=En este estado, el desgaste empieza a debilitar la armadura, y las barras CON lo marcan. Con 0.5, es como nueva hasta la mitad de su estado.
LOOT_SHIFT_NAME=Desplazar estado del botín
LOOT_SHIFT_HELP=Mueve el botín hacia desgastado o nuevo. A -100 todo sale lo más desgastado posible, a 100 lo mejor posible.
LOOT_SURPRISE_NAME=Botín sorpresa 1 de cada
LOOT_SURPRISE_HELP=Un objeto sorpresa sale con un estado al azar, sin importar quién lo llevara. Cuanto mayor el número, más raras las sorpresas. A 0 no hay sorpresas.
LOOT_AREA_NAME=Botín suelto según el valor de la zona
LOOT_AREA_HELP=El botín fuera de contenedores sale en mejor estado en zonas bien surtidas y en peor en las pobres. 0 lo desactiva y 2 lo duplica.
VALUE_EXPONENT_NAME=Pérdida de valor por desgaste
VALUE_EXPONENT_HELP=Qué tan rápido se deprecia lo desgastado. Con 1.5, a mitad de estado vale el 35%. 0 mantiene el precio.
FIRE_RATE_FLOOR_NAME=Cadencia de tiro con estado 0
FIRE_RATE_FLOOR_HELP=Qué tan rápido sigue disparando un arma automática con estado 0. Con 1, el desgaste nunca la frena.
CRIT_METER_FLOOR_NAME=Críticos con estado 0
CRIT_METER_FLOOR_HELP=Cuántos críticos conserva un arma con estado 0, para ti y los demás. Con 1, el desgaste no los reduce.
ACCURACY_FLOOR_NAME=Precisión con estado 0
ACCURACY_FLOOR_HELP=Precisión de un arma de fuego con estado 0. Con 0.75, se dispersa un tercio más. Con 1, no baja.
RANGE_FLOOR_NAME=Alcance con estado 0
RANGE_FLOOR_HELP=Alcance del daño de un arma de fuego con estado 0. Con 0, golpea como desde lejos. Con 1, no baja.
JAM_CHANCE_NAME=Encasquillamientos con estado 0
JAM_CHANCE_HELP=Cuánto se encasquilla un arma casi a estado 0: con 1, una vez por cargador, con 0.5, uno de cada 2. Con 0, nunca.
JAM_START_NAME=Encasquillamientos empiezan en
JAM_START_HELP=En este estado tus armas de fuego empiezan a encasquillarse, poco al principio y más a medida que baja. Dura hasta recargar.
BENCH_COST_NAME=Costo de reparación en el banco de trabajo
BENCH_COST_HELP=Componentes por reparación en el banco, además de sus suministros. 0.5 los reduce a la mitad, 2 los duplica y 0 hace gratis toda reparación.
PERK_COMPONENT_DISCOUNT_NAME=Descuento de componentes por extras
PERK_COMPONENT_DISCOUNT_HELP=Los componentes de reparación que ahorras con todos los rangos del extra de fabricación del objeto. Con 50, los 4 rangos ahorran un 50% y 2, un 25%.
SPARE_WORTH_NAME=Valor del repuesto
SPARE_WORTH_HELP=Cuánto estado restaura un repuesto: a 0.5 lo que da desmantelarlo, 1 el doble, 2 el cuádruple. Cada rango de Chatarrero lo sube.
FREE_MEND_NAME=Retoque gratis desde
FREE_MEND_HELP=Desde este estado, según los Decimales de CON, RETOCAR en el banco es gratis. 100 lo desactiva y 0 lo retoca todo.
MOD_LOCK_NAME=Modificaciones en el banco desde
MOD_LOCK_HELP=Desde este estado, un banco de trabajo puede modificar un objeto. Con 100 debe estar al máximo, y con 0 sirve cualquier estado.
REPAIR_SUPPLIES_NAME=Suministros de mantenimiento
REPAIR_SUPPLIES_HELP=Suministros al reparar en el banco, 0 nada. Armas de fuego y cuerpo a cuerpo con energía: aceite y tela, otras: adhesivo, armadura: adhesivo y tela.
SUPPLIES_ONLY_NAME=Solo suministros desde
SUPPLIES_ONLY_HELP=Desde este estado, según los Decimales de CON, una reparación en el banco solo gasta suministros, con cualquier rango. 100 lo quita.
PERK_LOCK_NAME=Bloqueo por extras
PERK_LOCK_HELP=Impide reparar objetos desgastados sin los rangos de extras que piden. Con 100, sin 1 de 4 rangos se repara desde el 25%, sin 2, desde el 50%.
TRADER_PRICE_NAME=Precio de reparación de comerciantes
TRADER_PRICE_HELP=Cuántas tapas pide un comerciante por una reparación. 0.5 reduce el precio a la mitad y 2 lo duplica.
TRADER_LEEWAY_NAME=Margen para otros artículos
TRADER_LEEWAY_HELP=Un comerciante repara menos un tipo de equipo que es solo una pequeña parte de su surtido. Valores más altos suavizan esa caída. Con 0 no lo repara.
TRADER_FULL_STOCK_NAME=Surtido para reparar al 100%
TRADER_FULL_STOCK_HELP=Un comerciante con esta cantidad de artículos distintos de un tipo en su surtido lo repara al 100%. Con menos lo repara a un nivel más bajo.
RAW_FOOD_DAYS_NAME=La comida cruda dura
RAW_FOOD_DAYS_HELP=Días de juego que duran la carne cruda, los huevos y las cosechas. 2 son unas 2.4 horas de juego.
COOKED_FOOD_DAYS_NAME=La comida cocinada dura
COOKED_FOOD_DAYS_HELP=Días de juego que dura la comida cocinada. 7 son unas 8.4 horas de juego.
FRIDGE_SPEED_NAME=Velocidad de podredumbre en refrigerador
