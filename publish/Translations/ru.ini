BENCH_COST_NAME=Стоимость ремонта на верстаке
BENCH_COST_HELP=Компоненты для ремонта на верстаке. 0.5 вдвое дешевле, 2 вдвое дороже, а 0 бесплатно.
FREE_MEND_NAME=Бесплатно подправить выше
FREE_MEND_HELP=Выше этого состояния ПОДПРАВИТЬ бесплатно. 100 отключает, при 0 все, кроме сломанного.
