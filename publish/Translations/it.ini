[Tips]
TIP_WEAR=Le condizioni di armi e armature peggiorano con l'uso. Un'arma usurata infligge meno danni, un'armatura usurata protegge meno ed entrambe valgono meno tappi.
TIP_BENCH=Usa un banco da lavoro per armi o per armature per riparare l'equipaggiamento usurato con i componenti di cui è fatto. Solo l'equipaggiamento in condizioni perfette può essere modificato.
TIP_TRADER=A corto di componenti? Armaioli, venditori di armature e sarti riparano il loro tipo di equipaggiamento in cambio di tappi. Più il negozio è fornito, più la riparazione si avvicina al nuovo.
TIP_BROKEN=Un'arma che si rompe viene riposta. Un'armatura rotta resta indossata, bonus compresi, finché non la togli. In ogni caso, gli oggetti rotti non possono essere equipaggiati di nuovo finché non vengono riparati.
TIP_JAM=Le armi da fuoco in condizioni inferiori alla metà possono incepparsi e costringerti a ricaricare nel momento peggiore. Tieni in buone condizioni le armi su cui fai affidamento.
TIP_LOOT=Il bottino è raramente in condizioni perfette. I predoni maltrattano il loro equipaggiamento, mentre le fazioni ben equipaggiate come i Gunner ne hanno cura.

