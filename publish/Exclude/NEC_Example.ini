; NEC exclusion list, an example that changes nothing as it is. Copy it
; under another name, such as MyMod.ini, and remove the ; from the lines
; you want.
;
; 1 weapon or piece of armor a line: the plugin that adds it, a bar, its
; form ID as FO4Edit shows it. The first 2 digits of the ID never count,
; and for a light plugin (.esl) only the last 3 do. A listed item takes no
; condition: NEC never rolls, wears or repairs it and never changes its
; stats or price. For gear that has a condition of its own from another
; mod.
;
;Fallout4.esm|004822        ; 10mm Pistol
;MyWeaponMod.esp|000801     ; a mod's weapon
;
; NEC.log lists what each file here leaves alone and any line it skips.
