SPOILED_FOOD=Comida podrida
PERK_DISCOUNT_WEAPONS=Las armas compuestas en su mayoría por módulos de este extra necesitan un {0}% menos de componentes para repararse en el banco de trabajo.
PERK_DISCOUNT_ARMOR=Las armaduras compuestas en su mayoría por módulos de este extra necesitan un {0}% menos de componentes para repararse en el banco de trabajo.
PERK_DISCOUNT_BOTH=Las armas y armaduras compuestas en su mayoría por módulos de este extra necesitan un {0}% menos de componentes para repararse en el banco de trabajo.
PERK_DISCOUNT_WEAPONS_LOCK_FROM=Las armas compuestas en su mayoría por módulos de este extra necesitan un {0}% menos de componentes para repararse en el banco de trabajo, y toda reparación que requiera este extra ya puede empezar desde el {1}% de estado.
PERK_DISCOUNT_WEAPONS_LOCK_ANY=Las armas compuestas en su mayoría por módulos de este extra necesitan un {0}% menos de componentes para repararse en el banco de trabajo, y toda reparación que requiera este extra ya puede empezar en cualquier estado.
PERK_DISCOUNT_ARMOR_LOCK_FROM=Las armaduras compuestas en su mayoría por módulos de este extra necesitan un {0}% menos de componentes para repararse en el banco de trabajo, y toda reparación que requiera este extra ya puede empezar desde el {1}% de estado.
PERK_DISCOUNT_ARMOR_LOCK_ANY=Las armaduras compuestas en su mayoría por módulos de este extra necesitan un {0}% menos de componentes para repararse en el banco de trabajo, y toda reparación que requiera este extra ya puede empezar en cualquier estado.
PERK_DISCOUNT_BOTH_LOCK_FROM=Las armas y armaduras compuestas en su mayoría por módulos de este extra necesitan un {0}% menos de componentes para repararse en el banco de trabajo, y toda reparación que requiera este extra ya puede empezar desde el {1}% de estado.
PERK_DISCOUNT_BOTH_LOCK_ANY=Las armas y armaduras compuestas en su mayoría por módulos de este extra necesitan un {0}% menos de componentes para repararse en el banco de trabajo, y toda reparación que requiera este extra ya puede empezar en cualquier estado.
PERK_PAGE_LOCK_FROM=Toda reparación que requiera este extra ya puede empezar desde el {0}% de estado.
PERK_PAGE_LOCK_ANY=Toda reparación que requiera este extra ya puede empezar en cualquier estado.
PERK_SCRAPPER=Los repuestos usados para reparar armas y armaduras en el banco de trabajo restauran más estado.
