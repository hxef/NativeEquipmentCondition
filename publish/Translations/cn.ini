[Repair]
REPAIR_QUESTION={0}的狀況為{1}%。修理至：
REPAIR_BOX_TITLE=將{0}修理至{1}%？
REPAIR_DISCOUNT={0}等級{1}使這次修理所需的元件減少{2}%。
TOO_DAMAGED_FULL=狀況需完好才能改造。
TOO_DAMAGED=狀況需達{0}%以上才能改造。
MEND_BUTTON=修補
MENDED_WEAPON=武器已修補。
MENDED_ARMOR=裝甲已修補。
BENCH_CANNOT_REPAIR=此物品無法在工作台修理。商人可以將其修復。
CANNOT_MODIFY=此物品無法改造。
SPARE_BUTTON=使用備品
SPARE_QUESTION={0}的狀況為{1}%。消耗一件備品來修理：
SPARE_ROW={0} ({1}%)  +{2}%
SPARE_EQUIPPED=（已裝備）
SPARE_FAVORITE=（最愛）
SPARE_LEGENDARY=（傳說）
SPARE_SALVAGED=回收了{0}。

[Trader]
REPAIR_PRICE={0}%，{1}枚瓶蓋
REPAIR_PAID=已花費{1}枚瓶蓋修理至{0}%。
REPAIR_UP_TO_FULL_WEAPONS=這名商人可以將武器修復至完美狀況。
REPAIR_UP_TO_FULL_ARMOR=這名商人可以將裝甲修復至完美狀況。
REPAIR_UP_TO_FULL_CLOTHING=這名商人可以將服飾修復至完美狀況。
REPAIR_UP_TO_WEAPONS=這名商人最多可將武器的狀況修理至{0}%。
REPAIR_UP_TO_ARMOR=這名商人最多可將裝甲的狀況修理至{0}%。
REPAIR_UP_TO_CLOTHING=這名商人最多可將服飾的狀況修理至{0}%。
REPAIR_CEILING_WEAPONS=這名商人最多只能將武器修理至{0}%。
REPAIR_CEILING_ARMOR=這名商人最多只能將裝甲修理至{0}%。
REPAIR_CEILING_CLOTHING=這名商人最多只能將服飾修理至{0}%。
REPAIR_UNAFFORDABLE=瓶蓋不足，無法修理。
REPAIR_TRADE_PENDING=修理前請先接受或重設交易。

[Tips]
TIP_WEAR=武器和裝甲的狀況會隨著使用而下降。損耗的武器傷害較低，損耗的裝甲防護力較差，兩者能換得的瓶蓋也會變少。
TIP_BENCH=使用武器工作台或裝甲工作台，以製作裝備的元件修理損耗的裝備。裝備狀況需完好才能改造。
TIP_BENCH_REPAIR=使用武器工作台或裝甲工作台，以製作裝備的元件修理損耗的裝備。
TIP_TRADER=元件不夠用嗎？武器店、裝甲店和服飾店可以收取瓶蓋，修理自家經營的那類裝備。店裡貨色越齊全，就能修得越接近全新。
TIP_BROKEN=損壞的武器會被收起。損壞的裝甲會連同加成效果一直穿在身上，直到你脫下為止。無論哪種情況，損壞的裝備都必須修理後才能再次裝備。
TIP_JAM=狀況低於一半的槍枝可能會卡彈，讓你在最糟的時機被迫重新裝填。記得讓你倚賴的武器保持良好狀況。
TIP_LOOT=戰利品很少是完好如新的狀況。掠奪者不愛惜裝備，而像「槍手」這樣裝備精良的派系則會好好保養。
TIP_FOOD=食物會隨著時日腐壞，放在冷藏箱或冰箱裡則較慢。腐壞的食物治療效果差、輻射較多，在生存模式中幾乎無法充飢。烹飪工作台不接受腐壞的食物，但化學工作台可將其製成肥料。

[Messages]
ARMOR_WORN_OUT={0}已完全磨損。
SPOILED_FOOD=腐壞的食物
PERK_DISCOUNT_WEAPONS=主要由此輔助能力的改造配件組成的武器，在工作台修理時所需的元件減少{0}%。
PERK_DISCOUNT_ARMOR=主要由此輔助能力的改造配件組成的裝甲，在工作台修理時所需的元件減少{0}%。
PERK_DISCOUNT_BOTH=主要由此輔助能力的改造配件組成的武器和裝甲，在工作台修理時所需的元件減少{0}%。
PERK_SCRAPPER=在工作台用來修理武器和裝甲的備品能恢復更多狀況。
WEAR_TITLE=損耗
PENALTIES_TITLE=懲罰
JAMS_TITLE=卡彈
HUD_BAR_TITLE=武器狀況條
POWER_ARMOR_BAR_TITLE=動力裝甲狀況條
PICKUP_BAR_TITLE=拾取狀況條
LOOT_TITLE=戰利品與價格
BENCH_REPAIRS_TITLE=工作台修理
SPARE_REPAIRS_TITLE=使用備品修理
VENDOR_REPAIRS_TITLE=商人修理
EXTRAS_TITLE=其他小功能
FOOD_TITLE=食物腐壞
MENUS_TITLE=選單
LOG_TITLE=日誌

[Page switches]
JAM_HELP=你的槍枝狀況低於一半時可能卡彈，重新裝填才能排除。關閉時，槍枝不會卡彈。
PLAIN_APPAREL_NAME=普通服飾不會磨損
PLAIN_APPAREL_HELP=沒有護甲值或加成的服飾不會磨損，也不顯示狀況。關閉時，會像護甲一樣磨損。
SPAWN_CONDITION_HELP=你找到的武器和裝甲已有損耗，程度取決於原本的持有者。關閉時，皆為全新。
VENDOR_REPAIR_HELP=販售武器、裝甲或服飾的商人會收瓶蓋修理你的同類裝備。關閉時，只有工作台能修理。
SPARE_REPAIR_NAME=備品修理
SPARE_REPAIR_HELP=身上帶著同一物品的另一件時，在工作台的修理框加入使用備品按鈕。
UNSCRAPPABLE_SPARES_NAME=不可拆解的備品
UNSCRAPPABLE_SPARES_HELP=拆解按鈕拒絕的裝備可否當備品：不可、僅傳說、或全部，包括原版冰凍槍等獨特物品。
LOADING_TIPS_HELP=在載入畫面加入損耗、修理和戰利品的相關提示。關閉時，不會顯示這些提示。
HUD_CONDITION_NAME=武器狀況條
HUD_CONDITION_HELP=在彈藥計數旁顯示狀況條。關閉時，物品資訊仍會顯示狀況。
POWER_ARMOR_BAR_NAME=動力裝甲狀況條
POWER_ARMOR_BAR_HELP=在動力裝甲儀表板上顯示狀況條。關閉時，物品資訊仍會顯示狀況。
QUICK_CONTAINER_HELP=看向容器或屍體時，彈出的清單會顯示狀況。關閉時則不顯示。
CONFIRM_SCROLL_HELP=原版遊戲修正。工作台確認視窗會放大並可捲動。關閉時，視窗可能維持原本大小。
INSPECT_PRICE_HELP=原版遊戲修正。與商人交易時，檢查物品會顯示正確的買賣價。關閉時，價格可能有誤。
FOOD_SPOILS_HELP=你或同伴帶過的食物，以及屍體上的食物，會隨時間腐壞。關閉時，食物不會腐壞。
FRIDGE_ICON_NAME=冰箱圖示
FRIDGE_ICON_HELP=在你注視冰箱時於其名稱旁顯示圖示，也顯示在裡面食物的資訊卡上。食物在那裡腐壞得較慢。
TRACE_LOGS_NAME=錯誤回報日誌
TRACE_LOGS_HELP=在NEC.log旁另外寫入4個日誌，協助錯誤回報。日誌增長很快，平常遊玩時請保持關閉。

[Page wear]
WEAR_RATE_NAME=武器損耗速度
WEAR_RATE_HELP=你的武器損耗的速度。1為正常，2為2倍速度，0則停止損耗。
NPC_WEAR_RATE_NAME=其他角色的武器損耗速度
NPC_WEAR_RATE_HELP=其他角色的武器損耗的速度。1為正常，0.33為三分之一速度，0則停止損耗。
AUTO_WEAR_RATE_NAME=自動武器損耗速度
AUTO_WEAR_RATE_HELP=射擊或切割時，乘以上方的損耗速度。1為正常，2為兩倍速度，0則停止損耗。
ARMOR_WEAR_RATE_NAME=裝甲損耗速度
ARMOR_WEAR_RATE_HELP=你的裝甲損耗的速度。1為正常，2為2倍速度，0則停止損耗。
NPC_ARMOR_WEAR_RATE_NAME=其他角色的裝甲損耗速度
NPC_ARMOR_WEAR_RATE_HELP=其他角色的裝甲損耗的速度。1為正常，0.33為三分之一速度，0則停止損耗。

[Page numbers]
DAMAGE_FLOOR_NAME=狀況為0時的傷害
DAMAGE_FLOOR_HELP=武器在狀況為0時保留多少傷害。設為1時，損耗不會降低傷害。
WEAPON_START_NAME=武器懲罰開始的狀況
WEAPON_START_HELP=低於此狀況時，損耗會降低武器的性能。設為0.5時，武器在狀況降到一半前都如同全新。
ARMOR_FLOOR_NAME=狀況為0時的防護
ARMOR_FLOOR_HELP=裝甲在狀況為0時保留多少防護。設為1時，損耗不會降低防護。
ARMOR_START_NAME=裝甲懲罰開始的狀況
ARMOR_START_HELP=低於此狀況時，損耗會降低裝甲的防護。設為0.5時，裝甲在狀況降到一半前都如同全新。
LOOT_SHIFT_NAME=戰利品狀況偏移
LOOT_SHIFT_HELP=讓每件戰利品偏向損耗或偏向全新。設為-100時找到的一切都損耗到極限，設為100時狀況最好，0為預設。商人自己的貨品不受影響。
VALUE_EXPONENT_NAME=損耗降低價格
VALUE_EXPONENT_HELP=損耗物品失去價值的速度。設為1.5時，狀況一半的物品值原價35%。設為0則保持原價。
FIRE_RATE_FLOOR_NAME=狀況為0時的射速
FIRE_RATE_FLOOR_HELP=自動武器在狀況為0時仍保有多少射速。設為1時，損耗不會降低射速。
CRIT_METER_FLOOR_NAME=狀況為0時的爆擊
CRIT_METER_FLOOR_HELP=武器在狀況為0時保留多少爆擊，對你和其他角色都適用。設為1時，損耗不會減少爆擊。
ACCURACY_FLOOR_NAME=狀況為0時的準度
ACCURACY_FLOOR_HELP=槍枝在狀況為0時保有多少準度。設為0.75時散布擴大三分之一，設為1時不會降低。
RANGE_FLOOR_NAME=狀況為0時的射程
RANGE_FLOOR_HELP=槍枝在狀況為0時維持傷害的距離比例。設為0時都像遠距離射擊，設為1時不縮短。
BENCH_COST_NAME=工作台修理成本
BENCH_COST_HELP=在工作台修理所需的元件數量。0.5會使花費減半，2則加倍，0則讓所有修理免費。
SPARE_WORTH_NAME=備品價值
SPARE_WORTH_HELP=一件備品能恢復多少狀況：0.5時等同拆解它所得，1為兩倍，2為四倍。拆解專家的等級也會提高它。
FREE_MEND_NAME=免費修補的狀況
FREE_MEND_HELP=狀況高於此值時，在工作台修補免費。設為100則取消，設為0則損壞物品以外皆可修補。
MOD_LOCK_NAME=改造鎖定的狀況
MOD_LOCK_HELP=低於此狀況時，無法在工作台改造物品。設為1時須為完好狀況，設為0則取消鎖定。
TRADER_PRICE_NAME=商人修理價格
TRADER_PRICE_HELP=商人修理所收取的瓶蓋數量。0.5會使價格減半，2則加倍。
RAW_FOOD_DAYS_NAME=生食物保存
RAW_FOOD_DAYS_HELP=生肉、蛋和作物的保存遊戲天數。2約為2.4小時的遊戲時間。
COOKED_FOOD_DAYS_NAME=熟食物保存
COOKED_FOOD_DAYS_HELP=熟食的保存遊戲天數。7約為8.4小時的遊戲時間。
FRIDGE_SPEED_NAME=冰箱內腐壞速度
FRIDGE_SPEED_HELP=食物在冰箱或冷藏箱中腐壞的速度。0.5為半速。
SPOILED_PER_FERTILIZER_NAME=每份肥料所需腐壞食物
SPOILED_PER_FERTILIZER_HELP=化學工作台製作1份肥料所需的腐壞食物數量。0會移除肥料選項。
SPOILED_HEALING_NAME=腐壞食物的治療
SPOILED_HEALING_HELP=腐壞的食物在生存模式外給予的治療與加成，以新鮮食物的%計。在生存模式中不給予任何治療與加成。
SPOILED_HUNGER_NAME=腐壞食物的飽足
SPOILED_HUNGER_HELP=腐壞的食物在生存模式中填補的飢餓與口渴，以新鮮食物的%計。生存模式至少填補其最小的一餐，即使為0。
SPOILED_RADS_NAME=腐壞食物的輻射
SPOILED_RADS_HELP=腐壞食物在其自身輻射之外額外增加的輻射。1為肉類15、其他食物5，2為兩倍，0則不增加。
SPOILED_SICKNESS_NAME=腐壞食物的疾病
SPOILED_SICKNESS_HELP=腐壞的食物在生存模式中讓你生病的機率，為新鮮食物機率的倍數。本身沒有機率的食物採用你載入順序中最小的機率。

[Page HUD and log]
HUD_BAR_X_NAME=武器狀況條距左緣
HUD_BAR_X_HELP=彈藥計數旁狀況條與文字的起點，從左緣算起，任何解析度皆同。
HUD_BAR_Y_NAME=武器狀況條距上緣
HUD_BAR_Y_HELP=彈藥計數旁狀況條與文字的起點，從上緣算起，任何解析度皆同。
HUD_BAR_DEFAULT=預設為{0}。
HUD_BAR_LENGTH_NAME=武器狀況條長度
HUD_BAR_LENGTH_HELP=彈藥計數旁狀況條的長度。1為正常，2為兩倍長。狀況文字的大小不變。
HUD_BAR_THICKNESS_NAME=武器狀況條粗細
HUD_BAR_THICKNESS_HELP=彈藥計數旁狀況條的粗細。1為正常，2為兩倍粗。狀況文字的大小不變。
HUD_BAR_HIDES_NAME=武器狀況條隨彈藥計數隱藏
HUD_BAR_HIDES_HELP=射擊後彈藥計數淡出時，狀況條也會隱藏。近戰武器仍會顯示。關閉時會保留。
HUD_BAR_ALONE_NAME=武器狀況條獨立顯示
HUD_BAR_ALONE_HELP=HUD模組隱藏彈藥計數時，狀況條仍留在距左緣與上緣的位置。關閉時會隨彈藥計數隱藏。
HUD_BAR_WORD_NAME=武器狀況條顯示文字
HUD_BAR_WORD_HELP=在彈藥計數旁的狀況條旁顯示狀況文字。關閉時只顯示狀況條。
POWER_ARMOR_BAR_X_NAME=動力裝甲狀況條左右位置
POWER_ARMOR_BAR_X_HELP=移動動力裝甲中的狀況條：大於0向右，小於0向左。超出螢幕邊緣時會隱藏。
POWER_ARMOR_BAR_Y_NAME=動力裝甲狀況條上下位置
POWER_ARMOR_BAR_Y_HELP=移動動力裝甲中的狀況條：大於0向上，小於0向下。超出螢幕邊緣時會隱藏。
POWER_ARMOR_BAR_LENGTH_NAME=動力裝甲狀況條長度
POWER_ARMOR_BAR_LENGTH_HELP=動力裝甲中狀況條的長度。1為正常，2為兩倍長。狀況文字的大小不變。
POWER_ARMOR_BAR_THICKNESS_NAME=動力裝甲狀況條粗細
POWER_ARMOR_BAR_THICKNESS_HELP=動力裝甲中狀況條的粗細。1為正常，2為兩倍粗。狀況文字的大小不變。
POWER_ARMOR_BAR_WORD_NAME=動力裝甲狀況條顯示文字
POWER_ARMOR_BAR_WORD_HELP=在動力裝甲的狀況條旁顯示狀況文字。關閉時只顯示狀況條。
PICKUP_BAR_NAME=拾取狀況條
PICKUP_BAR_HELP=注視散落的武器、護甲或食物時，在名稱下方顯示狀況條。食物的狀況條顯示新鮮度。關閉時，提示維持原版。
PICKUP_BAR_X_NAME=拾取狀況條左右位置
PICKUP_BAR_X_HELP=移動拾取提示中的狀況條：大於0向右，小於0向左。
PICKUP_BAR_Y_NAME=拾取狀況條上下位置
PICKUP_BAR_Y_HELP=移動拾取提示中的狀況條：大於0向上，小於0向下。
PICKUP_BAR_LENGTH_NAME=拾取狀況條長度
PICKUP_BAR_LENGTH_HELP=拾取提示中狀況條的長度。1為正常，2為兩倍長。狀況文字的大小不變。
PICKUP_BAR_THICKNESS_NAME=拾取狀況條粗細
PICKUP_BAR_THICKNESS_HELP=拾取提示中狀況條的粗細。1為正常，2為兩倍粗。狀況文字的大小不變。
PICKUP_BAR_WORD_NAME=拾取狀況條顯示文字
PICKUP_BAR_WORD_HELP=在拾取提示的狀況條旁顯示狀況文字。關閉時只顯示狀況條。
LOG_LEVEL_NAME=日誌詳細程度
LOG_LEVEL_HELP=NEC.log（位於Documents\My Games\Fallout4\F4SE）的詳細程度。回報錯誤時請選debug。
NEC_VERSION=Fallout 4 {1} 上的 NEC {0}

[Page notes]
PART_OFF={0}：已停用，交由{1}處理。
PART_SINCE={0}：已停用，因為「{1}」已交由{2}處理。
PART_OFF_NOW={0}：目前已停用，交由{1}處理。
PART_SINCE_NOW={0}：目前已停用，因為「{1}」已交由{2}處理。
PART_VERSION={0}：已停用，不支援此遊戲版本（{1}）。
PART_OLDGEN={0}：在此遊戲版本（{1}）停用。
OWNER_MOD=另一個模組
LIST_AND={0}和{1}
LIST_COMMA={0}、{1}
NO_EFFECT=目前沒有效果：{0}。
TOP_INTRO=其他模組接管了這裡列出的功能，因此NEC不會處理它們。
TOP_BY=交由{0}處理：{1}。
TOP_MOD=交由另一個模組處理：{0}。
TOP_VERSION=在此遊戲版本（{0}）停用：{1}。
TOP_MORE=另有{0}個模組，完整清單見NEC.log。
