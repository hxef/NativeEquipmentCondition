FRIDGE_SPEED_NAME=Vitesse d'avarie au frais
FRIDGE_SPEED_HELP=La vitesse à laquelle la nourriture s'avarie dans un réfrigérateur ou une glacière. 0.5 correspond à une vitesse réduite de moitié.
SPOILED_PER_FERTILIZER_NAME=Nourriture avariée par engrais
