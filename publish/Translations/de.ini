[Page switches]
; The switch at the top of NEC's main page that turns all of NEC on or off.
NEC_ON_NAME=Alle NEC-Funktionen
NEC_ON_HELP=Schaltet NEC beim Spielen ganz ein oder aus. Aus: die Vorgaben und NECs andere Seiten verschwinden, Waffen und Rüstungen behalten ihren Zustand.
PLAIN_APPAREL_NAME=Schlichte Kleidung nutzt sich nie ab
PLAIN_APPAREL_HELP=Kleidung ohne Rüstungswert oder Bonus nutzt sich nie ab und zeigt keinen Zustand. Aus: Sie nutzt sich ab wie Rüstung.
SPAWN_CONDITION_HELP=Gefundene Waffen und Rüstungen sind schon abgenutzt, je nach Herkunft und Vorbesitzer. Aus: Sie sind neu.
VENDOR_REPAIR_HELP=Händler für Waffen, Rüstungen oder Kleidung reparieren diese gegen Kronkorken. Aus: Händler reparieren nichts.
TRADER_SIGN_NAME=Reparaturanzeige beim Händler
TRADER_SIGN_HELP=Zeigt im Tauschmenü, wie weit ein Händler Waffen, Rüstungen und Kleidung repariert. Ausgeschaltet nennt es stattdessen seine Reparaturbox.
WORKBENCH_REPAIR_NAME=Reparaturen an der Werkbank
WORKBENCH_REPAIR_HELP=Werkbänke reparieren Waffen und Rüstungen. Sonst reparieren Händler weiter. Schalte auch Reparaturen am Pip-Boy ein, wie in Fallout 3 und New Vegas.
SPARE_REPAIR_NAME=Reparatur mit Ersatz
SPARE_REPAIR_HELP=Fügt der Reparaturbox ERSATZ VERWENDEN hinzu, hast du eine gleiche Waffe oder Rüstung dabei, mit beliebigen Mods. Spares only am Pip-Boy braucht es.
PIPBOY_REPAIR_NAME=Reparaturen am Pip-Boy
PIPBOY_REPAIR_HELP=Untersuche eine abgenutzte Waffe oder Rüstung im Pip-Boy und drücke REPAIR. Spares only verbraucht Ersatz, Workbench repariert wie an der Werkbank.
UNSCRAPPABLE_SPARES_NAME=Unverwertbarer Ersatz
UNSCRAPPABLE_SPARES_HELP=Ausrüstung, die SCRAP ablehnt, als Ersatz: keine, nur legendäre oder alle, auch Unikate wie der Kryolator aus dem Grundspiel.
KEEP_SPARE_MODS_NAME=Ersatz-Mods behalten
KEEP_SPARE_MODS_HELP=Off verbraucht einen Ersatz mit allen Mods. Die anderen geben die Mods zurück, die die Reparatur nicht braucht, oder du wählst sie aus einer Liste.
SPARE_MOD_ROWS_NAME=Zeilen der Ersatz-Mods
SPARE_MOD_ROWS_HELP=Change zeigt, was jede Mod in der Liste bringt oder kostet, etwa +3.7 % oder -4.2 %. Result zeigt den Zustand nach der Reparatur, etwa 64.2 %.
REPAIR_BOX_ROW_NAME=Reparaturbox öffnet auf
REPAIR_BOX_ROW_HELP=Beim Öffnen der Reparaturbox markierte Zeile. Ohne Ersatz wählt ERSATZ VERWENDEN die höchste Zustandsstufe der Reparatur.
REPAIR_COLUMNS_NAME=Reparaturzeilen in Spalten
REPAIR_COLUMNS_HELP=Ordnet die Zeilen der Reparaturboxen in Spalten an. Aus: Jede Zeile steht zentriert am Stück, wie im Grundspiel.
REPAIR_GAINS_NAME=Zugewinne in den Reparaturboxen
REPAIR_GAINS_HELP=Zeigt, was jede Reparatur zu Schaden oder Resistenzen des Gegenstands hinzufügt. Aus: Die Reparaturboxen lassen es weg.
REPAIR_LOCK_NAME=Reparatursperre
REPAIR_LOCK_HELP=Reparaturen mit Komponenten erfordern Skill-Ränge, den letzten Rang für jeden Gegenstand oder den höchsten, den seine Mods verlangen.
LOCK_SPARES_NAME=Ersatz auch sperren
LOCK_SPARES_HELP=Auch Ersatzstücke folgen der Reparatursperre und reparieren nur ab dem Zustand, den deine Skill-Ränge erlauben. Ein Händler repariert weiterhin.
LOADING_TIPS_HELP=Zeigt Tipps zu Abnutzung, Reparaturen, Beute und verderbendem Essen auf Ladebildschirmen. Aus: Keine Tipps.
HUD_CONDITION_NAME=Waffen-ZST
HUD_CONDITION_HELP=Zeigt den Zustand deiner Waffe an der Munitionsanzeige, als Balken oder in Prozent. Off zeigt keinen.
POWER_ARMOR_BAR_NAME=ZST am Powerrüstungs-Armaturenbrett
POWER_ARMOR_BAR_HELP=Zeigt den Zustand deiner Waffe am Armaturenbrett der Powerrüstung, als Balken oder in Prozent. Off zeigt keinen.
QUICK_CONTAINER_NAME=ZST in der Behälterliste
QUICK_CONTAINER_HELP=Zeigt den Zustand in den Zeilen der Behälterliste, die bei Behältern oder Leichen erscheint, als Balken oder in Prozent.
CARD_CND_NAME=ZST in Gegenstandsinfos
CARD_CND_HELP=Zeigt ZST in Gegenstandsinfos als gerahmten Balken oder in Prozent wie 87.4 %. Off lässt die Infos wie im Grundspiel, ohne ZST-Zeile.
CARD_WEAR_RATE_NAME=Abnutzungsrate in Gegenstandsinfos
CARD_WEAR_RATE_HELP=Zeigt neben ZST, wie schnell sich ein Gegenstand abnutzt oder verdirbt, x1.0 wie ein üblicher seiner Art. Wenn aus, nur ZST.
POWER_ARMOR_CND_NAME=Powerrüstungs-ZST in Gegenstandsinfos
POWER_ARMOR_CND_HELP=Zeigt die Gesundheit von Powerrüstungsteilen als ZST. Sonst ändert sich nichts. Wenn aus, wie im Grundspiel.
CND_DECIMALS_NAME=ZST-Nachkommastellen
CND_DECIMALS_HELP=Always zeigt 98.0 % und 97.5 %. Fractions only zeigt 98 % und 97.5 %. Off zeigt ganze Zahlen.
CND_COLUMN_NAME=ZST-Spalte in Listen von UI-Ersatzmods
CND_COLUMN_HELP=Gibt den Pip-Boy-, Handels-, Behälter- und Werkbanklisten deines UI-Ersatzmods eine ZST-Spalte. Wenn aus, bleiben sie unverändert.
CONFIRM_SCROLL_HELP=Grundspiel-Fix. Das Bestätigungsfenster der Werkbank wächst und scrollt. Aus: Es kann klein bleiben.
INSPECT_PRICE_HELP=Grundspiel-Fix. Beim Händler zeigt Untersuchen den richtigen Preis. Aus: Er kann falsch sein.
FOOD_SPOILS_HELP=Essen, das du oder ein Begleiter getragen hast, und Essen bei Toten verdirbt mit der Zeit. Aus: Essen hält sich.
FRIDGE_ICON_NAME=Kühlschrank-Symbol
FRIDGE_ICON_HELP=Zeigt ein Symbol am Namen des Kühlschranks und auf den Karten des Essens darin. Dort verdirbt Essen langsamer.
TRACE_LOGS_NAME=Protokolle für Fehlerberichte
TRACE_LOGS_HELP=Schreibt 5 Protokolle mehr neben NEC.log. Sie wachsen schnell, also nur für Fehlerberichte einschalten.

[Page wear]
WEAR_RATE_NAME=Abnutzungstempo von Waffen
WEAR_RATE_HELP=Wie schnell sich deine Waffen abnutzen. 1 ist normal, 2 doppelt so schnell, 0 stoppt die Abnutzung.
NPC_WEAR_RATE_NAME=Abnutzungstempo von NPC-Waffen
NPC_WEAR_RATE_HELP=Wie schnell sich NPC-Waffen abnutzen. 1 ist normal, 0.33 ein Drittel so schnell, 0 stoppt die Abnutzung.
AUTO_WEAR_RATE_NAME=Abnutzungstempo von Automatikwaffen
AUTO_WEAR_RATE_HELP=Multipliziert die Tempos oben beim Schießen oder Schneiden. 1 ist normal, 2 verdoppelt, 0 stoppt sie.
ARMOR_WEAR_RATE_NAME=Abnutzungstempo von Rüstungen
ARMOR_WEAR_RATE_HELP=Wie schnell sich deine Rüstung abnutzt. 1 ist normal, 2 doppelt so schnell, 0 stoppt die Abnutzung.
NPC_ARMOR_WEAR_RATE_NAME=Abnutzungstempo von NPC-Rüstungen
NPC_ARMOR_WEAR_RATE_HELP=Wie schnell sich NPC-Rüstungen abnutzen. 1 ist normal, 0.33 ein Drittel so schnell, 0 stoppt die Abnutzung.
COMPANION_WEAR_RATE_NAME=Abnutzungstempo der Waffen von Begleitern
COMPANION_WEAR_RATE_HELP=Abnutzungstempo der Waffen deiner Begleiter, zusätzlich zum NPC-Waffentempo. 1 ist normal, 0 stoppt die Abnutzung.
SETTLER_WEAR_RATE_NAME=Abnutzungstempo der Waffen von Siedlern
SETTLER_WEAR_RATE_HELP=Abnutzungstempo der Waffen deiner Siedler, zusätzlich zum NPC-Waffentempo. 1 ist normal, 0 stoppt die Abnutzung.
SUPPRESSED_WEAR_RATE_NAME=Abnutzungstempo von Waffen mit Schalldämpfer
SUPPRESSED_WEAR_RATE_HELP=Multipliziert die Tempos oben beim Schießen mit Schalldämpfer. 1 ist normal, 2 verdoppelt, 0.5 halbiert.
COMPANION_ARMOR_WEAR_RATE_NAME=Abnutzungstempo der Rüstungen von Begleitern
COMPANION_ARMOR_WEAR_RATE_HELP=Abnutzungstempo der Rüstungen deiner Begleiter, zusätzlich zum NPC-Rüstungstempo. 1 ist normal, 0 stoppt die Abnutzung.
SETTLER_ARMOR_WEAR_RATE_NAME=Abnutzungstempo der Rüstungen von Siedlern
SETTLER_ARMOR_WEAR_RATE_HELP=Abnutzungstempo der Rüstungen deiner Siedler, zusätzlich zum NPC-Rüstungstempo. 1 ist normal, 0 stoppt die Abnutzung.

[Page numbers]
DAMAGE_FLOOR_NAME=Schaden bei Zustand 0
DAMAGE_FLOOR_HELP=Wie viel Schaden eine Waffe bei Zustand 0 behält. Bei 1 senkt die Abnutzung ihn nie.
WEAPON_START_NAME=Waffenabzüge beginnen bei
WEAPON_START_HELP=Bei diesem Zustand beginnt Abnutzung, eine Waffe zu schwächen, und Zustandsbalken markieren ihn. Bei 0.5 wirkt sie bis zum halben Zustand wie neu.
ARMOR_FLOOR_NAME=Schutz bei Zustand 0
ARMOR_FLOOR_HELP=Wie viel Schutz eine Rüstung bei Zustand 0 behält. Bei 1 senkt die Abnutzung ihn nie.
ARMOR_START_NAME=Rüstungsabzüge beginnen bei
ARMOR_START_HELP=Bei diesem Zustand beginnt Abnutzung, den Schutz zu senken, und Zustandsbalken markieren ihn. Bei 0.5 bleibt er bis zum halben Zustand voll.
LOOT_SHIFT_NAME=Beutezustand verschieben
LOOT_SHIFT_HELP=Verschiebt jede Beute Richtung abgenutzt oder neu. Bei -100 ist alles maximal abgenutzt, bei 100 bestmöglich.
LOOT_SURPRISE_NAME=Überraschungsbeute 1 von
LOOT_SURPRISE_HELP=Überraschungsbeute bekommt einen zufälligen Zustand, egal wer sie trug. Je höher die Zahl, desto seltener ist sie. 0: keine Überraschungen.
LOOT_AREA_NAME=Lose Beute folgt dem Wert der Gegend
LOOT_AREA_HELP=Beute außerhalb von Behältern ist in gut ausgestatteten Gegenden in besserem Zustand, in armen in schlechterem. 0 schaltet es ab, 2 verdoppelt es.
VALUE_EXPONENT_NAME=Preisverfall bei Abnutzung
VALUE_EXPONENT_HELP=Wie schnell Abgenutztes an Wert verliert. Bei 1.5 ist halb Abgenutztes 35 % wert, bei 0 bleibt der Preis.
FIRE_RATE_FLOOR_NAME=Feuerrate bei Zustand 0
FIRE_RATE_FLOOR_HELP=Wie schnell eine automatische Waffe bei Zustand 0 noch feuert. Bei 1 bremst die Abnutzung sie nie.
CRIT_METER_FLOOR_NAME=Kritische Treffer bei Zustand 0
CRIT_METER_FLOOR_HELP=Kritische Treffer, die eine Waffe bei Zustand 0 behält, für deinen Balken und NPCs. Bei 1 bleiben alle.
ACCURACY_FLOOR_NAME=Präzision bei Zustand 0
ACCURACY_FLOOR_HELP=Präzision einer Schusswaffe bei Zustand 0. Bei 0.75 streut sie ein Drittel weiter, bei 1 wie neu.
RANGE_FLOOR_NAME=Reichweite bei Zustand 0
RANGE_FLOOR_HELP=Wie weit eine Schusswaffe bei Zustand 0 Schaden trägt. Bei 0 trifft sie wie aus der Ferne, bei 1 wie neu.
JAM_CHANCE_NAME=Ladehemmung bei Zustand 0
JAM_CHANCE_HELP=Wie oft eine Schusswaffe nahe Zustand 0 klemmt: bei 1 einmal pro Magazin, bei 0.5 jedes 2. Magazin. Bei 0 nie.
JAM_START_NAME=Ladehemmungen beginnen bei
JAM_START_HELP=Bei diesem Zustand fangen deine Schusswaffen an zu klemmen, erst selten, dann immer öfter. Sie klemmen bis zum Nachladen.
BENCH_COST_NAME=Reparaturkosten an der Werkbank
BENCH_COST_HELP=Komponenten je Werkbank-Reparatur zusätzlich zum Material. 0.5 halbiert sie, 2 verdoppelt sie, 0 macht jede Reparatur kostenlos.
PERK_COMPONENT_DISCOUNT_NAME=Skill-Rabatt auf Komponenten
PERK_COMPONENT_DISCOUNT_HELP=Die Reparatur-Komponenten, die du mit allen Rängen des Handwerks-Skills des Gegenstands sparst. Bei 50 sparen alle 4 Ränge 50 % und 2 Ränge 25 %.
SPARE_WORTH_NAME=Wert eines Ersatzes
SPARE_WORTH_HELP=Wie viel Zustand ein Ersatz zurückgibt: bei 0.5 so viel wie sein Verwerten, 1 doppelt, 2 vierfach. Wiederverwerter-Ränge erhöhen ihn.
FREE_MEND_NAME=Kostenlos ausbessern ab
FREE_MEND_HELP=Ab diesem Zustand laut ZST-Nachkommastellen ist AUSBESSERN an der Werkbank gratis. 100 schaltet es ab, 0 bessert alles aus.
MOD_LOCK_NAME=Werkbank-Modifikationen ab
MOD_LOCK_HELP=Ab diesem Zustand kann eine Werkbank einen Gegenstand modifizieren. Bei 100 muss er voll sein, bei 0 reicht jeder Zustand.
