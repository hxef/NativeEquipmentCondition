[Page switches]
; The switch at the top of NEC's main page that turns all of NEC on or off.
NEC_ON_NAME=Wszystkie funkcje NEC
NEC_ON_HELP=Włącza lub wyłącza cały NEC w trakcie gry. Wyłączone: presety i inne strony NEC znikają, a broń i pancerze zachowują swój stan.
PLAIN_APPAREL_NAME=Zwykła odzież nigdy się nie zużywa
PLAIN_APPAREL_HELP=Odzież bez wartości pancerza i premii nigdy się nie zużywa i nie pokazuje stanu. Wyłączone: zużywa się jak pancerz.
SPAWN_CONDITION_HELP=Znaleziona broń i pancerze są już zużyte, zależnie od pochodzenia i poprzedniego właściciela. Wyłączone: są nowe.
VENDOR_REPAIR_HELP=Handlarze bronią, pancerzami lub ubraniami naprawiają twoje rzeczy za kapsle. Wyłączone: handlarze nic nie naprawiają.
TRADER_SIGN_NAME=Tabliczka napraw handlarza
TRADER_SIGN_HELP=Pokazuje na ekranie handlu, do jakiego stanu handlarz naprawia broń, pancerze i ubrania. Po wyłączeniu podaje to jego okno naprawy.
WORKBENCH_REPAIR_NAME=Naprawy w pracowni
WORKBENCH_REPAIR_HELP=Pracownie naprawiają zużytą broń i pancerze. Bez nich nadal naprawiają handlarze. Włącz też Naprawy w Pip-Boyu, by było jak w Fallout 3 i New Vegas.
SPARE_REPAIR_NAME=Naprawa zapasowym
SPARE_REPAIR_HELP=Dodaje UŻYJ ZAPASOWEGO do okna naprawy, gdy nosisz drugą taką samą broń lub pancerz, z dowolnymi modami. Wymaga go Spares only w Pip-Boyu.
PIPBOY_REPAIR_NAME=Naprawy w Pip-Boyu
PIPBOY_REPAIR_HELP=Zbadaj zużytą broń lub pancerz w Pip-Boyu i naciśnij NAPRAW. Spares only zużywa zapasowy, Workbench naprawia jak w pracowni.
UNSCRAPPABLE_SPARES_NAME=Zapasowe nie do przetworzenia
UNSCRAPPABLE_SPARES_HELP=Sprzęt, którego PRZETWÓRZ nie przyjmuje, jako zapasowy: nic, tylko legendarny albo wszystko, z unikatami jak Kriolator z oryginału.
KEEP_SPARE_MODS_NAME=Zachowaj mody zapasowego
KEEP_SPARE_MODS_HELP=Off zużywa zapasowy ze wszystkimi modami. Pozostałe oddają mody zbędne do naprawy albo pozwalają wybrać je z listy.
SPARE_MOD_ROWS_NAME=Wiersze modów zapasowego
SPARE_MOD_ROWS_HELP=Change pokazuje, ile każdy mod z listy dodaje lub kosztuje, np. +3.7% lub -4.2%. Result pokazuje stan po naprawie, np. 64.2%.
REPAIR_BOX_ROW_NAME=Okno naprawy otwiera się na
REPAIR_BOX_ROW_HELP=Wiersz podświetlony po otwarciu okna naprawy. Bez zapasowego UŻYJ ZAPASOWEGO wybiera najwyższy poziom stanu naprawy.
REPAIR_COLUMNS_NAME=Wiersze naprawy w kolumnach
REPAIR_COLUMNS_HELP=Układa wiersze okien naprawy w kolumnach. Wyłączone: każdy wiersz to jedna wyśrodkowana linia, jak w oryginale.
REPAIR_GAINS_NAME=Zyski w oknach naprawy
REPAIR_GAINS_HELP=Pokazuje, co każda naprawa dodaje do obrażeń lub odporności przedmiotu. Wyłączone: okna naprawy to pomijają.
REPAIR_LOCK_NAME=Blokada napraw
REPAIR_LOCK_HELP=Naprawy za komponenty wymagają rang profitów rzemieślniczych, ostatniej dla każdego przedmiotu lub najwyższej, której żądają jego modyfikacje.
LOCK_SPARES_NAME=Blokuj też zapasowe
LOCK_SPARES_HELP=Zapasowe sztuki też podlegają Blokadzie napraw i naprawiają tylko od stanu, na jaki pozwalają twoje rangi profitów. Handlarz nadal naprawia.
LOADING_TIPS_HELP=Dodaje porady o zużyciu, naprawach, łupach i psuciu się żywności na ekranach wczytywania. Wyłączone: nie pojawiają się.
HUD_CONDITION_NAME=STN broni
HUD_CONDITION_HELP=Pokazuje stan twojej broni przy amunicji, jako pasek lub w procentach. Off nic nie pokazuje.
POWER_ARMOR_BAR_NAME=STN na desce pancerza wspomaganego
POWER_ARMOR_BAR_HELP=Pokazuje stan twojej broni na desce rozdzielczej pancerza wspomaganego, jako pasek lub w procentach. Off nic nie pokazuje.
QUICK_CONTAINER_NAME=STN w podglądzie pojemnika
QUICK_CONTAINER_HELP=Pokazuje stan w wierszach podglądu pojemnika lub ciała, na które patrzysz, jako pasek lub w procentach.
CARD_CND_NAME=STN na kartach
CARD_CND_HELP=Pokazuje STN na kartach przedmiotów jako pasek w ramce lub w procentach, np. 87.4%. Off zostawia karty jak w oryginale, bez wiersza STN.
CARD_WEAR_RATE_NAME=Szybkość zużycia na kartach
CARD_WEAR_RATE_HELP=Pokazuje przy STN, jak szybko przedmiot się zużywa lub psuje, x1.0 dla zwykłego tego rodzaju. Po wyłączeniu tylko STN.
POWER_ARMOR_CND_NAME=STN pancerza wspomaganego na kartach
POWER_ARMOR_CND_HELP=Pokazuje Stan części pancerza wspomaganego jako STN. Nic więcej się nie zmienia. Po wyłączeniu jak w oryginale.
CND_DECIMALS_NAME=Miejsca dziesiętne STN
CND_DECIMALS_HELP=Always pokazuje 98.0% i 97.5%. Fractions only pokazuje 98% i 97.5%. Off pokazuje liczby całkowite.
CND_COLUMN_NAME=Kolumna STN w listach modów interfejsu
CND_COLUMN_HELP=Dodaje kolumnę STN do list Pip-Boya, handlu, pojemników i pracowni w twoim modzie interfejsu. Po wyłączeniu listy się nie zmieniają.
CONFIRM_SCROLL_HELP=Poprawka błędu gry. Potwierdzenie w pracowni jest większe i przewija listy. Wyłączone: bywa małe.
INSPECT_PRICE_HELP=Poprawka błędu gry. Badanie u handlarza pokazuje właściwą cenę. Wyłączone: bywa błędna.
FOOD_SPOILS_HELP=Żywność, którą nosiłeś ty lub towarzysz, oraz żywność przy zmarłych psuje się z czasem. Wyłączone: żywność się nie psuje.
FRIDGE_ICON_NAME=Ikona lodówki
FRIDGE_ICON_HELP=Pokazuje ikonę przy nazwie lodówki i na kartach żywności w środku. Żywność psuje się tam wolniej.
TRACE_LOGS_NAME=Dzienniki do zgłoszeń błędów
TRACE_LOGS_HELP=Zapisuje 5 dodatkowych dzienników obok NEC.log. Szybko rosną, więc włączaj tylko przy zgłaszaniu błędu.

[Page wear]
WEAR_RATE_NAME=Szybkość zużycia broni
WEAR_RATE_HELP=Jak szybko zużywa się twoja broń. 1 to normalnie, 2 to 2 razy szybciej, a 0 wyłącza zużycie.
NPC_WEAR_RATE_NAME=Szybkość zużycia broni NPC
NPC_WEAR_RATE_HELP=Jak szybko zużywa się broń NPC. 1 to normalnie, 0.33 to 3 razy wolniej, a 0 wyłącza zużycie.
AUTO_WEAR_RATE_NAME=Szybkość zużycia broni automatycznej
AUTO_WEAR_RATE_HELP=Mnoży szybkości powyżej przy strzelaniu lub cięciu. 1 to normalnie, 2 podwaja, a 0 wyłącza zużycie.
ARMOR_WEAR_RATE_NAME=Szybkość zużycia pancerzy
ARMOR_WEAR_RATE_HELP=Jak szybko zużywa się twój pancerz. 1 to normalnie, 2 to 2 razy szybciej, a 0 wyłącza zużycie.
NPC_ARMOR_WEAR_RATE_NAME=Szybkość zużycia pancerzy NPC
NPC_ARMOR_WEAR_RATE_HELP=Jak szybko zużywają się pancerze NPC. 1 to normalnie, 0.33 to 3 razy wolniej, a 0 wyłącza zużycie.
COMPANION_WEAR_RATE_NAME=Szybkość zużycia broni towarzyszy
COMPANION_WEAR_RATE_HELP=Jak szybko zużywa się broń twoich towarzyszy, ponad szybkość broni NPC. 1 to normalnie, a 0 wyłącza zużycie.
SETTLER_WEAR_RATE_NAME=Szybkość zużycia broni osadników
SETTLER_WEAR_RATE_HELP=Jak szybko zużywa się broń twoich osadników, ponad szybkość broni NPC. 1 to normalnie, a 0 wyłącza zużycie.
SUPPRESSED_WEAR_RATE_NAME=Szybkość zużycia broni z tłumikiem
SUPPRESSED_WEAR_RATE_HELP=Mnoży szybkości powyżej przy strzelaniu z tłumikiem. 1 to normalnie, 2 podwaja, a 0.5 to połowa.
COMPANION_ARMOR_WEAR_RATE_NAME=Szybkość zużycia pancerzy towarzyszy
COMPANION_ARMOR_WEAR_RATE_HELP=Jak szybko zużywają się pancerze twoich towarzyszy, ponad szybkość pancerzy NPC. 1 to normalnie, a 0 wyłącza zużycie.
SETTLER_ARMOR_WEAR_RATE_NAME=Szybkość zużycia pancerzy osadników
SETTLER_ARMOR_WEAR_RATE_HELP=Jak szybko zużywają się pancerze twoich osadników, ponad szybkość pancerzy NPC. 1 to normalnie, a 0 wyłącza zużycie.

[Page numbers]
DAMAGE_FLOOR_NAME=Obrażenia przy stanie 0
DAMAGE_FLOOR_HELP=Ile obrażeń zachowuje broń w stanie 0. Przy 1 zużycie nigdy ich nie obniża.
WEAPON_START_NAME=Początek kar dla broni
WEAPON_START_HELP=Przy tym stanie zużycie zaczyna osłabiać broń, a paski stanu go zaznaczają. Przy 0.5 broń działa jak nowa aż do połowy stanu.
ARMOR_FLOOR_NAME=Ochrona przy stanie 0
ARMOR_FLOOR_HELP=Ile ochrony zachowuje pancerz w stanie 0. Przy 1 zużycie nigdy jej nie obniża.
ARMOR_START_NAME=Początek kar dla pancerza
ARMOR_START_HELP=Przy tym stanie zużycie zaczyna obniżać ochronę pancerza, a paski stanu go zaznaczają. Przy 0.5 pancerz chroni jak nowy aż do połowy stanu.
LOOT_SHIFT_NAME=Przesunięcie stanu łupów
LOOT_SHIFT_HELP=Przesuwa każdy łup w stronę zużytego lub nowego. Przy -100 wszystko jest maksymalnie zużyte, przy 100 jak nowe.
LOOT_SURPRISE_NAME=Łupy z niespodzianką 1 na
LOOT_SURPRISE_HELP=Łup z niespodzianką dostaje losowy stan, niezależnie od tego, kto go nosił. Im wyższa liczba, tym rzadsze niespodzianki. Przy 0 brak niespodzianek.
LOOT_AREA_NAME=Luźne łupy według wartości okolicy
LOOT_AREA_HELP=Łupy poza pojemnikami są w lepszym stanie w dobrze zaopatrzonych okolicach, a w gorszym w biednych. 0 to wyłącza, a 2 podwaja.
VALUE_EXPONENT_NAME=Spadek ceny przy zużyciu
VALUE_EXPONENT_HELP=Jak szybko zużyte przedmioty tracą wartość. Przy 1.5 zużyte w połowie są warte 35%. 0 zachowuje cenę.
FIRE_RATE_FLOOR_NAME=Szybkostrzelność przy stanie 0
FIRE_RATE_FLOOR_HELP=Jak szybko broń automatyczna strzela jeszcze w stanie 0. Przy 1 zużycie nigdy jej nie spowalnia.
CRIT_METER_FLOOR_NAME=Trafienia krytyczne przy stanie 0
CRIT_METER_FLOOR_HELP=Ile trafień krytycznych zachowuje broń w stanie 0, u ciebie i u NPC. Przy 1 zużycie ich nie obniża.
ACCURACY_FLOOR_NAME=Celność przy stanie 0
ACCURACY_FLOOR_HELP=Celność broni palnej w stanie 0. Przy 0.75 rozrzut rośnie o jedną trzecią. Przy 1 zużycie jej nie obniża.
RANGE_FLOOR_NAME=Zasięg przy stanie 0
