; NEC trader list, an example that changes nothing as it is. Copy it
; under another name, such as MyTraders.ini, and remove the ; from the
; lines you want.
;
; A line sets how far 1 trader repairs 1 kind of gear:
;
;   Plugin|ID = kind level
;
; kind   weapons, armor or clothing.
;
; level  30 to 100 in steps of 10: they repair that kind up to it.
;        none: they do not repair that kind.
;        measured: NEC works it out from their stock, as it does for
;        a kind with no line. It exempts 1 trader from a line for
;        their whole faction.
;
; ID     Any of these 3, and the first in this order wins:
;        1. the trader's ref ID (the console shows it when you click
;           them)
;        2. their base ID (their NPC record in FO4Edit)
;        3. the form ID of the faction they trade under, which covers
;           a whole caravan or every settlement store of a kind
;
; The fastest way to get a ref ID is to click the trader in the
; console. To get all 3, switch on Bug report logs in NEC's MCM, open
; the trader's barter screen and copy them from NEC.ui.trace.log
; (Documents\My Games\Fallout4\F4SE\NEC). It lists the ref ID as
; placed and the base ID as NPC.
;
;Fallout4.esm|002CB9 = armor none        ; Arturo Rodriguez repairs no armor
;Fallout4.esm|1679CE = armor 90          ; Lucas Miller's caravan, armor to 90%
;Fallout4.esm|10C03F = weapons 50        ; every settlement weapon store, to 50%
;MyTraderMod.esp|000801 = clothing 100   ; a mod's trader, by base ID
;
; Good to know:
; * The first 2 digits of an ID never count, and for a light plugin
;   (.esl) only the last 3 do.
; * A ref ID that starts with FF belongs to an NPC the game created
;   during play, such as a spawned settler. NEC skips such a line,
;   because that ID is stored in the save (in another save, or after
;   that NPC is removed, it can point to a different NPC). Name their
;   base ID or faction instead.
; * When 2 lines set the same kind for the same ID, the first in file
;   name order counts.
; * NEC.log lists what each file sets and any line it skips.
