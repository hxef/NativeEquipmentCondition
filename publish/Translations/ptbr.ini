SPAWN_CONDITION_HELP=Armas e armaduras encontradas já vêm desgastadas, conforme quem as tinha. Desativado: vêm novas.
VENDOR_REPAIR_HELP=Comerciantes de armas, armaduras ou roupas consertam as suas por tampas. Desativado: só bancadas.
LOADING_TIPS_HELP=Adiciona dicas sobre desgaste, consertos e saque às telas de carregamento. Desativado: nenhuma aparece.
HUD_CONDITION_HELP=Mostra barras de condição junto à munição e na Armadura Potente. Desativado: só nas fichas dos itens.
QUICK_CONTAINER_HELP=Mostra a condição na lista que surge ao olhar para um contêiner ou corpo. Desativado: não a mostra.
CONFIRM_SCROLL_HELP=Correção do jogo base. A confirmação da bancada cresce e rola. Desativado: pode ficar pequena.
INSPECT_PRICE_HELP=Correção do jogo base. Ao negociar, Inspecionar mostra o preço certo. Desativado: pode errar.
TRACE_LOGS_NAME=Registros para relatar bugs
TRACE_LOGS_HELP=Grava mais 3 registros ao lado do NEC.log. Crescem rápido, então só ative para relatar um bug.

[Page wear]
