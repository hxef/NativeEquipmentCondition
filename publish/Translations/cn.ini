UI_RESET_HELP=確認後，將本頁每項設定恢復為預設值。
UI_RESET_BODY=將UI頁面的每項設定恢復為預設值？
PRESET_DELETE_NAME=刪除方案
PRESET_DELETE_HELP=確認後刪除你自己的方案及其檔案，並選擇預設。
PRESET_DELETE_BODY=要刪除{0}嗎？其檔案將被移除且無法復原，並會選擇預設。
PRESET_DELETE_FAILED=無法刪除{0}，因此保留。NEC.log會說明原因。
PRESET_SAVE_NO_NAME=未儲存任何內容。方案名稱需要文字或數字。
PRESET_SAVE_FAILED=無法儲存{0}，因此未建立方案。NEC.log會說明原因。
PRESET_SAVE_NAME=另存為新方案
