; Native Equipment Condition, English texts.
; NEC.dll holds this same English and falls back to it line by line.
;
; To translate: copy this file to <code>.ini in this folder, where <code> is
; sLanguage in Fallout4.ini (en, fr, de, it, es, esmx, ptbr, pl, ru, ja, cn, or
; a fan translation's code).
; Change only the text right of each =. Keep the {0} {1} {2} each line has, in
; any order, and add no other.
; A name has no comma, since the MCM page puts names in lists.
; Save as UTF-8, or as Unicode (UTF-16 LE) in Notepad.
; A line left empty, missing or broken shows in English. NEC.log says why for a
; broken one, and lists the missing ones with Log detail at debug.
; NEC reads this file once per game start, so restart to see an edit.
; Sections are headings only, except [Layout].

[Layout]
; Letters that fit 1 line of a grey row on NEC's MCM page, and lines a row
; may take. Remove the ; to use a line. Only for a language the page cuts
; wrong. English is 62 and 17, Russian 54 and 17, Japanese 27 and 20, Chinese
; 26 and 20. A translation kept as en.ini needs these 2 lines for a language
; wider than English. LineWidth goes from 10 to 100 and RowLines from 5 to 20.
;LineWidth=62
;RowLines=17

[Repair]
; The question both repair menus ask, and what the bench says around it: the
; perk over the question, the floor for modding, MEND for a free fix, an item
; it has nothing to rebuild from and an item no mod fits. A trader's own words
; are under [Trader].

REPAIR_QUESTION={0} is at {1}% condition. Repair it to:

; Said over the repair question when the player holds a rank of the perk
; pricing the item. It names the rank, so the player sees their own rank at
; work, and it counts components, since a bench takes nothing else.
REPAIR_DISCOUNT={0} {1} reduces the components required for this repair by {2}%.

; A floor at full says so in words, since "at least 100%" reads oddly.
TOO_DAMAGED_FULL=Condition must be full to modify.
TOO_DAMAGED=Condition must be at least {0}% to modify.

; The word on the bench's REPAIR button over an item worn so little that
; repairing it is free. Capitals, like the game's own buttons.
MEND_BUTTON=MEND

; Said when MEND repairs an item, with no confirmation box and no components
; to show for it. Mended, not repaired, since nothing was spent. 1 line per
; kind, since the kind is the subject.
MENDED_WEAPON=Weapon mended.
MENDED_ARMOR=Armor mended.

; Said when REPAIR is pressed on an item the bench has nothing to rebuild
; from. It says where to go instead, since the button stays on the bar.
BENCH_CANNOT_REPAIR=This item can't be repaired at a workbench. A trader can restore it.

; Said at the bench for an item listed only to be repaired, which stays greyed
; at full condition.
CANNOT_MODIFY=This item can't be modified.

[Trader]
; What a trader says about a repair: the line over the question, the buttons,
; why a press is refused and what is said once the caps have changed hands.

; The price in caps goes on the button beside the condition it buys, so
; picking a button pays at once. The bench shows its components in the game's
; own confirmation box instead.
REPAIR_PRICE={0}% for {1} caps

; Said once the caps have changed hands.
REPAIR_PAID=Repaired to {0}% for {1} caps.

; Said over a trader's question, so the player sees why the buttons stop where
; they do and that the limit is for this kind alone, since the same trader may
; repair another kind further. A trader who can go all the way says so in
; words, since "up to 100%" reads as a limit. 1 line per kind, since the
; kind sits inside the sentence and some languages change its ending to fit
; the verb: Polish names armor pancerzom in REPAIR_UP_TO_FULL_ARMOR, pancerze
; in REPAIR_UP_TO_ARMOR and pancerzy in REPAIR_CEILING_ARMOR.
REPAIR_UP_TO_FULL_WEAPONS=This trader can restore weapons to full condition.
REPAIR_UP_TO_FULL_ARMOR=This trader can restore armor to full condition.
REPAIR_UP_TO_FULL_CLOTHING=This trader can restore clothing to full condition.
REPAIR_UP_TO_WEAPONS=This trader can repair weapons up to {0}% condition.
REPAIR_UP_TO_ARMOR=This trader can repair armor up to {0}% condition.
REPAIR_UP_TO_CLOTHING=This trader can repair clothing up to {0}% condition.

; Said when REPAIR is pressed on an item already past what this trader can do
; for its kind. The button stays on the bar, so the player learns that better
; traders exist.
REPAIR_CEILING_WEAPONS=This trader can't repair weapons past {0}%.
REPAIR_CEILING_ARMOR=This trader can't repair armor past {0}%.
REPAIR_CEILING_CLOTHING=This trader can't repair clothing past {0}%.

; Said when REPAIR is pressed and the player cannot pay for the smallest step.
; The button is greyed already, this says why.
REPAIR_UNAFFORDABLE=Not enough caps to repair.

; Said when REPAIR is pressed while a trade is pending. The verbs are the
; game's own for accepting and resetting a trade, and the trade is the one its
; "$CancelTradeInProgress" names.
REPAIR_TRADE_PENDING=Accept or reset the trade before repairing.

[Tips]
; The tips the loading screen shows now and then. Each is a fact about play
; told in the game's own voice, as if condition had always been part of it,
; and names the benches, caps, raiders and Gunners as the vanilla loading
; screens do in each language. Japanese ends without 。, as the game's own
; screens do, and French puts a no-break space before ? as they do.

; What wear does.
TIP_WEAR=Weapons and armor lose condition as they are used. A worn weapon deals less damage, worn armor offers less protection, and both are worth fewer caps.

; Repairing at a workbench, and the floor for modding.
TIP_BENCH=Use a Weapons Workbench or an Armor Workbench to repair worn gear with the components it's made from. Gear must be in full condition before it can be modified.

; Repairing at a trader. It names the shops, since a general store with a
; pistol on the shelf repairs nothing.
TIP_TRADER=Short on components? Gun shops, armorers and clothiers will repair their own kind of gear for caps. The better stocked the shop, the closer to new they can bring it.

; What an item at 0 does.
TIP_BROKEN=A weapon that breaks is put away. Broken armor stays on, bonuses and all, until you take it off. Either way, broken gear can't be equipped again until it's repaired.

; Jams.
TIP_JAM=Guns below half condition can jam, forcing a reload at the worst possible moment. Keep the weapons you rely on in good repair.

; The condition loot spawns at. The factions are the vanilla creature
; screens' own words.
TIP_LOOT=Loot rarely turns up in mint condition. Raiders are hard on their gear, while well equipped factions like the Gunners look after theirs.

[Messages]
; The perk page, the corner of the screen, and the section titles of the MCM
; page.

; Said in the corner when a piece the player wears reaches 0. Each language
; puts it so the name needs no gender.
ARMOR_WORN_OUT={0} is worn out.

; Added to every rank of a crafting perk that takes something off a repair,
; with what that rank alone is worth, so the perk page shows what the next
; rank gives. It says items built mostly from the perk's mods because 1 perk
; prices the whole repair. 1 line per subject, weapons, armor or both, since
; the verb and the adjectives follow the subject in most languages.
PERK_DISCOUNT_WEAPONS=Weapons built mostly from this perk's mods take {0}% fewer components to repair at the workbench.
PERK_DISCOUNT_ARMOR=Armor built mostly from this perk's mods takes {0}% fewer components to repair at the workbench.
PERK_DISCOUNT_BOTH=Weapons and armor built mostly from this perk's mods take {0}% fewer components to repair at the workbench.
WEAR_TITLE=Wear
WEAPONS_TITLE=Weapons
LOOT_TITLE=Loot and prices
REPAIRS_TITLE=Repairs
HUD_TITLE=HUD
EXTRAS_TITLE=Little extras
LOG_TITLE=Log

[Page switches]
; The help lines of the switches on the MCM page, and the name and help of the
; bug report logs switch. A switch takes its name from its part under [Part
; names play], [Part names loot] or [Part names menus]. A help line says what
; the switch does and what off leaves, in 1 short line.

JAM_HELP=Your guns below half condition can jam until you reload. When off, they never jam.
SPAWN_CONDITION_HELP=Weapons and armor you find are already worn, based on who had them. When off, they turn up new.
VENDOR_REPAIR_HELP=Traders who sell weapons, armor or clothing repair yours for caps. When off, only workbenches repair.
LOADING_TIPS_HELP=Adds tips about wear, repairs and loot to the loading screens. When off, none of them show.
HUD_CONDITION_HELP=Shows condition bars by the ammo counter and in power armor. When off, item cards still show condition.
QUICK_CONTAINER_HELP=Shows condition in the list that pops up when you look at a container or body. When off, it shows none.

; "Base game fix" reads the same in both fixes.
CONFIRM_SCROLL_HELP=Base game fix. The workbench confirm box shows more of a long list and scrolls. When off, it can stay small.
INSPECT_PRICE_HELP=Base game fix. At a trader, inspecting an item shows the right buy or sell price. When off, it can be wrong.
TRACE_LOGS_NAME=Bug report logs
TRACE_LOGS_HELP=Writes 3 more logs next to NEC.log for bug reports. They grow fast, so leave this off unless you report a bug.

[Page wear]
; The names and help lines of the wear speeds, the first Balance numbers on
; the MCM page. Each NPC line follows the player's, and the automatic weapon
; line follows both weapon lines.

WEAR_RATE_NAME=Weapon wear speed
WEAR_RATE_HELP=How fast your weapons wear. 1 is normal, 2 is twice as fast and 0 stops wear.
NPC_WEAR_RATE_NAME=NPC weapon wear speed
NPC_WEAR_RATE_HELP=How fast NPC weapons wear. 1 is normal, 0.33 is a third as fast and 0 stops wear.
AUTO_WEAR_RATE_NAME=Automatic weapon wear speed
AUTO_WEAR_RATE_HELP=Multiplies the speeds above as automatic weapons fire or cut. 1 is normal, 2 is double, 0 stops wear.
ARMOR_WEAR_RATE_NAME=Armor wear speed
ARMOR_WEAR_RATE_HELP=How fast your armor wears. 1 is normal, 2 is twice as fast and 0 stops wear.
NPC_ARMOR_WEAR_RATE_NAME=NPC armor wear speed
NPC_ARMOR_WEAR_RATE_HELP=How fast NPC armor wears. 1 is normal, 0.33 is a third as fast and 0 stops wear.

[Page numbers]
; The names and help lines of the other Balance numbers on the MCM page. A
; help line says what the number does, with a value or 2 to picture it.

DAMAGE_FLOOR_NAME=Damage at 0 condition
DAMAGE_FLOOR_HELP=How much damage a weapon keeps at 0 condition. At 1, wear never lowers it.
WEAPON_START_NAME=Weapon penalties below
WEAPON_START_HELP=Below this condition, wear lowers weapon stats. At 0.5, a weapon works as new down to half condition.
ARMOR_FLOOR_NAME=Protection at 0 condition
ARMOR_FLOOR_HELP=How much protection armor keeps at 0 condition. At 1, wear never lowers it.
ARMOR_START_NAME=Armor penalties below
ARMOR_START_HELP=Below this condition, wear lowers armor protection. At 0.5, armor protects as new down to half condition.
VALUE_EXPONENT_NAME=Price drop when worn

; 35% is what half condition sells for at 1.5, of the full price.
VALUE_EXPONENT_HELP=How fast worn items lose value. At 1.5, an item at half condition is worth 35%. 0 keeps the full price.
FIRE_RATE_FLOOR_NAME=Fire rate at 0 condition
FIRE_RATE_FLOOR_HELP=How fast an automatic weapon still fires at 0 condition. At 1, wear never slows it.
CRIT_METER_FLOOR_NAME=Criticals at 0 condition
CRIT_METER_FLOOR_HELP=How many criticals a weapon keeps at 0 condition, for your meter and NPCs. At 1, wear never lowers them.
ACCURACY_FLOOR_NAME=Accuracy at 0 condition
ACCURACY_FLOOR_HELP=How accurate a gun still is at 0 condition. At 0.75, its shots spread a third wider. At 1, wear never lowers it.
RANGE_FLOOR_NAME=Range at 0 condition
RANGE_FLOOR_HELP=How far a gun keeps its damage at 0 condition. At 0, it hits as if from afar. At 1, wear never shortens it.
BENCH_COST_NAME=Workbench repair cost
BENCH_COST_HELP=How many components a workbench repair takes. 0.5 halves the cost, 2 doubles it, 0 makes it free.
FREE_MEND_NAME=Free mend above

; MEND is the bench's button for a free repair, in the words of MEND_BUTTON.
FREE_MEND_HELP=Above this condition, MEND at a workbench is free. 100 turns it off, 0 mends all but broken items.
TRADER_PRICE_NAME=Trader repair price
TRADER_PRICE_HELP=How many caps a trader asks for a repair. 0.5 halves the price and 2 doubles it.

[Page HUD and log]
