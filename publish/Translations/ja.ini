CARD_WEAR_RATE_NAME=アイテム情報の消耗速度
CARD_WEAR_RATE_HELP=CNDの横にアイテムの消耗や腐敗の速さを表示します。同種の普通のアイテムがx1.0です。OFFならCNDのみ表示します
POWER_ARMOR_CND_NAME=アイテム情報のパワーアーマーCND
POWER_ARMOR_CND_HELP=パワーアーマーのHealthをCNDで表示します。他は変わりません。OFFならバニラのHealthを表示します
CND_DECIMALS_NAME=CNDの小数
