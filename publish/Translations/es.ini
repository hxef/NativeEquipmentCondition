ARMOR_START_HELP=Bajo este estado, el desgaste debilita la armadura. Con 0.5, es como nueva hasta la mitad de su estado.
VALUE_EXPONENT_NAME=Pérdida de valor por desgaste
VALUE_EXPONENT_HELP=Lo rápido que se deprecia lo desgastado. Con 1.5, a mitad de estado vale el 35%. 0 mantiene el precio.
FIRE_RATE_FLOOR_NAME=Cadencia de tiro con estado 0
FIRE_RATE_FLOOR_HELP=Lo rápido que sigue disparando un arma automática con estado 0. Con 1, el desgaste nunca la frena.
CRIT_METER_FLOOR_NAME=Críticos con estado 0
CRIT_METER_FLOOR_HELP=Cuántos críticos conserva un arma con estado 0, para ti y los demás. Con 1, el desgaste no los reduce.
ACCURACY_FLOOR_NAME=Precisión con estado 0
ACCURACY_FLOOR_HELP=Precisión de un arma de fuego con estado 0. Con 0.75, se dispersa un tercio más. Con 1, no baja.
RANGE_FLOOR_NAME=Alcance con estado 0
RANGE_FLOOR_HELP=Alcance del daño de un arma de fuego con estado 0. Con 0, golpea como desde lejos. Con 1, no baja.
BENCH_COST_NAME=Coste de reparación en el banco de trabajo
BENCH_COST_HELP=Componentes por reparación en el banco. 0.5 reduce el coste a la mitad, 2 lo duplica y 0 la hace gratis.
FREE_MEND_NAME=Retoque gratis por encima de
FREE_MEND_HELP=Sobre este estado, RETOCAR en el banco es gratis. 100 lo desactiva y 0 retoca todo salvo lo roto.
TRADER_PRICE_NAME=Precio de reparación de comerciantes
TRADER_PRICE_HELP=Cuántas chapas pide un comerciante por una reparación. 0.5 reduce el precio a la mitad y 2 lo duplica.

