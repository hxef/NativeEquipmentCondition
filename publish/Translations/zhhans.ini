PERK_DISCOUNT_WEAPONS=主要由此辅助能力的改造配件组成的武器，在工作台修理时所需的元件减少{0}%。
PERK_DISCOUNT_ARMOR=主要由此辅助能力的改造配件组成的装甲，在工作台修理时所需的元件减少{0}%。
PERK_DISCOUNT_BOTH=主要由此辅助能力的改造配件组成的武器和装甲，在工作台修理时所需的元件减少{0}%。
