CRIT_METER_FLOOR_NAME=Kritische Treffer bei Zustand 0
CRIT_METER_FLOOR_HELP=Kritische Treffer, die eine Waffe bei Zustand 0 behält, für deinen Balken und NPCs. Bei 1 bleiben alle.
ACCURACY_FLOOR_NAME=Präzision bei Zustand 0
ACCURACY_FLOOR_HELP=Präzision einer Schusswaffe bei Zustand 0. Bei 0.75 streut sie ein Drittel weiter, bei 1 wie neu.
RANGE_FLOOR_NAME=Reichweite bei Zustand 0
RANGE_FLOOR_HELP=Wie weit eine Schusswaffe bei Zustand 0 Schaden trägt. Bei 0 trifft sie wie aus der Ferne, bei 1 wie neu.
BENCH_COST_NAME=Reparaturkosten an der Werkbank
BENCH_COST_HELP=Komponenten je Werkbank-Reparatur. 0.5 halbiert die Kosten, 2 verdoppelt sie, 0 macht sie kostenlos.
FREE_MEND_NAME=Kostenlos ausbessern über
FREE_MEND_HELP=Über diesem Zustand ist AUSBESSERN an der Werkbank gratis. 100: aus, 0: alles außer Kaputtem.
MOD_LOCK_NAME=Mod-Sperre unter
MOD_LOCK_HELP=Unter diesem Zustand modifiziert eine Werkbank keinen Gegenstand. Bei 1 muss er voll sein, 0 hebt die Sperre auf.
TRADER_PRICE_NAME=Reparaturpreis beim Händler
TRADER_PRICE_HELP=Wie viele Kronkorken ein Händler für eine Reparatur verlangt. 0.5 halbiert den Preis, 2 verdoppelt ihn.
RAW_FOOD_DAYS_NAME=Rohes Essen hält
RAW_FOOD_DAYS_HELP=Spieltage, die rohes Fleisch, Eier und Feldfrüchte halten. 2 sind etwa 2.4 Spielstunden.
COOKED_FOOD_DAYS_NAME=Gekochtes Essen hält
COOKED_FOOD_DAYS_HELP=Spieltage, die gekochtes Essen hält. 7 sind etwa 8.4 Spielstunden.
FRIDGE_SPEED_NAME=Verderben im Kühlschrank
FRIDGE_SPEED_HELP=Wie schnell Essen im Kühlschrank oder in der Kühlbox verdirbt. 0.5 ist halbe Geschwindigkeit.
SPOILED_PER_FERTILIZER_NAME=Verdorbenes Essen pro Dünger
SPOILED_PER_FERTILIZER_HELP=Wie viel verdorbenes Essen eine Chemiestation für 1 Dünger braucht. 0 entfernt die Düngerzeile.
SPOILED_HEALING_NAME=Heilung durch verdorbenes Essen
SPOILED_HEALING_HELP=Heilung und Boni, die verdorbenes Essen außerhalb des Überlebensmodus gibt, in % des frischen Essens. Im Überlebensmodus gibt es keine.
SPOILED_HUNGER_NAME=Sättigung durch verdorbenes Essen
SPOILED_HUNGER_HELP=Hunger und Durst, die verdorbenes Essen im Überlebensmodus stillt, in % des frischen Essens. Der Überlebensmodus stillt mindestens seine kleinste Mahlzeit, auch bei 0.
SPOILED_RADS_NAME=Strahlung durch verdorbenes Essen
SPOILED_RADS_HELP=Wie viel zusätzliche Strahlung verdorbenes Essen gibt. 1 ist normal, 2 doppelt so viel und 0 fügt keine hinzu.
SPOILED_SICKNESS_NAME=Krankheit durch verdorbenes Essen
SPOILED_SICKNESS_HELP=Krankheitschance von verdorbenem Essen im Überlebensmodus, als Vielfaches der von frischem Essen. Essen ohne eigene Chance nimmt die kleinste deiner Ladereihenfolge.

