[Tips]
TIP_WEAR=Состояние оружия и брони ухудшается по мере использования. Изношенное оружие наносит меньше урона, изношенная броня хуже защищает, и то и другое стоит меньше крышек.
TIP_BENCH=На оружейном верстаке и верстаке для создания брони можно чинить изношенное снаряжение с помощью компонентов, из которых оно собрано. Модифицировать его можно, только когда его состояние идеально.
TIP_BENCH_REPAIR=На оружейном верстаке и верстаке для создания брони можно чинить изношенное снаряжение с помощью компонентов, из которых оно собрано.
TIP_BENCH_SUPPLIES=На оружейном верстаке и верстаке для создания брони можно чинить изношенное снаряжение с помощью нескольких расходников, а при сильном износе ещё и компонентов, из которых оно собрано. Модифицировать его можно, только когда его состояние идеально.
TIP_BENCH_REPAIR_SUPPLIES=На оружейном верстаке и верстаке для создания брони можно чинить изношенное снаряжение с помощью нескольких расходников, а при сильном износе ещё и компонентов, из которых оно собрано.
TIP_TRADER=Не хватает компонентов? Оружейники, бронники и портные за крышки починят вам снаряжение своего профиля. Чем богаче ассортимент магазина, тем ближе к новому будет результат.
TIP_BROKEN=Сломавшееся оружие убирается. Сломанная броня остается на вас вместе со всеми бонусами, пока вы ее не снимете. В любом случае сломанное снаряжение нельзя снова взять в руки или надеть, пока его не починят.
TIP_JAM=Изношенное стрелковое оружие может заклинить, и перезаряжаться придется в самый неподходящий момент. Следите за состоянием оружия, на которое вы полагаетесь.
TIP_LOOT=Трофеи редко попадаются в идеальном состоянии. Рейдеры не берегут свое снаряжение, а хорошо экипированные группировки вроде стрелков за своим следят.
TIP_FOOD=Пища портится с каждым днём, медленнее в сумке-холодильнике или холодильнике. Испорченная пища слабо лечит, даёт больше рад и в режиме выживания почти не насыщает. Пункты приготовления пищи её не принимают, но химлаборатория превращает её в удобрение.

