PERK_DISCOUNT_BOTH=Оружие и броня, собранные в основном из модификаций этой способности, требуют на {0}% меньше компонентов при ремонте на верстаке.
PERK_SCRAPPER=Запасные экземпляры для ремонта оружия и брони на верстаке восстанавливают больше состояния.
