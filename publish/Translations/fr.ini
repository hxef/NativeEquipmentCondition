[Tips]
TIP_WEAR=L'état des armes et des armures se dégrade à l'usage. Une arme usée inflige moins de dégâts, une armure usée protège moins, et toutes deux valent moins de capsules.
TIP_BENCH=Utilisez un établi d'armes ou un établi d'armures pour réparer l'équipement usé avec les composants dont il est fait. Seul un équipement en parfait état peut être modifié.
TIP_BENCH_REPAIR=Utilisez un établi d'armes ou un établi d'armures pour réparer l'équipement usé avec les composants dont il est fait.
TIP_TRADER=À court de composants ? Armuriers, marchands d'armures et tailleurs réparent leur type d'équipement contre des capsules. Plus la boutique est fournie, plus la réparation se rapproche du neuf.
TIP_BROKEN=Une arme qui se brise est rangée. Une armure brisée reste portée, bonus compris, jusqu'à ce que vous l'enleviez. Dans les deux cas, un équipement brisé ne peut plus être équipé avant d'être réparé.
TIP_JAM=Les armes à feu usées peuvent s'enrayer et vous forcer à recharger au pire moment. Gardez en bon état les armes sur lesquelles vous comptez.
TIP_LOOT=Le butin est rarement en parfait état. Les pillards malmènent leur équipement, alors que les factions bien équipées comme les Artilleurs prennent soin du leur.
TIP_FOOD=La nourriture s'avarie au fil des jours, moins vite dans une glacière ou un réfrigérateur. La nourriture avariée soigne peu, donne plus de rads et nourrit à peine en mode Survie. Les postes de cuisine la refusent, mais un atelier de chimie la transforme en engrais.

