[Tips]
TIP_WEAR=武器和装甲的状况会随着使用而下降。损耗的武器伤害较低，损耗的装甲防护力较差，两者能换得的瓶盖也会变少。
TIP_BENCH=使用武器工作台或装甲工作台，以制作装备的元件修理损耗的装备。装备状况需完好才能改造。
TIP_TRADER=元件不够用吗？武器店、装甲店和服饰店可以收取瓶盖，修理自家经营的那类装备。店里货色越齐全，就能修得越接近全新。
TIP_BROKEN=损坏的武器会被收起。损坏的装甲会连同加成效果一直穿在身上，直到你脱下为止。无论哪种情况，损坏的装备都必须修理后才能再次装备。
TIP_JAM=状况低于一半的枪支可能会卡弹，让你在最糟的时机被迫重新装填。记得让你依赖的武器保持良好状况。
TIP_LOOT=战利品很少是完好如新的状况。掠夺者不爱惜装备，而像“枪手”这样装备精良的派系则会好好保养。

