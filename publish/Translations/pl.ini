ARMOR_WEAR_RATE_HELP=Jak szybko zużywa się twój pancerz. 1 to normalnie, 2 to 2 razy szybciej, a 0 wyłącza zużycie.
NPC_ARMOR_WEAR_RATE_NAME=Szybkość zużycia pancerzy NPC
NPC_ARMOR_WEAR_RATE_HELP=Jak szybko zużywają się pancerze NPC. 1 to normalnie, 0.33 to 3 razy wolniej, a 0 wyłącza zużycie.

[Page numbers]
DAMAGE_FLOOR_NAME=Obrażenia przy stanie 0
DAMAGE_FLOOR_HELP=Ile obrażeń zachowuje broń w stanie 0. Przy 1 zużycie nigdy ich nie obniża.
WEAPON_START_NAME=Kary dla broni poniżej
WEAPON_START_HELP=Poniżej tego stanu zużycie osłabia broń. Przy 0.5 broń działa jak nowa aż do połowy stanu.
ARMOR_FLOOR_NAME=Ochrona przy stanie 0
ARMOR_FLOOR_HELP=Ile ochrony zachowuje pancerz w stanie 0. Przy 1 zużycie nigdy jej nie obniża.
ARMOR_START_NAME=Kary dla pancerza poniżej
ARMOR_START_HELP=Poniżej tego stanu zużycie obniża ochronę pancerza. Przy 0.5 pancerz chroni jak nowy aż do połowy stanu.
VALUE_EXPONENT_NAME=Spadek ceny przy zużyciu
VALUE_EXPONENT_HELP=Jak szybko zużyte przedmioty tracą wartość. Przy 1.5 zużyte w połowie są warte 35%. 0 zachowuje cenę.
FIRE_RATE_FLOOR_NAME=Szybkostrzelność przy stanie 0
FIRE_RATE_FLOOR_HELP=Jak szybko broń automatyczna strzela jeszcze w stanie 0. Przy 1 zużycie nigdy jej nie spowalnia.
CRIT_METER_FLOOR_NAME=Trafienia krytyczne przy stanie 0
CRIT_METER_FLOOR_HELP=Ile trafień krytycznych zachowuje broń w stanie 0, u ciebie i u NPC. Przy 1 zużycie ich nie obniża.
ACCURACY_FLOOR_NAME=Celność przy stanie 0
ACCURACY_FLOOR_HELP=Celność broni palnej w stanie 0. Przy 0.75 rozrzut rośnie o jedną trzecią. Przy 1 zużycie jej nie obniża.
RANGE_FLOOR_NAME=Zasięg przy stanie 0
RANGE_FLOOR_HELP=Jak daleko broń palna w stanie 0 zachowuje obrażenia. Przy 0 trafia jak z daleka, przy 1 jak nowa.
BENCH_COST_NAME=Koszt naprawy w pracowni
BENCH_COST_HELP=Komponenty na naprawę w pracowni. 0.5 to połowa kosztu, 2 to podwójny, a 0 to darmowa naprawa.
FREE_MEND_NAME=Darmowa poprawka powyżej
FREE_MEND_HELP=Powyżej tego stanu POPRAW jest darmowe. 100 to wyłącza, a 0 poprawia wszystko poza zepsutym.
TRADER_PRICE_NAME=Cena naprawy u handlarzy
TRADER_PRICE_HELP=Ile kapsli handlarz chce za naprawę. 0.5 zmniejsza cenę o połowę, a 2 ją podwaja.

