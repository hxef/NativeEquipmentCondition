NPC_WEAR_RATE_HELP=Jak szybko zużywa się broń NPC. 1 to normalnie, 0.33 to 3 razy wolniej, a 0 wyłącza zużycie.
AUTO_WEAR_RATE_NAME=Szybkość zużycia broni automatycznej
AUTO_WEAR_RATE_HELP=Mnoży szybkości powyżej przy strzelaniu lub cięciu. 1 to normalnie, 2 podwaja, a 0 wyłącza zużycie.
