[Tips]
TIP_WEAR=Stan broni i pancerzy pogarsza się wraz z użytkowaniem. Zużyta broń zadaje mniejsze obrażenia, zużyty pancerz słabiej chroni, a jedno i drugie jest warte mniej kapsli.
TIP_BENCH=Korzystaj z pracowni rusznikarskiej lub płatnerskiej, aby naprawiać zużyty sprzęt za pomocą komponentów, z których go zbudowano. Sprzęt można modyfikować dopiero wtedy, gdy jego stan jest idealny.
TIP_TRADER=Brakuje ci komponentów? Rusznikarze, płatnerze i krawcy naprawiają za kapsle sprzęt, którym handlują. Im lepiej zaopatrzony sklep, tym bardziej zbliży sprzęt do stanu fabrycznego.
TIP_BROKEN=Broń, która się zepsuje, zostaje schowana. Zepsuty pancerz pozostaje na tobie wraz z premiami, dopóki go nie zdejmiesz. Tak czy inaczej, w zepsuty sprzęt wyposażysz się ponownie dopiero po naprawie.
TIP_JAM=Broń palna w stanie poniżej połowy może się zacinać, wymuszając przeładowanie w najgorszym możliwym momencie. Dbaj o dobry stan broni, na której polegasz.
TIP_LOOT=Łupy rzadko trafiają się w idealnym stanie. Bandyci niszczą swój sprzęt, za to dobrze wyposażone frakcje, takie jak Strzelcy, dbają o swój.

