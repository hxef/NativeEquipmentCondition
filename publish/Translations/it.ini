[Page switches]
JAM_HELP=Con meno di metà condizioni, le tue armi da fuoco possono incepparsi fino alla ricarica. Se disattivato, mai.
SPAWN_CONDITION_HELP=Le armi e le armature che trovi sono già usurate, in base a chi le aveva. Se disattivato, sono nuove.
VENDOR_REPAIR_HELP=Chi vende armi, armature o vestiti ripara i tuoi in cambio di tappi. Se disattivato, solo al banco da lavoro.
LOADING_TIPS_HELP=Aggiunge consigli su usura, riparazioni e bottino alle schermate di caricamento. Se disattivato, nessuno.
HUD_CONDITION_HELP=Barre di condizioni accanto alle munizioni e nell'armatura atomica. Se disattivato, solo nelle schede.
QUICK_CONTAINER_HELP=Mostra le condizioni nell'elenco che appare guardando contenitori e corpi. Se disattivato, non le mostra.
CONFIRM_SCROLL_HELP=Correzione del gioco base. Al banco, la conferma si allarga e scorre. Se disattivato, può restare piccola.
INSPECT_PRICE_HELP=Correzione del gioco base. Dal commerciante, Ispeziona dà il prezzo giusto. Se disattivato, può sbagliare.
TRACE_LOGS_NAME=Registri per segnalare bug
TRACE_LOGS_HELP=Scrive 3 registri in più accanto a NEC.log. Crescono in fretta, quindi attivalo solo per segnalare un bug.

