NPC_WEAR_RATE_HELP=Quão rápido as armas dos NPCs se desgastam. 1 é o normal, 0.33 é um terço e 0 impede o desgaste.
AUTO_WEAR_RATE_NAME=Velocidade de desgaste das armas automáticas
AUTO_WEAR_RATE_HELP=Multiplica as velocidades acima ao disparar ou cortar. 1 é o normal, 2 é o dobro e 0 impede o desgaste.
ARMOR_WEAR_RATE_NAME=Velocidade de desgaste das armaduras
ARMOR_WEAR_RATE_HELP=Quão rápido a sua armadura se desgasta. 1 é o normal, 2 é o dobro e 0 impede o desgaste.
NPC_ARMOR_WEAR_RATE_NAME=Velocidade de desgaste das armaduras dos NPCs
NPC_ARMOR_WEAR_RATE_HELP=Quão rápido as armaduras dos NPCs se desgastam. 1 é o normal, 0.33 é um terço e 0 impede o desgaste.

