; The switch at the top of NEC's main page that turns all of NEC on or off.
NEC_ON_NAME=NECの全機能
NEC_ON_HELP=プレイ中にNEC全体をON/OFFします。OFFならプリセットとNECの他のページが隠れ、武器や防具は今の状態を保ちます
PLAIN_APPAREL_NAME=ふつうの服は消耗しない
PLAIN_APPAREL_HELP=防御力もボーナスもない服は消耗せず、状態も表示されません。OFFなら防具と同じく消耗します
SPAWN_CONDITION_HELP=見つけた武器とアーマーは、出どころと前の持ち主に応じて消耗しています。OFFにすると新品です
VENDOR_REPAIR_HELP=武器、アーマー、服を売る商人がキャップで修理します。OFFでは商人は修理しません
TRADER_SIGN_NAME=商人の修理表示
TRADER_SIGN_HELP=取引画面に、商人が武器、アーマー、服をどこまで修理するかを表示します。OFFでは商人の修理ボックスに表示します
