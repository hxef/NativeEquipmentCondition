fArmorWearRateMult=0.5
fCompanionWearRateMult=0.5
fSettlerWearRateMult=0
fCompanionArmorWearRateMult=0.5
fSettlerArmorWearRateMult=0
fJamStart=0.25
fBenchCostMult=0.5
fFreeMendFrom=90
fSuppliesOnlyFrom=75
