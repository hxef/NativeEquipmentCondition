; NEC food list, an example that changes nothing as it is. Copy it under
; another name, such as MyFood.ini, and remove the ; from the lines you
; want.
;
; 1 food a line: the plugin that adds the food, a bar, the food's form ID
; as FO4Edit shows it, then = and the kind. The first 2 digits of the ID
; never count, and for a light plugin (.esl) only the last 3 do. The kinds
; are raw, crop, cooked and never spoils. A line here overrides NEC's
; own sorting.
;
; The easiest way: find the food's line in NEC.food.log (Documents\My
; Games\Fallout4\F4SE\NEC), copy it here and change the kind.
;
;Fallout4.esm|0366BA = never spoils    ; Salisbury Steak
;MyFoodMod.esp|000802 = raw             ; a mod's food
;
; NEC.food.log lists what each file here sets and any line it skips.
