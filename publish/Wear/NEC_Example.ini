; NEC wear list, an example that changes nothing as it is. Copy it under
; another name, such as MyWeapons.ini, and remove the ; from the lines you
; want.
;
; A line holds wear, damage or both, each followed by its number:
;
;   Plugin|ID = wear 1.5 damage 0.3
;
; That weapon wears 1.5 times as fast as usual. At 0 condition it still hits
; for 0.3 of its full damage, so 30%, and its damage climbs in a straight line
; back to full as its condition rises, as for every other weapon.
;
; ID      the form ID, as FO4Edit shows it, of 1 of these 3:
;         1. a weapon
;         2. a weapon mod, such as a receiver or a blade
;         3. a keyword, such as WeaponTypeMelee1H for every one handed
;            melee weapon or WeaponTypeLaser for every laser weapon
;
; wear    how fast it wears, from 0 to 10. 1 is normal, 2 is double and 0
;         never wears. The CND row on its item card shows the result.
;
; damage  the share of its full damage it still does at 0 condition, from 0
;         to 1. 0.5 is half, and 1 keeps all of it, so wear never lowers it.
;         The MCM slider Damage at 0 condition sets it for every other
;         weapon.
;
;Fallout4.esm|08E736 = damage 0.3            ; Baseball Bat
;Fallout4.esm|04A0A4 = damage 0.4            ; WeaponTypeMelee1H keyword
;Fallout4.esm|187A10 = wear 1.2 damage 0.5   ; a blade for the Combat Knife
;Fallout4.esm|092A86 = wear 0.8 damage 0.9   ; WeaponTypeBallistic keyword
;Fallout4.esm|148338 = wear 1.2              ; a 10mm receiver
;MyWeaponMod.esp|000801 = wear 2             ; a mod's weapon
;
; Good to know:
; * wear comes from the weapon's own line, else from the first line read
;   for 1 of its keywords. Each listed mod on the weapon then multiplies
;   it, up to 10 in all. A 10mm with the receiver above wears 0.8 x 1.2,
;   so 0.96 times the usual.
; * damage comes from the weapon's own line, else from 1 of its mods,
;   else from 1 of its keywords. The first such line read counts.
; * Files are read in name order. A weapon, mod or keyword set again
;   keeps the first number.
; * Mods and keywords count as the weapon has them, so a receiver that
;   makes a gun automatic brings WeaponTypeAutomatic with it.
; * A weapon's line covers only that record. Some unique weapons, such as
;   the Deliverer, have a record of their own.
; * The wear speed sliders in MCM still apply on top of wear.
; * The first 2 digits of an ID never count. For a light plugin (.esl or
;   ESL flagged), write the last 3 digits or the whole ID.
; * NEC.log lists what each file sets and any line it skips.
