[Tips]
TIP_WEAR=Der Zustand von Waffen und Rüstungen verschlechtert sich durch Gebrauch. Eine abgenutzte Waffe richtet weniger Schaden an, eine abgenutzte Rüstung schützt weniger, und beide sind weniger Kronkorken wert.
TIP_BENCH=An einer Waffenwerkbank oder einer Rüstungs-Werkbank kannst du abgenutzte Ausrüstung mit den Komponenten reparieren, aus denen sie besteht. Nur Ausrüstung in einwandfreiem Zustand lässt sich modifizieren.
TIP_BENCH_REPAIR=An einer Waffenwerkbank oder einer Rüstungs-Werkbank kannst du abgenutzte Ausrüstung mit den Komponenten reparieren, aus denen sie besteht.
TIP_TRADER=Keine Komponenten zur Hand? Waffenhändler, Rüstungshändler und Kleiderhändler reparieren ihre Art von Ausrüstung gegen Kronkorken. Je besser der Laden bestückt ist, desto näher kommt die Reparatur dem Neuzustand.
TIP_BROKEN=Eine Waffe, die kaputtgeht, wird weggesteckt. Kaputte Rüstung bleibt samt Boni angelegt, bis du sie ablegst. So oder so lässt sich kaputte Ausrüstung erst nach einer Reparatur wieder anlegen.
TIP_JAM=Schusswaffen, deren Zustand unter die Hälfte fällt, können Ladehemmungen bekommen und dich im ungünstigsten Moment zum Nachladen zwingen. Halte die Waffen, auf die du dich verlässt, gut in Schuss.
TIP_LOOT=Beute ist selten in einwandfreiem Zustand. Raider gehen grob mit ihrer Ausrüstung um, während gut ausgerüstete Fraktionen wie die Gunner ihre pflegen.
TIP_FOOD=Essen verdirbt mit den Tagen, langsamer in einer Kühlbox oder einem Kühlschrank. Verdorbenes Essen heilt wenig, gibt mehr Strahlung und macht im Überlebensmodus kaum satt. Kochstationen nehmen es nicht an, aber eine Laborstation macht Dünger daraus.

