[Page switches]
; The switch at the top of NEC's main page that turns all of NEC on or off.
NEC_ON_NAME=所有NEC功能
NEC_ON_HELP=遊玩時開啟或關閉整個NEC。關閉時，方案和NEC的其他頁面會隱藏，武器和裝甲都保持目前的狀況。
PLAIN_APPAREL_NAME=普通服飾不會磨損
PLAIN_APPAREL_HELP=沒有護甲值或加成的服飾不會磨損，也不顯示狀況。關閉時，會像護甲一樣磨損。
SPAWN_CONDITION_HELP=你找到的武器和裝甲已有損耗，程度取決於來源和原本的持有者。關閉時，皆為全新。
VENDOR_REPAIR_HELP=販售武器、裝甲或服飾的商人會收瓶蓋修理你的同類裝備。關閉時，商人不修理任何裝備。
TRADER_SIGN_NAME=商人修理標示
TRADER_SIGN_HELP=在交易畫面顯示商人可將武器、裝甲和服飾修理到什麼程度。關閉時，改由其修理框顯示。
WORKBENCH_REPAIR_NAME=工作台修理
WORKBENCH_REPAIR_HELP=工作台會修理損耗的武器和裝甲。關閉時，商人仍會修理。同時開啟嗶嗶小子修理，即可如同Fallout 3和New Vegas般修理。
SPARE_REPAIR_NAME=備品修理
SPARE_REPAIR_HELP=身上帶著另一件相同的武器或裝甲（任何改裝皆可）時，在修理框加入使用備品按鈕。嗶嗶小子修理設為Spares only時需要此開關。
PIPBOY_REPAIR_NAME=嗶嗶小子修理
PIPBOY_REPAIR_HELP=在嗶嗶小子中檢查損耗的武器或裝甲並按修理。Spares only會用掉一件備品，Workbench則如同在工作台修理。
UNSCRAPPABLE_SPARES_NAME=不可拆解的備品
UNSCRAPPABLE_SPARES_HELP=拆解按鈕拒絕的裝備可否當備品：不可、僅傳說、或全部，包括原版冰凍槍等獨特物品。
KEEP_SPARE_MODS_NAME=保留備品的改造配件
KEEP_SPARE_MODS_HELP=Off會連同所有改造配件消耗備品。其他選項會退還修理用不到的改造配件，或讓你從清單中挑選。
SPARE_MOD_ROWS_NAME=備品改造配件列
SPARE_MOD_ROWS_HELP=Change顯示清單中每個改造配件增加或減少的數值，例如+3.7%或-4.2%。Result顯示修理達到的狀況，例如64.2%。
REPAIR_BOX_ROW_NAME=修理框開啟時選取
REPAIR_BOX_ROW_HELP=開啟修理框時反白的那一行。沒有備品時，使用備品會選取最高的修理狀況等級。
REPAIR_COLUMNS_NAME=修理列分欄顯示
REPAIR_COLUMNS_HELP=將修理框的各列以欄位對齊。關閉時，每列如原版般置中成一行。
REPAIR_GAINS_NAME=修理框顯示增益
REPAIR_GAINS_HELP=顯示每次修理為物品增加的傷害或抗性。關閉時，修理框不顯示這些增益。
REPAIR_LOCK_NAME=修理鎖定
REPAIR_LOCK_HELP=需要元件的修理須具備製作類輔助能力的等級，每件物品都要最後一級，或其改造配件要求的最高等級。
LOCK_SPARES_NAME=備品也鎖定
LOCK_SPARES_HELP=備品也遵循修理鎖定，只能從你的製作類輔助能力等級允許的狀況開始修理。商人仍可修理。
LOADING_TIPS_HELP=在載入畫面加入損耗、修理、戰利品和食物腐壞的相關提示。關閉時，不會顯示這些提示。
HUD_CONDITION_NAME=武器狀況
HUD_CONDITION_HELP=在彈藥計數旁以狀況條或百分比顯示武器的狀況。Off時不顯示。
POWER_ARMOR_BAR_NAME=動力裝甲儀表板狀況
POWER_ARMOR_BAR_HELP=在動力裝甲儀表板上以狀況條或百分比顯示武器的狀況。Off時不顯示。
QUICK_CONTAINER_NAME=容器清單狀況
QUICK_CONTAINER_HELP=在容器清單的每一行以狀況條或百分比顯示狀況，即看向容器或屍體時彈出的清單。
CARD_CND_NAME=物品資訊狀況
CARD_CND_HELP=在物品資訊上以有框的狀況條或百分比顯示狀況，例如87.4%。Off時物品資訊保持原版，沒有狀況一行。
CARD_WEAR_RATE_NAME=物品資訊顯示損耗速度
CARD_WEAR_RATE_HELP=在狀況旁顯示物品損耗或腐壞的速度，同類一般物品為x1.0。關閉時只顯示狀況。
POWER_ARMOR_CND_NAME=物品資訊顯示動力裝甲狀況
POWER_ARMOR_CND_HELP=將動力裝甲部件的生命值顯示為狀況。其他不變。關閉時顯示原版的生命值。
CND_DECIMALS_NAME=狀況小數位
CND_DECIMALS_HELP=Always顯示98.0%和97.5%。Fractions only顯示98%和97.5%。Off顯示整數。
CND_COLUMN_NAME=UI替換模組清單的狀況欄
CND_COLUMN_HELP=在UI替換模組的嗶嗶小子、交易、容器與工作台清單加入狀況欄。關閉時清單保持不變。
CONFIRM_SCROLL_HELP=原版遊戲修正。工作台確認視窗會放大並可捲動。關閉時，視窗可能維持原本大小。
INSPECT_PRICE_HELP=原版遊戲修正。與商人交易時，檢查物品會顯示正確的買賣價。關閉時，價格可能有誤。
FOOD_SPOILS_HELP=你或同伴帶過的食物，以及屍體上的食物，會隨時間腐壞。關閉時，食物不會腐壞。
FRIDGE_ICON_NAME=冰箱圖示
FRIDGE_ICON_HELP=在冰箱名稱旁與裡面食物的資訊卡上顯示圖示。食物在那裡腐壞得較慢。
TRACE_LOGS_NAME=錯誤回報日誌
TRACE_LOGS_HELP=在NEC.log旁另外寫入5個日誌，協助錯誤回報。日誌增長很快，平常遊玩時請保持關閉。

[Page wear]
WEAR_RATE_NAME=武器損耗速度
WEAR_RATE_HELP=你的武器損耗的速度。1為正常，2為2倍速度，0則停止損耗。
NPC_WEAR_RATE_NAME=其他角色的武器損耗速度
NPC_WEAR_RATE_HELP=其他角色的武器損耗的速度。1為正常，0.33為三分之一速度，0則停止損耗。
AUTO_WEAR_RATE_NAME=自動武器損耗速度
AUTO_WEAR_RATE_HELP=射擊或切割時，乘以上方的損耗速度。1為正常，2為兩倍速度，0則停止損耗。
ARMOR_WEAR_RATE_NAME=裝甲損耗速度
ARMOR_WEAR_RATE_HELP=你的裝甲損耗的速度。1為正常，2為2倍速度，0則停止損耗。
NPC_ARMOR_WEAR_RATE_NAME=其他角色的裝甲損耗速度
NPC_ARMOR_WEAR_RATE_HELP=其他角色的裝甲損耗的速度。1為正常，0.33為三分之一速度，0則停止損耗。
COMPANION_WEAR_RATE_NAME=同伴的武器損耗速度
COMPANION_WEAR_RATE_HELP=你的同伴的武器損耗的速度，疊加在其他角色的武器損耗速度上。1為正常，0則停止損耗。
SETTLER_WEAR_RATE_NAME=居民的武器損耗速度
SETTLER_WEAR_RATE_HELP=你的居民的武器損耗的速度，疊加在其他角色的武器損耗速度上。1為正常，0則停止損耗。
SUPPRESSED_WEAR_RATE_NAME=消音武器損耗速度
SUPPRESSED_WEAR_RATE_HELP=以消音器射擊時，乘以上方的損耗速度。1為正常，2為兩倍速度，0.5為一半速度。
COMPANION_ARMOR_WEAR_RATE_NAME=同伴的裝甲損耗速度
COMPANION_ARMOR_WEAR_RATE_HELP=你的同伴的裝甲損耗的速度，疊加在其他角色的裝甲損耗速度上。1為正常，0則停止損耗。
SETTLER_ARMOR_WEAR_RATE_NAME=居民的裝甲損耗速度
SETTLER_ARMOR_WEAR_RATE_HELP=你的居民的裝甲損耗的速度，疊加在其他角色的裝甲損耗速度上。1為正常，0則停止損耗。

[Page numbers]
DAMAGE_FLOOR_NAME=狀況為0時的傷害
DAMAGE_FLOOR_HELP=武器在狀況為0時保留多少傷害。設為1時，損耗不會降低傷害。
WEAPON_START_NAME=武器懲罰開始的狀況
WEAPON_START_HELP=在此狀況時，損耗開始降低武器的性能，狀況條也會標示此處。設為0.5時，武器在狀況降到一半前都如同全新。
ARMOR_FLOOR_NAME=狀況為0時的防護
ARMOR_FLOOR_HELP=裝甲在狀況為0時保留多少防護。設為1時，損耗不會降低防護。
ARMOR_START_NAME=裝甲懲罰開始的狀況
ARMOR_START_HELP=在此狀況時，損耗開始降低裝甲的防護，狀況條也會標示此處。設為0.5時，裝甲在狀況降到一半前都如同全新。
LOOT_SHIFT_NAME=戰利品狀況偏移
LOOT_SHIFT_HELP=讓每件戰利品偏向損耗或偏向全新。設為-100時找到的一切都損耗到極限，設為100時狀況最好。
LOOT_SURPRISE_NAME=意外戰利品 1/
LOOT_SURPRISE_HELP=意外戰利品會有隨機狀況，與原本的持有者無關。數字越大，意外越罕見。設為0則沒有意外。
LOOT_AREA_NAME=散落戰利品依區域價值
LOOT_AREA_HELP=容器外的戰利品在物資充足的區域狀況較好，在貧乏的區域較差。設為0則關閉，設為2則加倍。
VALUE_EXPONENT_NAME=損耗降低價格
VALUE_EXPONENT_HELP=損耗物品失去價值的速度。設為1.5時，狀況一半的物品值原價35%。設為0則保持原價。
FIRE_RATE_FLOOR_NAME=狀況為0時的射速
FIRE_RATE_FLOOR_HELP=自動武器在狀況為0時仍保有多少射速。設為1時，損耗不會降低射速。
CRIT_METER_FLOOR_NAME=狀況為0時的爆擊
CRIT_METER_FLOOR_HELP=武器在狀況為0時保留多少爆擊，對你和其他角色都適用。設為1時，損耗不會減少爆擊。
ACCURACY_FLOOR_NAME=狀況為0時的準度
ACCURACY_FLOOR_HELP=槍枝在狀況為0時保有多少準度。設為0.75時散布擴大三分之一，設為1時不會降低。
RANGE_FLOOR_NAME=狀況為0時的射程
RANGE_FLOOR_HELP=槍枝在狀況為0時維持傷害的距離比例。設為0時都像遠距離射擊，設為1時不縮短。
JAM_CHANCE_NAME=狀況為0時的卡彈
JAM_CHANCE_HELP=狀況接近0的槍枝卡彈的頻率。設為1時每個彈匣卡一次，設為0.5時每2個彈匣一次，設為0時不會卡彈。
JAM_START_NAME=開始卡彈的狀況
JAM_START_HELP=在此狀況時，你的槍枝開始卡彈，起初很少，狀況越差越常卡彈。重新裝填才能排除。
BENCH_COST_NAME=工作台修理成本
BENCH_COST_HELP=工作台修理在耗材之外所需的元件數量。0.5會使其減半，2則加倍，0則讓所有修理免費。
PERK_COMPONENT_DISCOUNT_NAME=輔助能力元件折扣
PERK_COMPONENT_DISCOUNT_HELP=擁有物品製作類輔助能力的所有等級時，修理所省下的元件。設為50時，4級全滿可省50%，2級可省25%。
SPARE_WORTH_NAME=備品價值
SPARE_WORTH_HELP=一件備品能恢復多少狀況：0.5時等同拆解它所得，1為兩倍，2為四倍。拆解專家的等級也會提高它。
FREE_MEND_NAME=免費修補的狀況
FREE_MEND_HELP=以狀況小數位的寫法，從此狀況起在工作台修補免費。設為100則取消，設為0則全部皆可修補。
MOD_LOCK_NAME=可在工作台改造的狀況
MOD_LOCK_HELP=從此狀況起，可在工作台改造物品。設為100時須為完好狀況，設為0則任何狀況皆可。
REPAIR_SUPPLIES_NAME=保養耗材
REPAIR_SUPPLIES_HELP=工作台修理所需每種保養耗材數量，0為無。槍械和動力近戰武器用油和布料，其他武器用黏著劑，裝甲用黏著劑和布料。
SUPPLIES_ONLY_NAME=僅需耗材的狀況
SUPPLIES_ONLY_HELP=以狀況小數位的寫法，從此狀況起工作台修理不論等級都只需耗材。設為100則關閉。
PERK_LOCK_NAME=輔助能力鎖定
PERK_LOCK_HELP=輔助能力等級不足物品所要求的等級時，鎖定損耗物品的修理。設為100時，4級中差1級可從25%開始修理，差2級則從50%開始。
TRADER_PRICE_NAME=商人修理價格
TRADER_PRICE_HELP=商人修理所收取的瓶蓋數量。0.5會使價格減半，2則加倍。
TRADER_LEEWAY_NAME=其他商品的寬容度
TRADER_LEEWAY_HELP=某類裝備只佔商人庫存的一小部分時，商人會把它修得較低。數值越高，下降越緩。設為0則不修理。
TRADER_FULL_STOCK_NAME=完整修理所需庫存
TRADER_FULL_STOCK_HELP=庫存中同類不同物品達到此數量的商人，可將該類修理至100%。數量較少時則修得較低。
RAW_FOOD_DAYS_NAME=生食物保存
RAW_FOOD_DAYS_HELP=生肉、蛋和作物的保存遊戲天數。2約為2.4小時的遊戲時間。
COOKED_FOOD_DAYS_NAME=熟食物保存
COOKED_FOOD_DAYS_HELP=熟食的保存遊戲天數。7約為8.4小時的遊戲時間。
FRIDGE_SPEED_NAME=冰箱內腐壞速度
FRIDGE_SPEED_HELP=食物在冰箱或冷藏箱中腐壞的速度。0.5為半速。
SPOILED_PER_FERTILIZER_NAME=每份肥料所需腐壞食物
SPOILED_PER_FERTILIZER_HELP=化學工作台製作1份肥料所需的腐壞食物數量。0會移除肥料選項。
SPOILED_HEALING_NAME=腐壞食物的治療
SPOILED_HEALING_HELP=腐壞的食物在生存模式外給予的治療與加成，以新鮮食物的%計。在生存模式中不給予任何治療與加成。
SPOILED_HUNGER_NAME=腐壞食物的飽足
SPOILED_HUNGER_HELP=腐壞的食物在生存模式中填補的飢餓與口渴，以新鮮食物的%計。
SPOILED_RADS_NAME=腐壞食物的輻射
SPOILED_RADS_HELP=腐壞食物在其自身輻射之外額外增加的輻射。1為肉類15、其他食物5，2為兩倍，0則不增加。
SPOILED_SICKNESS_NAME=腐壞食物的疾病
SPOILED_SICKNESS_HELP=腐壞的食物在生存模式中讓你生病的機率，為新鮮食物機率的倍數。

[Page HUD and log]
HUD_BAR_X_NAME=武器狀況距左緣
HUD_BAR_X_HELP=彈藥計數旁狀況的起點，從左緣算起，任何解析度皆同。
HUD_BAR_Y_NAME=武器狀況距上緣
HUD_BAR_Y_HELP=彈藥計數旁狀況的起點，從上緣算起，任何解析度皆同。
HUD_BAR_DEFAULT=預設為{0}。
HUD_BAR_LENGTH_NAME=武器狀況條長度
HUD_BAR_LENGTH_HELP=彈藥計數旁狀況條的長度。1為正常，2為兩倍長。狀況文字的大小不變。
HUD_BAR_THICKNESS_NAME=武器狀況條粗細
HUD_BAR_THICKNESS_HELP=彈藥計數旁狀況條的粗細。1為正常，2為兩倍粗。狀況文字的大小不變。
HUD_BAR_HIDES_NAME=武器狀況隨彈藥計數隱藏
HUD_BAR_HIDES_HELP=射擊後彈藥計數淡出時，旁邊的狀況也會隱藏。近戰武器仍會顯示。關閉時會保留。
HUD_BAR_ALONE_NAME=武器狀況獨立顯示
HUD_BAR_ALONE_HELP=HUD模組隱藏彈藥計數時，狀況仍留在原位。關閉時會隨彈藥計數隱藏。
HUD_BAR_WORD_NAME=武器狀況顯示文字
HUD_BAR_WORD_HELP=在彈藥計數的狀況條或百分比旁顯示狀況文字。關閉時只顯示狀況條或數字。
HUD_BAR_FLIPPED_NAME=翻轉武器狀況條
HUD_BAR_FLIPPED_HELP=讓彈藥計數旁的狀況條從左側填滿，狀況文字位於其左側。關閉時從右側填滿。
HUD_BAR_ONE_LINE_NAME=武器狀況百分比單行顯示
HUD_BAR_ONE_LINE_HELP=在彈藥線旁也以單行顯示武器狀況，例如狀況 87.4%。移離彈藥線時一律單行顯示。
POWER_ARMOR_BAR_X_NAME=動力裝甲儀表板狀況左右位置
POWER_ARMOR_BAR_X_HELP=移動動力裝甲儀表板上的狀況。正值向右移，負值向左移。超出螢幕邊緣時會隱藏。
POWER_ARMOR_BAR_Y_NAME=動力裝甲儀表板狀況上下位置
POWER_ARMOR_BAR_Y_HELP=移動動力裝甲儀表板上的狀況。正值向上移，負值向下移。超出螢幕邊緣時會隱藏。
POWER_ARMOR_BAR_LENGTH_NAME=動力裝甲儀表板狀況條長度
POWER_ARMOR_BAR_LENGTH_HELP=動力裝甲中狀況條的長度。1為正常，2為兩倍長。狀況文字的大小不變。
POWER_ARMOR_BAR_THICKNESS_NAME=動力裝甲儀表板狀況條粗細
POWER_ARMOR_BAR_THICKNESS_HELP=動力裝甲中狀況條的粗細。1為正常，2為兩倍粗。狀況文字的大小不變。
POWER_ARMOR_BAR_WORD_NAME=動力裝甲儀表板狀況顯示文字
POWER_ARMOR_BAR_WORD_HELP=在動力裝甲的狀況條旁或百分比上方顯示狀況文字。關閉時只顯示狀況條或數字。
POWER_ARMOR_BAR_FLIPPED_NAME=翻轉動力裝甲儀表板狀況條
POWER_ARMOR_BAR_FLIPPED_HELP=讓動力裝甲的狀況條從左側填滿，狀況文字位於其左側。關閉時從右側填滿。
PICKUP_BAR_NAME=拾取狀況
PICKUP_BAR_HELP=注視容器外的物品時，在名稱下方以狀況條或百分比顯示狀況，食物則顯示新鮮度。
PICKUP_BAR_X_NAME=拾取狀況左右位置
PICKUP_BAR_X_HELP=移動拾取提示中的狀況。正值向右移，負值向左移。
PICKUP_BAR_Y_NAME=拾取狀況上下位置
PICKUP_BAR_Y_HELP=移動拾取提示中的狀況。正值向上移，負值向下移。
PICKUP_BAR_LENGTH_NAME=拾取狀況條長度
PICKUP_BAR_LENGTH_HELP=拾取提示中狀況條的長度。1為正常，2為兩倍長。狀況文字的大小不變。
PICKUP_BAR_THICKNESS_NAME=拾取狀況條粗細
PICKUP_BAR_THICKNESS_HELP=拾取提示中狀況條的粗細。1為正常，2為兩倍粗。狀況文字的大小不變。
PICKUP_BAR_WORD_NAME=拾取狀況顯示文字
PICKUP_BAR_WORD_HELP=在拾取提示的狀況條旁或百分比前顯示狀況文字。關閉時只顯示狀況條或數字。
PICKUP_BAR_FLIPPED_NAME=翻轉拾取狀況條
PICKUP_BAR_FLIPPED_HELP=讓拾取提示的狀況條從左側填滿，狀況文字位於其左側。關閉時從右側填滿。
PICKUP_BAR_MARK_NAME=拾取狀況懲罰標記
PICKUP_BAR_MARK_HELP=在拾取提示的狀況條上標示懲罰開始之處。關閉時該狀況條不顯示標記。
QUICK_CONTAINER_BAR_FLIPPED_NAME=翻轉容器清單狀況條
QUICK_CONTAINER_BAR_FLIPPED_HELP=讓容器清單每一行的狀況條從右側填滿。關閉時從左側填滿。
QUICK_CONTAINER_AT_RIGHT_NAME=容器清單狀況靠右
QUICK_CONTAINER_AT_RIGHT_HELP=將容器清單每一行的狀況放在該行的右緣。關閉時緊接在物品名稱之後。
QUICK_CONTAINER_WORD_NAME=容器清單狀況顯示文字
QUICK_CONTAINER_WORD_HELP=在容器清單每行的百分比前顯示狀況文字。關閉時只顯示數字。
ITEM_CARD_BAR_THICKNESS_NAME=物品資訊狀況條粗細
ITEM_CARD_BAR_THICKNESS_HELP=物品資訊上狀況條的粗細。1為正常，1.5時幾乎與文字一樣高。
ITEM_CARD_BAR_FLIPPED_NAME=翻轉物品資訊狀況條
ITEM_CARD_BAR_FLIPPED_HELP=讓物品資訊的狀況條從右側填滿。關閉時從左側填滿。
FIGURE_CND_NAME=服裝人形圖狀況
FIGURE_CND_HELP=在嗶嗶小子服裝人形圖的每個身體部位上，以狀況條或百分比顯示該處所穿部件中最低的狀況。
PIPBOY_BAR_THICKNESS_NAME=服裝人形圖狀況條粗細
PIPBOY_BAR_THICKNESS_HELP=嗶嗶小子服裝人形圖上狀況條的粗細。1為正常，2為兩倍粗。上方沒有空間的狀況條會保持較細。
PIPBOY_BAR_FLIPPED_NAME=翻轉服裝人形圖狀況條
PIPBOY_BAR_FLIPPED_HELP=讓嗶嗶小子服裝人形圖上的狀況條從右側填滿。關閉時從左側填滿。
FIGURE_WORD_NAME=服裝人形圖狀況顯示文字
FIGURE_WORD_HELP=在Pip-Boy服裝人形圖的每個數字前顯示狀況文字。關閉時只顯示數字。
PENALTY_MARK_TITLE=懲罰標記
PENALTY_MARK_WIDTH_NAME=懲罰標記寬度
PENALTY_MARK_WIDTH_HELP=狀況條上懲罰標記的寬度。1為正常，2為兩倍寬。
PENALTY_MARK_LINE_NAME=懲罰標記改為線條
PENALTY_MARK_LINE_HELP=以一條淡色線條標示狀況條上懲罰開始之處。關閉時，該處會有2個小缺口切入狀況條。
TRADER_SIGN_X_NAME=商人修理標示左右位置
TRADER_SIGN_X_HELP=移動交易畫面上的標示。正值向右移，負值向左移。兩者皆為0時，由NEC決定位置。
TRADER_SIGN_Y_NAME=商人修理標示上下位置
TRADER_SIGN_Y_HELP=移動交易畫面上的標示。正值向上移，負值向下移。兩者皆為0時，由NEC決定位置。
LOG_LEVEL_NAME=日誌詳細程度
LOG_LEVEL_HELP=NEC.log（位於Documents\My Games\Fallout4\F4SE\NEC）的詳細程度。回報錯誤時請選debug。
LOG_FILES_NAME=保留的日誌檔案
LOG_FILES_HELP=每個日誌保留的檔案數，含最新的一個。下次啟動遊戲時生效。
NEC_VERSION=Fallout 4 {1} 上的 NEC {0}

[Page presets]
