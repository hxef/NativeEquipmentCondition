[Page switches]
JAM_HELP=Sous la moitié de leur état, vos armes à feu peuvent s'enrayer jusqu'au rechargement. Désactivé : jamais.
SPAWN_CONDITION_HELP=Les armes et armures trouvées sont déjà usées, selon leur ancien porteur. Désactivé : elles sont neuves.
VENDOR_REPAIR_HELP=Les marchands d'armes, d'armures ou de vêtements réparent contre des capsules. Désactivé : établis seuls.
LOADING_TIPS_HELP=Ajoute des astuces sur l'usure, les réparations et le butin aux écrans de chargement. Désactivé : aucune.
HUD_CONDITION_HELP=Affiche des barres d'état près des munitions et en armure assistée. Désactivé : l'état reste sur les fiches.
QUICK_CONTAINER_HELP=Affiche l'état dans la liste qui apparaît en visant un conteneur ou un corps. Désactivé : état non affiché.
CONFIRM_SCROLL_HELP=Correctif du jeu de base. À l'établi, la confirmation s'agrandit et défile. Désactivé : parfois petite.
INSPECT_PRICE_HELP=Correctif du jeu de base. Chez un marchand, Examiner affiche le bon prix. Désactivé : prix parfois faux.
TRACE_LOGS_NAME=Journaux pour rapports de bug
TRACE_LOGS_HELP=Écrit 3 journaux de plus près de NEC.log. Ils grossissent vite : activez-les seulement pour un bug.

