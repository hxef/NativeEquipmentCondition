LOCK_SPARES_NAME=予備もロック
LOCK_SPARES_HELP=予備も修理ロックに従い、クラフト系Perkのランクが許す状態からしか修理できません。商人ならそれでも修理できます
LOADING_TIPS_HELP=消耗、修理、戦利品、食料の傷みのヒントをロード画面に追加します。OFFにすると表示されません
HUD_CONDITION_NAME=武器のCND
